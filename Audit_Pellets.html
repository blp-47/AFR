<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body>
<title>Audit First Pellets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout : barre d'en-tête collante + onglets de sections, puis une colonne de fiches de contrôle (max 820px). */
:root{
  --navy:#1a3a6b; --navy-ink:#ffffff;
  --straw:#c08a1e; --straw-soft:#f6ecd6;
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#eef1f6;
  --fg:#17202e; --muted:#5d6878; --line:#d9dee7;
  --ok:#1f7a4a; --ok-soft:#e2f3e9;
  --warn:#a86a00; --warn-soft:#fbefd7;
  --bad:#b3261e; --bad-soft:#fbe4e2;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#22477f; --navy-ink:#ffffff; --straw:#e0ad48; --straw-soft:#3a3120;
  --bg:#10141b; --surface:#19202b; --surface-2:#222a37; --fg:#e8ecf2; --muted:#9aa5b5; --line:#2e3746;
  --ok:#5cc08a; --ok-soft:#173326; --warn:#e0ad48; --warn-soft:#3a3120; --bad:#f08a80; --bad-soft:#3d1f1d; color-scheme:dark }}
:root[data-theme="dark"]{
  --navy:#22477f; --navy-ink:#ffffff; --straw:#e0ad48; --straw-soft:#3a3120;
  --bg:#10141b; --surface:#19202b; --surface-2:#222a37; --fg:#e8ecf2; --muted:#9aa5b5; --line:#2e3746;
  --ok:#5cc08a; --ok-soft:#173326; --warn:#e0ad48; --warn-soft:#3a3120; --bad:#f08a80; --bad-soft:#3d1f1d; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:.01em;text-wrap:balance;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.top-row{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:860px;margin:0 auto}
.top-row h1{font-size:1.35rem;line-height:1.1;flex:1;min-width:0}
.top-row h1 small{display:block;font-family:var(--body);font-weight:500;font-size:.78rem;opacity:.8;letter-spacing:0}
.save-state{font-size:.75rem;opacity:.85;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;max-width:860px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid rgba(255,255,255,.28);background:transparent;color:var(--navy-ink);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--navy-ink);color:var(--navy)}
.tab .cnt{font-variant-numeric:tabular-nums;font-weight:500;opacity:.75;font-size:.78rem}
main{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;flex-direction:column;gap:4px;padding-block:6px 2px}
.sec-head h2{font-size:1.6rem;color:var(--navy)}
:root[data-theme="dark"] .sec-head h2{color:var(--fg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sec-head h2{color:var(--fg)}}
.sec-head p{margin:0;color:var(--muted);max-width:65ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:1.18rem;line-height:1.2}
.card.alert{border-left:5px solid var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;font-size:1rem;font-weight:400;color:var(--fg)}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--straw);outline-offset:1px}
.ref{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:.88rem;display:flex;gap:10px;align-items:flex-start}
.ref .yr{font-family:var(--display);font-weight:700;color:var(--straw);font-size:.95rem;flex:0 0 auto;padding-top:1px}
.ref .txt{min-width:0}
.ref .pill{margin-right:6px}
.ref img{width:84px;height:64px;object-fit:cover;border-radius:6px;flex:0 0 auto;cursor:zoom-in}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 0;min-width:84px;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 6px;font-weight:600;font-size:.95rem;cursor:pointer}
.seg button[aria-pressed="true"].g{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed="true"].m{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.seg button[aria-pressed="true"].b{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.seg button[aria-pressed="true"].n{background:var(--surface-2);border-color:var(--muted);color:var(--fg)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.g{background:var(--ok-soft);color:var(--ok)} .pill.m{background:var(--warn-soft);color:var(--warn)} .pill.b{background:var(--bad-soft);color:var(--bad)} .pill.n{background:var(--surface-2);color:var(--muted)}
.row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.row-top h3{flex:1;min-width:0}
.evo{font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.evo.up{background:var(--ok-soft);color:var(--ok)} .evo.eq{background:var(--surface-2);color:var(--muted)} .evo.down{background:var(--bad-soft);color:var(--bad)}
.photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.thumb{position:relative;width:92px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.thumb button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1;cursor:pointer}
.addphoto{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--line);border-radius:8px;padding:0 12px;height:44px;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer;background:transparent}
.addphoto input{display:none}
.btn{border:none;border-radius:10px;padding:12px 16px;font-weight:700;font-size:1rem;cursor:pointer;background:var(--navy);color:var(--navy-ink)}
.btn.alt{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn.straw{background:var(--straw);color:#1b1407}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.measures{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.note{font-size:.85rem;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;max-width:calc(100% - 32px);text-align:center}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.sigwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.sig canvas{width:100%;height:150px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;display:block}
.cgrid{overflow-x:auto}
.cgrid table{border-collapse:collapse;width:100%;min-width:520px;font-size:.9rem}
.cgrid th,.cgrid td{border:1px solid var(--line);padding:7px;text-align:center}
.cgrid th:first-child,.cgrid td:first-child{text-align:left;font-weight:600}
.cgrid td button{width:100%;min-height:38px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.cgrid td button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:var(--navy-ink)}
.cgrid .old{font-size:.72rem;color:var(--straw);font-weight:700;display:block}
.prel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bad-soft);border-radius:10px;padding:10px}
.hidden-file{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

function openDB(){

function idbPut(store,key,val){ return new Promise(res=>{ if(!idb) return res(false); try{ const tx=idb.transaction(store,'readwrite'); tx.objectStore(store).put(val,key); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);}catch(e){res(false);} }); }
function idbGet(store,key){ return new Promise(res=>{ if(!idb) return res(undefined); try{ const rq=idb.transaction(store).objectStore(store).get(key); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(undefined);}catch(e){res(undefined);} }); }
function idbDel(store,key){ return new Promise(res=>{ if(!idb) return res(false); try{ const tx=idb.transaction(store,'readwrite'); tx.objectStore(store).delete(key); tx.oncomplete=()=>res(true);}catch(e){res(false);} }); }
function idbClear(store){ return new Promise(res=>{ if(!idb) return res(false); try{ const tx=idb.transaction(store,'readwrite'); tx.objectStore(store).clear(); tx.oncomplete=()=>res(true);}catch(e){res(false);} }); }

function h(tag, attrs, ...kids){
  const el=document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v=attrs[k];
    if(k==='class') el.className=v; else if(k==='text') el.textContent=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else if(v===true) el.setAttribute(k,''); else if(v!==false && v!=null) el.setAttribute(k,v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; el.appendChild(typeof c==='string'?document.createTextNode(c):c); }
  return el;
}
function appendAll(el,...kids){ for(const c of kids.flat()){ if(c==null||c===false) continue; el.append(c); } }

/* ─────────── Photos ─────────── */
async function compress(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const max=1600; let w=img.naturalWidth, hh=img.naturalHeight; const k=Math.min(1,max/Math.max(w,hh)); w=Math.round(w*k); hh=Math.round(hh*k);
    const c=document.createElement('canvas'); c.width=w; c.height=hh; c.getContext('2d').drawImage(img,0,0,w,hh);
    const blob = await new Promise(res=>c.toBlob(res,'image/jpeg',0.72));
    return {blob, w, h:hh};
  } finally { URL.revokeObjectURL(url); }
}
async function addPhotos(files, list, rerender){
  for(const f of files){
    try{
      const {blob,w,h:hh} = await compress(f);
      const id = uid();
      await idbPut('photos',id,{blob,w,h:hh});
      photoURL[id]=URL.createObjectURL(blob); photoMeta[id]={w,h:hh};
      list.push(id);
    }catch(e){ toast("Photo illisible, réessayez avec l'appareil photo."); }
  }
  save(); rerender();
}
function photoStrip(list, rerender){
  const wrap=h('div',{class:'photos'});
  list.forEach((id,idx)=>{
    if(!photoURL[id]) return;
    wrap.appendChild(h('div',{class:'thumb'},
      h('img',{src:photoURL[id],alt:'Photo',onclick:()=>lightbox(photoURL[id])}),
      h('button',{type:'button','aria-label':'Supprimer la photo',onclick:async()=>{ list.splice(idx,1); await idbDel('photos',id); save(); rerender(); }},'×')));
  });
  const inp=h('input',{type:'file',accept:'image/*',multiple:true,onchange:e=>{ const fs=[...e.target.files]; e.target.value=''; addPhotos(fs,list,rerender); }});
  wrap.appendChild(h('label',{class:'addphoto'},'📷 Photo',inp));
  return wrap;
}

function sigPad(key,label){

  load();
  let drawing=false, last=null, dirty=false;
  const pos=e=>{ const r=c.getBoundingClientRect(); return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]; };
  c.addEventListener('pointerdown',e=>{ drawing=true; last=pos(e); c.setPointerCapture(e.pointerId); e.preventDefault(); });
  c.addEventListener('pointermove',e=>{ if(!drawing) return; const p=pos(e); ctx.strokeStyle='#1a3a6b'; ctx.lineWidth=3.2; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); last=p; dirty=true; e.preventDefault(); });
  const end=()=>{ if(!drawing) return; drawing=false; if(dirty){ S.sig[key]=c.toDataURL('image/png'); save(); } };
  c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end);
  return h('div',{class:'sig'}, label?h('div',{class:'f'},label):null, c,
    h('button',{type:'button',class:'btn alt',style:'margin-top:6px;padding:6px 12px;font-size:.85rem',onclick:()=>{ S.sig[key]=null; dirty=false; load(); save(); }},'Effacer'));
}

    r2.push(new TableRow({children:[cell(b.t,{bold:true,w:24}),cell(b.r,{w:30}),cell(multi(p.c||'—',{after:0}),{w:32}),cell(p.v==null?'Non évalué':SCALES.lev.opts[p.v],{w:14,bold:true,fill,align:AlignmentType.CENTER})]})); });
  C.push(table(r2));
  const ms=S.mesures;
  if(Object.values(ms).some(Boolean)){
    C.push(H2('Relevés du traitement thermique'));
    C.push(table([hdrRow(['Consigne','T° cuve','T° IR','Temps de séjour','Enregistrement','Filtration air']),
      new TableRow({children:[ms.consigne&&ms.consigne+' °C',ms.tCuve&&ms.tCuve+' °C',ms.tIR&&ms.tIR+' °C',ms.temps&&ms.temps+' min',ms.enreg,ms.filtre].map(v=>cell(v||'—',{align:AlignmentType.CENTER}))}),
      new TableRow({children:['—','78 °C','85–88 °C','≈ 3 min','Non','Non (grilles)'].map(v=>cell('2015 : '+v,{align:AlignmentType.CENTER,color:STRAW,size:16}))})]));
  }
  for(const b of BLOQUANTS){ const p=pt(b.id); if(p.photos.length){ C.push(P(b.t,{bold:true,before:120})); C.push(...await photoParas(p.photos,300)); } }

  // III. Process
  C.push(H1('III. Process de fabrication détaillé'));
  const r3=[hdrRow(['Photo '+yr,'Étape','Rappel 2015'],[34,36,30])];
  for(const st of S.process){
    const ph=[]; for(const id of st.photos.slice(0,2)){ const r=await img(id,190); if(r) ph.push(new Paragraph({children:[r]})); }
    const old=[]; if(st.r) old.push(P(st.r,{size:17,color:'5D6878',after:40})); const o15=st.ph?img15(st.ph,120):null; if(o15) old.push(new Paragraph({children:[o15]}));
    r3.push(new TableRow({children:[cell(ph.length?ph:[P('—')],{w:34}),cell([P(st.t,{bold:true,after:40}),...multi(st.c||'—',{after:40})],{w:36}),cell(old.length?old:[P('—')],{w:30})]}));
  }
  C.push(table(r3));

  // IV–VII grilles
  const roman={bat:'IV',hyg:'V',env:'VI',doc:'VII'};
  for(const k of ['bat','hyg','env','doc']){
    const sec=SECTIONS_CHECK[k]; const opts=SCALES[sec.scale].opts;
    C.push(H1(roman[k]+'. '+sec.title));
    const w=sec.scale==='doc'?[30,10,10,14,36]:[28,9,11,9,13,30];
    const rows=[hdrRow(['',...opts,'2015','Commentaires'],w)];
    sec.items.forEach(it=>{ const p=pt(it.id);
      rows.push(new TableRow({children:[cell(it.t,{bold:true}),...opts.map((o,i)=>cell(box(p.v===i),{align:AlignmentType.CENTER,size:24})),
        cell(it.v==null?'Non vérifié':opts[it.v],{align:AlignmentType.CENTER,color:STRAW,size:16}),cell(multi(p.c||'',{after:0,size:19}))]})); });
    C.push(table(rows));
    const withPh=sec.items.filter(it=>pt(it.id).photos.length);
    for(const it of withPh){ C.push(P(it.t,{bold:true,before:120})); C.push(...await photoParas(pt(it.id).photos,280)); }
  }

  // VIII. Prélèvements
  C.push(H1('VIII. Prélèvements'));
  if(S.prel.length){
    const rows=[hdrRow(['N°','Nature','Lieu / lot','Recherches','Laboratoire','Remarque'])];
    S.prel.forEach((p,i)=>rows.push(new TableRow({children:[String(i+1)+(p.ref?' – '+p.ref:''),p.nature,p.lieu,p.analyses,p.labo,p.rem].map(v=>cell(v||'—'))})));
    C.push(table(rows)); C.push(P('Résultats en annexe dès réception.',{italic:true,before:80}));
  } else C.push(P('Aucun prélèvement réalisé.'));

  // IX. Conclusion
  C.push(H1('IX. Conclusion'));
  const cr=[hdrRow(['',...SCALES.nc.opts,'2015'],[28,15,15,15,15,12])];
  CONCL_ROWS.forEach(r=>cr.push(new TableRow({children:[cell(r.t,{bold:true}),...SCALES.nc.opts.map((o,i)=>cell(box(S.concl.grid[r.id]===i),{align:AlignmentType.CENTER,size:24})),cell(SCALES.nc.opts[r.v],{align:AlignmentType.CENTER,color:STRAW,size:16})]})));
  C.push(table(cr));
  if(S.concl.decision!=null) C.push(new Paragraph({spacing:{before:160,after:160},children:[new TextRun({text:'Décision : ',bold:true}),new TextRun({text:DECISIONS[S.concl.decision],bold:true,color:['1F7A4A','A86A00','B3261E'][S.concl.decision]})]}));
  C.push(...multi(S.concl.texte||'',{after:120}));
  const sigCell=async(name,data)=>{ const k=[P(name,{bold:true,after:60})]; if(data) k.push(new Paragraph({children:[new ImageRun({data:dataURLToBytes(data),transformation:{width:200,height:73}})]})); return cell(k,{w:50}); };
  C.push(P('',{after:200}));
  C.push(new Table({width:{size:100,type:WidthType.PERCENTAGE},borders:{top:{style:BorderStyle.NONE},bottom:{style:BorderStyle.NONE},left:{style:BorderStyle.NONE},right:{style:BorderStyle.NONE},insideHorizontal:{style:BorderStyle.NONE},insideVertical:{style:BorderStyle.NONE}},
    rows:[new TableRow({children:[await sigCell(M.auditeurs,S.sig.auditeur),await sigCell(S.sig.nomAudite||('Pour '+M.fournisseur),S.sig.audite)]})]}));

  const doc=new Document({creator:M.emetteur,title:'Audit '+M.fournisseur+' '+M.date,
    styles:{default:{document:{run:{font:'Calibri',size:21}}}},
    sections:[{properties:{page:{margin:{top:1000,bottom:1000,left:1000,right:1000}}},
      footers:{default:new Footer({children:[new Paragraph({alignment:AlignmentType.RIGHT,children:[new TextRun({text:`Audit ${M.fournisseur} – ${M.date} – page `,size:16,color:'5D6878'}),new TextRun({children:[PageNumber.CURRENT],size:16,color:'5D6878'})]})]})},
      children:C}]});
  return await Packer.toBlob(doc);
}

/* ─────────── Démarrage ─────────── */
async function start(){
  idb = await openDB();
  const saved = await idbGet('kv','state');
  if(saved && saved.v===1){ S=Object.assign(freshState(),saved); setSaveState('Saisies restaurées ✓'); }
  else setSaveState(idb?'Prêt':'Stockage indisponible');
  for(const id of allPhotoIds()){ const r=await idbGet('photos',id); if(r){ photoURL[id]=URL.createObjectURL(r.blob); photoMeta[id]={w:r.w,h:r.h}; } }
  updSub(); render();
  if(window.claude && window.claude.use){
    window.claude.use('downloads').then(ns=>{ downloadsNS=ns; }).catch(()=>{});
    window.claude.use('sample').then(ns=>{ sampleNS=ns; if(ns && current==='con') render(); }).catch(()=>{});
  }
}
updSub(); render();
start();
})();
</script>
