<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portail AFR Élevage</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="AFR_ELEVAGE.png">
  <style>
    :root {
      --primary: #1e3a5f;
      --primary-light: #2c5282;
      --accent: #c53030;
      --bg: #f0f4f8;
      --card-bg: #ffffff;
      --text: #1a202c;
      --text-light: #718096;
      --shadow: 0 4px 15px rgba(0,0,0,0.1);
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
      margin-top: 15px;
    }

    .logo {
      max-width: 200px;
      height: auto;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--primary);
      font-weight: 800;
      letter-spacing: 1px;
    }

    .menu {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu-section {
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 0.9rem;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 12px;
      padding-left: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 18px;
      background: var(--accent);
      border-radius: 2px;
    }

    .menu-btn {
      display: flex;
      align-items: center;
      gap: 15px;
      background: var(--card-bg);
      border: none;
      border-radius: var(--radius);
      padding: 15px;
      width: 100%;
      text-decoration: none;
      color: var(--text);
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .menu-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .menu-btn:active {
      transform: scale(0.98);
    }

    .btn-logo {
      width: 70px;
      height: 45px;
      border-radius: 8px;
      object-fit: contain;
      flex-shrink: 0;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 5px;
    }

    .btn-content {
      flex: 1;
      text-align: left;
    }

    .btn-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 3px;
      color: var(--primary);
    }

    .btn-desc {
      font-size: 0.8rem;
      color: var(--text-light);
    }

    .btn-arrow {
      color: var(--text-light);
      font-size: 1.4rem;
      font-weight: 300;
    }

    .footer {
      margin-top: auto;
      padding-top: 40px;
      text-align: center;
      color: var(--text-light);
      font-size: 0.8rem;
    }

    .version {
      margin-top: 5px;
      font-size: 0.75rem;
      opacity: 0.7;
    }

    /* Animation d'entrée */
    .menu-section {
      opacity: 0;
      transform: translateY(20px);
      animation: slideIn 0.4s ease forwards;
    }

    .menu-section:nth-child(1) { animation-delay: 0.1s; }
    .menu-section:nth-child(2) { animation-delay: 0.2s; }
    .menu-section:nth-child(3) { animation-delay: 0.3s; }

    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Séparateur */
    .separator {
      height: 1px;
      background: linear-gradient(to right, transparent, #cbd5e0, transparent);
      margin: 10px 0;
    }
  </style>
</head>
<body>

<div class="header">
  <img src="AFR_ELEVAGE.png" alt="AFR Élevage" class="logo">
  <h1>PORTAIL AFR</h1>
</div>

<div class="menu">
  
  <!-- AFR 33 -->
  <div class="menu-section">
    <div class="section-title">AFR 33 - Gironde</div>
    
    <a href="Controles%20AFR.html" class="menu-btn">
      <img src="logo_controles33.png" alt="Contrôles 33" class="btn-logo">
      <div class="btn-content">
        <div class="btn-title">Contrôles Soir</div>
        <div class="btn-desc">NV1, NV2, NT1, NT2, ST1, ST2</div>
      </div>
      <div class="btn-arrow">›</div>
    </a>
  </div>

  <!-- AFR 40 -->
  <div class="menu-section">
    <div class="section-title">AFR 40 - Landes</div>
    
    <a href="ControlesSG.html" class="menu-btn">
      <img src="logo_controles40.png" alt="Contrôles 40" class="btn-logo">
      <div class="btn-content">
        <div class="btn-title">Contrôles Soir</div>
        <div class="btn-desc">SG, SG2</div>
      </div>
      <div class="btn-arrow">›</div>
    </a>
  </div>

  <div class="separator"></div>

  <!-- Signalements -->
  <div class="menu-section">
    <div class="section-title">Signalements</div>
    
    <a href="Signalements.html" class="menu-btn">
      <img src="logo_signalements.png" alt="Signalements" class="btn-logo">
      <div class="btn-content">
        <div class="btn-title">Signalements</div>
        <div class="btn-desc">Pannes, incidents, maintenance</div>
      </div>
      <div class="btn-arrow">›</div>
    </a>
  </div>

</div>

<div class="footer">
  <div>AFR Élevage © 2025</div>
  <div class="version">v1.0</div>
</div>

<script>
  // Service Worker registration (optionnel)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>

</body>
</html>
