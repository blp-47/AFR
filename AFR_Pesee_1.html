<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121A16">
<title>AFR — Pesée automatique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   AFR — PESÉE AUTOMATIQUE (reproducteurs Barbarie, insémination artificielle)
   Un bâtiment = un seul sexe. Distribution unimodale.
   Palette issue du plumage du Barbarie :
     noir-vert irisé / blanc os / paille (mâles) / vert d'eau (femelles)
     rouge caroncule (alertes, rejets, hors-objectif)
   ===================================================================== */
:root{
  --iris:#121A16; --iris-haut:#1A2620; --iris-bord:#2A3A32;
  --os:#EDE7DA; --os-faible:#8C9A90;
  --paille:#D9A748; --eau:#5FA394; --caroncule:#C0432F;
  --sexe:var(--eau);              /* teinte du bâtiment courant */
  --r:10px; --pad:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--iris);color:var(--os)}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:940px;margin:0 auto;padding:0 var(--pad)}

.chiffre{font-family:'Barlow Condensed',sans-serif;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--os-faible)}

header{border-bottom:1px solid var(--iris-bord);padding:18px 0 14px;margin-bottom:16px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;line-height:.95}
h1 small{display:block;font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:.14em;
  color:var(--os-faible);font-weight:400;margin-top:6px;text-transform:uppercase}
.source{display:flex;align-items:center;gap:8px}
.pastille{width:7px;height:7px;border-radius:50%;background:var(--paille);flex:none}
.pastille.live{background:var(--eau)}
.btn{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  background:transparent;color:var(--os);border:1px solid var(--iris-bord);border-radius:6px;
  padding:7px 11px;cursor:pointer;transition:border-color .15s}
.btn:hover{border-color:var(--os-faible)}
.btn:focus-visible{outline:2px solid var(--sexe);outline-offset:2px}

/* sélecteur de bâtiment : onglets */
.sites{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.site{flex:none;display:flex;align-items:center;gap:8px;padding:9px 13px;cursor:pointer;
  background:var(--iris-haut);border:1px solid var(--iris-bord);border-radius:8px;color:var(--os-faible);
  font-size:13px;transition:color .15s,border-color .15s}
.site .sx{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700}
.site[aria-selected="true"]{color:var(--os);border-color:currentColor}
.site.f[aria-selected="true"]{color:var(--eau)} .site.m[aria-selected="true"]{color:var(--paille)}
.site:focus-visible{outline:2px solid var(--os);outline-offset:2px}

.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--iris-haut);
  border:1px solid var(--iris-bord);border-radius:var(--r);padding:10px 12px;margin-bottom:14px}
.datebar .jour{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600}
.datebar .bande{font-size:12px;color:var(--os-faible)}
.nav{display:flex;gap:6px}
.nav button{width:34px;height:34px;border-radius:6px;border:1px solid var(--iris-bord);
  background:transparent;color:var(--os);cursor:pointer;font-size:15px;line-height:1}
.nav button:disabled{opacity:.3;cursor:default}
.nav button:focus-visible{outline:2px solid var(--sexe);outline-offset:2px}

.confiance{display:flex;gap:10px;font-size:13px;border-left:3px solid var(--eau);
  background:rgba(95,163,148,.08);border-radius:0 6px 6px 0;padding:9px 12px;margin-bottom:16px}
.confiance.moyenne{border-color:var(--paille);background:rgba(217,167,72,.09)}
.confiance.faible{border-color:var(--caroncule);background:rgba(192,67,47,.10)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--iris-haut);border:1px solid var(--iris-bord);border-radius:var(--r);padding:13px 14px 12px}
.kpi .v{font-size:34px;margin:6px 0 2px}
.kpi .u{font-size:14px;color:var(--os-faible);font-family:'IBM Plex Sans',sans-serif;font-weight:400}
.kpi .sub{font-size:11.5px;color:var(--os-faible)}
.kpi .sub.pos{color:var(--eau)} .kpi .sub.neg{color:var(--caroncule)}

.carte{background:var(--iris-haut);border:1px solid var(--iris-bord);border-radius:var(--r);padding:15px;margin-bottom:16px}
.carte h2{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;margin-bottom:2px}
.carte .note{font-size:12px;color:var(--os-faible);margin-bottom:12px}
canvas{display:block;width:100%}

.legende{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px}
.legende span{display:flex;align-items:center;gap:7px;color:var(--os-faible)}
.puce{width:11px;height:11px;border-radius:2px;flex:none;background:var(--sexe)}
.puce.hors{background:var(--caroncule);opacity:.7}
.trait{width:14px;height:0;border-top:2px dashed var(--os);flex:none}

.queues{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
@media(max-width:560px){.queues{grid-template-columns:1fr}}
.queue{border:1px solid var(--iris-bord);border-radius:8px;padding:11px 12px}
.queue .n{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:600}
.queue .r{font-size:11.5px;color:var(--os-faible);margin-top:3px}
.queue.bas{border-left:3px solid var(--caroncule)}
.queue.centre{border-left:3px solid var(--sexe)}
.queue.haut{border-left:3px solid var(--os-faible)}

.rejets{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media(max-width:720px){.rejets{grid-template-columns:repeat(2,1fr)}}
.rejet{border:1px solid var(--iris-bord);border-radius:8px;padding:10px 11px}
.rejet .n{font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:600}
.rejet .r{font-size:11px;color:var(--os-faible);margin-top:3px}

.reglages{font-size:13px}
.reglages .ligne{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--iris-bord)}
.reglages .ligne:last-child{border-bottom:0}
.reglages .ligne span:last-child{font-family:'IBM Plex Mono',monospace;color:var(--os-faible);text-align:right}

.vide{text-align:center;padding:44px 18px;color:var(--os-faible);font-size:14px}
.vide b{display:block;color:var(--os);font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:600;margin-bottom:8px}
.vide code{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--paille)}
footer{text-align:center;font-size:11px;color:var(--os-faible);padding:8px 0 0;line-height:1.7}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Pesée automatique<small>AFR · Reproducteurs Barbarie</small></h1>
    <div class="source">
      <span class="pastille" id="pastille"></span>
      <span class="eyebrow" id="src-label">Démo</span>
      <button class="btn" id="btn-src">Passer en réel</button>
    </div>
  </header>

  <div class="sites" id="sites" role="tablist" aria-label="Bâtiment"></div>

  <div class="datebar">
    <div>
      <div class="jour" id="jour">—</div>
      <div class="bande" id="bande">—</div>
    </div>
    <div class="nav">
      <button id="prev" aria-label="Jour précédent">‹</button>
      <button id="next" aria-label="Jour suivant">›</button>
    </div>
  </div>

  <div id="contenu"></div>

  <footer>
    Poids indicatifs, non métrologiques. Calibration à consigner.<br>
    AFR · outil de suivi de conduite de bande
  </footer>
</div>

<script>
/* =====================================================================
   AFR — PESÉE AUTOMATIQUE  ·  fichier unique
   ---------------------------------------------------------------------
   CONTEXTE : élevage de reproducteurs en insémination artificielle.
   Mâles et femelles sont logés séparément -> UN BÂTIMENT = UN SEXE.
   La distribution des poids est donc UNIMODALE, et le CV mesure
   réellement l'homogénéité du lot (pas un artefact de dimorphisme).

   Conséquence importante : la fourchette d'acceptation peut être
   RESSERRÉE autour de la moyenne du lot, ce qui rend la détection de
   deux animaux sur le plateau bien plus fiable.

   ---------------------------------------------------------------------
   SCHÉMA FIREBASE ATTENDU (écrit par l'ESP32)

     /pesee/{site}/{AAAA-MM-JJ}/
        bande   : "NV2-2026-01"
        valides : [ {p:2780, t:1751...}, ... ]      p = grammes, t = epoch s
        rejets  : { sous_mini:.., sur_maxi:.., instable:.., sans_retour_zero:.. }
        objectif: 2800                              (g — courbe ORVIA du jour)

   Une pesée valide = poids dans la fourchette glissante
                    + stable sur stab_n échantillons
                    + retour à zéro avant la suivante.
   ===================================================================== */

const FIREBASE = { databaseURL: "", site: "NV2" };

/* Bâtiments suivis. Un seul sexe par bâtiment. */
const SITES = [
  {id:"NV2", sexe:"F", libelle:"NV2 · femelles", bande:"NV2-2026-01"},
  {id:"NT1", sexe:"F", libelle:"NT1 · femelles", bande:"NT1-2026-02"},
  {id:"ST3", sexe:"M", libelle:"ST3 · mâles",    bande:"ST3-2025-11"}
];

/* Paramètres firmware (miroir ESP32) */
const PARAMS = {
  fourchette_pct: 35,   // % — demi-largeur de la fourchette autour de la moyenne de la veille
  plancher: 800,        // g — garde-fou absolu (patte seule)
  plafond: 9000,        // g — garde-fou absolu (deux animaux)
  stab_pct: 2.0,        // % — fenêtre de stabilité
  stab_n: 25,           // échantillons stables consécutifs
  cadence: 80           // Hz
};

const UNIF_PCT = 10;    // ± % autour de la moyenne : indice d'uniformité (usage avicole)

/* =====================================================================
   1. DÉMO
   ===================================================================== */
function alea(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function gauss(rnd){ let u=0,v=0; while(u===0)u=rnd(); while(v===0)v=rnd();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const JOURS_DEMO = 30;

/* Profils par sexe : les reproducteurs adultes évoluent lentement. */
const PROFIL = {
  F: {base:2740, pente:6,  cv:0.061},   // femelle Barbarie ~2,74 -> 2,92 kg
  M: {base:5020, pente:11, cv:0.069}    // mâle    Barbarie ~5,02 -> 5,34 kg
};

function genererDemo(siteId){
  const site = SITES.find(s=>s.id===siteId);
  const pr   = PROFIL[site.sexe];
  const jours = [];
  const auj = new Date(); auj.setHours(0,0,0,0);
  const graine = siteId.split("").reduce((a,c)=>a+c.charCodeAt(0),0);

  for(let d = JOURS_DEMO-1; d >= 0; d--){
    const date = new Date(auj); date.setDate(auj.getDate()-d);
    const rnd = alea(graine*100 + d);
    const j = JOURS_DEMO-1-d;

    const mu  = pr.base + j*pr.pente;
    const obj = pr.base + j*pr.pente + 30;        // courbe objectif (à remplacer par ORVIA)

    let n = Math.round(230 + gauss(rnd)*55);
    if(d === 3) n = 31;                            // journée creuse -> alerte de confiance
    if(d === 9) n = Math.round(n*0.55);            // demi-journée
    n = Math.max(10, n);

    // Un lot réel a une queue basse : quelques sujets qui décrochent.
    const valides = [];
    for(let i = 0; i < n; i++){
      let p = mu * (1 + gauss(rnd)*pr.cv);
      if(rnd() < 0.05) p *= 0.86;                  // sujets en retard
      p += gauss(rnd)*18;                          // bruit de mesure
      p = Math.round(p);

      let h; do { h = Math.floor(rnd()*24); } while(rnd() > profilHoraire(h));
      valides.push({p, t: Math.floor(date.getTime()/1000) + h*3600 + Math.floor(rnd()*3600)});
    }
    valides.sort((a,b)=>a.t-b.t);

    jours.push({
      date: isoDate(date), bande: site.bande, objectif: Math.round(obj), valides,
      rejets:{
        sous_mini:        Math.round(n*0.08 + rnd()*5),
        sur_maxi:         Math.round(n*0.04 + rnd()*4),
        instable:         Math.round(n*0.29 + rnd()*11),
        sans_retour_zero: Math.round(n*0.02 + rnd()*2)
      }
    });
  }
  return jours;
}
function profilHoraire(h){
  if(h < 5 || h > 21) return 0.05;
  if(h >= 8 && h <= 11) return 1.0;
  if(h >= 15 && h <= 18) return 0.9;
  return 0.45;
}
function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

/* =====================================================================
   2. STATISTIQUES
   ===================================================================== */
const moyenne = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : 0;
function ecartType(a){
  if(a.length < 2) return 0;
  const m = moyenne(a);
  return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1));
}
const cvPct = a => { const m = moyenne(a); return m ? ecartType(a)/m*100 : 0; };
function mediane(a){
  if(!a.length) return 0;
  const t = [...a].sort((x,y)=>x-y), i = Math.floor(t.length/2);
  return t.length % 2 ? t[i] : (t[i-1]+t[i])/2;
}
/* Indice d'uniformité avicole : part de l'effectif dans ± UNIF_PCT % de la moyenne. */
function uniformite(a){
  if(!a.length) return {bas:0, centre:0, haut:0, pct:0};
  const m = moyenne(a), lo = m*(1-UNIF_PCT/100), hi = m*(1+UNIF_PCT/100);
  const bas = a.filter(p=>p<lo).length, haut = a.filter(p=>p>hi).length;
  const centre = a.length - bas - haut;
  return {bas, centre, haut, pct: centre/a.length*100, lo, hi, m};
}
/* Fourchette glissante : centrée sur la moyenne de la veille. */
function fourchette(moyVeille){
  if(!moyVeille) return {min:PARAMS.plancher, max:PARAMS.plafond, glissante:false};
  const k = PARAMS.fourchette_pct/100;
  return {
    min: Math.max(PARAMS.plancher, Math.round(moyVeille*(1-k))),
    max: Math.min(PARAMS.plafond,  Math.round(moyVeille*(1+k))),
    glissante: true
  };
}

/* =====================================================================
   3. ÉTAT
   ===================================================================== */
let SOURCE = "demo";
let siteId = SITES[0].id;
let JOURS  = [];
let idx    = 0;

const el = id => document.getElementById(id);
const CSS = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const site = () => SITES.find(s=>s.id===siteId);

/* =====================================================================
   4. RENDU
   ===================================================================== */
function jourFR(iso){
  const [a,m,j] = iso.split("-").map(Number);
  return new Date(a,m-1,j).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
}
function confiance(n){
  if(n >= 150) return {c:"",        t:`${n} pesées valides — moyenne fiable.`};
  if(n >= 50)  return {c:"moyenne", t:`${n} pesées valides — moyenne indicative, à confirmer.`};
  return          {c:"faible",  t:`${n} pesées valides — trop peu pour conclure. Vérifiez l'accès au plateau.`};
}

function rendreSites(){
  el("sites").innerHTML = SITES.map(s=>`
    <button class="site ${s.sexe==='M'?'m':'f'}" role="tab" data-id="${s.id}"
            aria-selected="${s.id===siteId}">
      <span class="sx">${s.sexe==='M'?'♂':'♀'}</span><span>${s.libelle}</span>
    </button>`).join("");
  [...el("sites").children].forEach(b => b.onclick = () => {
    siteId = b.dataset.id; FIREBASE.site = siteId; charger();
  });
  document.documentElement.style.setProperty("--sexe", site().sexe==="M" ? CSS("--paille") : CSS("--eau"));
}

function rendre(){
  const jour = JOURS[idx], cont = el("contenu");
  el("pastille").className = "pastille" + (SOURCE==="reel" ? " live" : "");
  el("src-label").textContent = SOURCE==="reel" ? "Firebase" : "Démo";
  el("btn-src").textContent   = SOURCE==="reel" ? "Repasser en démo" : "Passer en réel";

  if(!jour){
    el("jour").textContent = "Aucune donnée"; el("bande").textContent = "—";
    cont.innerHTML = `<div class="carte"><div class="vide"><b>Rien à afficher</b>
      Renseignez <code>FIREBASE.databaseURL</code> en tête du fichier, ou repassez en démo.</div></div>`;
    el("prev").disabled = el("next").disabled = true;
    return;
  }

  el("jour").textContent  = jourFR(jour.date);
  el("bande").textContent = "Bande " + jour.bande + " · " + site().libelle;
  el("prev").disabled = idx <= 0;
  el("next").disabled = idx >= JOURS.length-1;

  const poids = jour.valides.map(v=>v.p);
  const n = poids.length;
  const moy = moyenne(poids), cv = cvPct(poids), med = mediane(poids);
  const u = uniformite(poids);

  const veille = JOURS[idx-1];
  const moyVeille = veille && veille.valides.length ? moyenne(veille.valides.map(v=>v.p)) : null;
  const gmq = moyVeille === null ? null : moy - moyVeille;
  const f = fourchette(moyVeille);

  const obj = jour.objectif || null;
  const ecartObj = obj ? (moy - obj) : null;

  const rej = jour.rejets;
  const totRej = rej.sous_mini + rej.sur_maxi + rej.instable + rej.sans_retour_zero;
  const tauxRej = (totRej + n) ? totRej/(totRej+n)*100 : 0;
  const cf = confiance(n);

  const g   = v => Math.round(v).toLocaleString("fr-FR");
  const kg  = v => (v/1000).toFixed(2).replace(".",",");
  const un  = v => v.toFixed(1).replace(".",",");
  const sgn = v => (v>0?"+":"") + g(v);

  cont.innerHTML = `
    <div class="confiance ${cf.c}"><span>${cf.t}</span></div>

    <div class="kpis">
      <div class="kpi">
        <div class="eyebrow">Pesées valides</div>
        <div class="v chiffre">${n}</div>
        <div class="sub">${un(tauxRej)} % de rejet</div>
      </div>
      <div class="kpi">
        <div class="eyebrow">Poids moyen</div>
        <div class="v chiffre">${kg(moy)}<span class="u"> kg</span></div>
        <div class="sub">${obj ? `objectif ${kg(obj)} kg` : "médiane " + kg(med) + " kg"}</div>
      </div>
      <div class="kpi">
        <div class="eyebrow">Uniformité ±${UNIF_PCT} %</div>
        <div class="v chiffre">${un(u.pct)}<span class="u"> %</span></div>
        <div class="sub">CV ${un(cv)} %</div>
      </div>
      <div class="kpi">
        <div class="eyebrow">GMQ</div>
        <div class="v chiffre">${gmq===null?"—":sgn(gmq)}<span class="u"> g/j</span></div>
        <div class="sub ${ecartObj===null?"":ecartObj>=0?"pos":"neg"}">
          ${ecartObj===null ? "pas d'objectif" : sgn(ecartObj) + " g / objectif"}
        </div>
      </div>
    </div>

    <div class="carte">
      <h2>Distribution du jour</h2>
      <div class="note">
        Lot ${site().sexe==="M"?"de mâles":"de femelles"} — distribution attendue unimodale.
        La bande claire couvre ±${UNIF_PCT} % autour de la moyenne.
      </div>
      <canvas id="histo" height="270"></canvas>
      <div class="legende">
        <span><i class="puce"></i> Dans ±${UNIF_PCT} %</span>
        <span><i class="puce hors"></i> Hors ±${UNIF_PCT} %</span>
        <span><i class="trait"></i> Moyenne</span>
      </div>
      <div class="queues">
        <div class="queue bas">
          <div class="n chiffre">${u.bas}</div>
          <div class="r">Sous ${kg(u.lo)} kg — sujets en retard</div>
        </div>
        <div class="queue centre">
          <div class="n chiffre">${u.centre}</div>
          <div class="r">Dans la fourchette d'uniformité</div>
        </div>
        <div class="queue haut">
          <div class="n chiffre">${u.haut}</div>
          <div class="r">Au-dessus de ${kg(u.hi)} kg</div>
        </div>
      </div>
    </div>

    <div class="carte">
      <h2>Tendance sur ${JOURS.length} jours</h2>
      <div class="note">Poids moyen mesuré et courbe objectif. Le CV est reporté en bas.</div>
      <canvas id="tend" height="230"></canvas>
      <div class="legende">
        <span><i class="puce"></i> Poids moyen mesuré</span>
        <span><i class="trait"></i> Objectif</span>
      </div>
    </div>

    <div class="carte">
      <h2>Activité sur la journée</h2>
      <div class="note">Pesées valides par heure. Un plateau bien placé se remplit aux heures de passage.</div>
      <canvas id="acti" height="150"></canvas>
    </div>

    <div class="carte">
      <h2>Rejets</h2>
      <div class="note">Mesures écartées par le firmware. Un taux qui s'envole signale un plateau instable ou mal placé.</div>
      <div class="rejets">
        <div class="rejet"><div class="n chiffre">${rej.instable}</div><div class="r">Jamais stabilisé</div></div>
        <div class="rejet"><div class="n chiffre">${rej.sous_mini}</div><div class="r">Sous la fourchette</div></div>
        <div class="rejet"><div class="n chiffre">${rej.sur_maxi}</div><div class="r">Au-dessus — deux animaux</div></div>
        <div class="rejet"><div class="n chiffre">${rej.sans_retour_zero}</div><div class="r">Sans retour à zéro</div></div>
      </div>
    </div>

    <div class="carte reglages">
      <h2>Réglages du poste</h2>
      <div class="note">Miroir des paramètres du firmware ESP32.</div>
      <div class="ligne"><span>Fourchette du jour</span>
        <span>${g(f.min)} – ${g(f.max)} g${f.glissante ? "" : " (garde-fous)"}</span></div>
      <div class="ligne"><span>Mode de fourchette</span>
        <span>glissante, moyenne veille ± ${PARAMS.fourchette_pct} %</span></div>
      <div class="ligne"><span>Fenêtre de stabilité</span><span>± ${String(PARAMS.stab_pct).replace(".",",")} %</span></div>
      <div class="ligne"><span>Échantillons stables requis</span><span>${PARAMS.stab_n}</span></div>
      <div class="ligne"><span>Cadence d'échantillonnage</span><span>${PARAMS.cadence} Hz</span></div>
      <div class="ligne"><span>Tare</span><span>auto, plateau vide et stable</span></div>
    </div>`;

  dessinerHisto(poids, u);
  dessinerTendance();
  dessinerActivite(jour.valides);
}

/* ---------- canvas ---------- */
function prep(cv){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = parseInt(cv.getAttribute("height"),10);
  cv.width = w*dpr; cv.height = h*dpr; cv.style.height = h+"px";
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  return {ctx,w,h};
}

function dessinerHisto(poids, u){
  const cvs = el("histo"); if(!cvs || !poids.length) return;
  const {ctx,w,h} = prep(cvs);
  const M = {t:16,r:8,b:26,l:8};
  const min = Math.min(...poids), max = Math.max(...poids);
  const etendue = Math.max(1, max-min);
  const NB = 42, pas = etendue/NB;
  const bins = new Array(NB).fill(0);
  poids.forEach(p => bins[Math.min(NB-1, Math.floor((p-min)/pas))]++);
  const hmax = Math.max(...bins);
  const x0=M.l, x1=w-M.r, y0=M.t, y1=h-M.b;
  const bw = (x1-x0)/NB;
  const X = v => x0 + ((v-min)/etendue)*(x1-x0);

  // bande d'uniformité
  ctx.fillStyle = CSS("--sexe"); ctx.globalAlpha = .08;
  ctx.fillRect(X(u.lo), y0, Math.max(1, X(u.hi)-X(u.lo)), y1-y0);
  ctx.globalAlpha = 1;

  bins.forEach((c,i)=>{
    const centre = min + (i+0.5)*pas;
    const dedans = centre >= u.lo && centre <= u.hi;
    const bh = (c/hmax)*(y1-y0);
    ctx.fillStyle = dedans ? CSS("--sexe") : CSS("--caroncule");
    ctx.globalAlpha = dedans ? .85 : .55;
    ctx.fillRect(x0 + i*bw + .5, y1-bh, bw-1, bh);
  });
  ctx.globalAlpha = 1;

  ctx.strokeStyle = CSS("--iris-bord"); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0,y1+.5); ctx.lineTo(x1,y1+.5); ctx.stroke();

  // moyenne
  const xm = X(u.m);
  ctx.strokeStyle = CSS("--os"); ctx.lineWidth = 1.5; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(xm,y0-4); ctx.lineTo(xm,y1); ctx.stroke(); ctx.setLineDash([]);

  ctx.fillStyle = CSS("--os-faible");
  ctx.font = "11px 'IBM Plex Mono', monospace"; ctx.textBaseline = "top";
  ctx.textAlign="left";  ctx.fillText((min/1000).toFixed(2).replace(".",",")+" kg", x0, y1+7);
  ctx.textAlign="right"; ctx.fillText((max/1000).toFixed(2).replace(".",",")+" kg", x1, y1+7);
}

function dessinerTendance(){
  const cvs = el("tend"); if(!cvs) return;
  const {ctx,w,h} = prep(cvs);
  const M = {t:12,r:10,b:34,l:46};
  const x0=M.l, x1=w-M.r, y0=M.t, y1=h-M.b;

  const moys = JOURS.map(j => moyenne(j.valides.map(v=>v.p)));
  const objs = JOURS.map(j => j.objectif || null);
  const cvs_ = JOURS.map(j => cvPct(j.valides.map(v=>v.p)));
  const tous = [...moys, ...objs.filter(v=>v!==null)];
  if(!tous.length) return;
  let vmin = Math.min(...tous), vmax = Math.max(...tous);
  const pad = (vmax-vmin)*0.25 || 150; vmin -= pad; vmax += pad;

  const X = i => x0 + (i/Math.max(1,JOURS.length-1))*(x1-x0);
  const Y = v => y1 - ((v-vmin)/(vmax-vmin))*(y1-y0);

  ctx.strokeStyle = CSS("--iris-bord"); ctx.lineWidth = 1;
  ctx.fillStyle = CSS("--os-faible");
  ctx.font = "10.5px 'IBM Plex Mono', monospace";
  ctx.textAlign="right"; ctx.textBaseline="middle";
  for(let k=0;k<=3;k++){
    const v = vmin + (k/3)*(vmax-vmin), y = Y(v);
    ctx.beginPath(); ctx.moveTo(x0,y+.5); ctx.lineTo(x1,y+.5); ctx.stroke();
    ctx.fillText((v/1000).toFixed(2).replace(".",","), x0-8, y);
  }

  // objectif
  ctx.strokeStyle = CSS("--os"); ctx.globalAlpha = .55; ctx.lineWidth = 1.5; ctx.setLineDash([5,4]);
  ctx.beginPath(); let s = true;
  objs.forEach((v,i)=>{ if(v===null) return; const x=X(i),y=Y(v); s?(ctx.moveTo(x,y),s=false):ctx.lineTo(x,y); });
  ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;

  // mesuré
  ctx.strokeStyle = CSS("--sexe"); ctx.lineWidth = 2;
  ctx.beginPath(); moys.forEach((v,i)=>{ const x=X(i),y=Y(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();

  ctx.fillStyle = CSS("--sexe");
  ctx.beginPath(); ctx.arc(X(idx), Y(moys[idx]), 4, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = CSS("--iris-haut"); ctx.lineWidth = 2; ctx.stroke();

  ctx.strokeStyle = CSS("--os-faible"); ctx.globalAlpha=.35; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(X(idx),y0); ctx.lineTo(X(idx),y1); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha=1;

  // bandeau CV en pied
  const cmax = Math.max(...cvs_, 1);
  const bh = 16, by = h - 18;
  cvs_.forEach((c,i)=>{
    const bw = (x1-x0)/JOURS.length;
    ctx.fillStyle = c > 10 ? CSS("--caroncule") : CSS("--sexe");
    ctx.globalAlpha = .30 + .55*(c/cmax);
    ctx.fillRect(x0 + i*bw, by, Math.max(1,bw-1.5), bh);
  });
  ctx.globalAlpha = 1;
  ctx.fillStyle = CSS("--os-faible"); ctx.textAlign="left"; ctx.textBaseline="top";
  ctx.fillText("CV quotidien", x0, by+bh+2);
  ctx.textAlign="left"; ctx.textBaseline="top"; ctx.fillText("kg", 6, y0-4);
}

function dessinerActivite(valides){
  const cvs = el("acti"); if(!cvs) return;
  const {ctx,w,h} = prep(cvs);
  const M = {t:10,r:8,b:22,l:8};
  const x0=M.l, x1=w-M.r, y0=M.t, y1=h-M.b;
  const heures = new Array(24).fill(0);
  valides.forEach(v => heures[new Date(v.t*1000).getHours()]++);
  const hmax = Math.max(1, ...heures);
  const bw = (x1-x0)/24;
  heures.forEach((c,i)=>{
    const bh = (c/hmax)*(y1-y0);
    ctx.fillStyle = CSS("--sexe"); ctx.globalAlpha = c ? .75 : .18;
    ctx.fillRect(x0+i*bw+1, y1-Math.max(bh,1.5), bw-2, Math.max(bh,1.5));
  });
  ctx.globalAlpha = 1;
  ctx.strokeStyle = CSS("--iris-bord");
  ctx.beginPath(); ctx.moveTo(x0,y1+.5); ctx.lineTo(x1,y1+.5); ctx.stroke();
  ctx.fillStyle = CSS("--os-faible"); ctx.font="10.5px 'IBM Plex Mono', monospace";
  ctx.textBaseline="top"; ctx.textAlign="center";
  [0,6,12,18].forEach(hh => ctx.fillText(String(hh).padStart(2,"0")+"h", x0+(hh+0.5)*bw, y1+6));
}

/* =====================================================================
   5. DONNÉES
   ===================================================================== */
async function chargerReel(){
  if(!FIREBASE.databaseURL){ JOURS = []; return; }
  const url = `${FIREBASE.databaseURL.replace(/\/$/,"")}/pesee/${siteId}.json`;
  const rep = await fetch(url);
  if(!rep.ok) throw new Error("HTTP " + rep.status);
  const brut = await rep.json();
  if(!brut){ JOURS = []; return; }
  JOURS = Object.keys(brut).sort().map(date=>{
    const j = brut[date] || {};
    let v = j.valides || [];
    if(!Array.isArray(v)) v = Object.values(v);
    return {date, bande:j.bande||site().bande, objectif:j.objectif||null,
      valides:v.filter(x=>x && typeof x.p === "number"),
      rejets:Object.assign({sous_mini:0,sur_maxi:0,instable:0,sans_retour_zero:0}, j.rejets||{})};
  }).filter(j=>j.valides.length);
}

async function charger(){
  rendreSites();
  el("contenu").innerHTML = `<div class="carte"><div class="vide">Chargement…</div></div>`;
  try{
    if(SOURCE === "demo") JOURS = genererDemo(siteId);
    else await chargerReel();
  }catch(err){
    JOURS = [];
    el("contenu").innerHTML = `<div class="carte"><div class="vide"><b>Lecture impossible</b>
      ${String(err.message)}. Vérifiez <code>databaseURL</code>, les règles Firebase,
      et que le site <code>${siteId}</code> existe.</div></div>`;
    el("jour").textContent = "Erreur"; el("bande").textContent = "—";
    return;
  }
  idx = Math.max(0, JOURS.length-1);
  rendre();
}

/* =====================================================================
   6. ÉVÉNEMENTS
   ===================================================================== */
el("prev").onclick = () => { if(idx>0){ idx--; rendre(); } };
el("next").onclick = () => { if(idx<JOURS.length-1){ idx++; rendre(); } };
el("btn-src").onclick = () => { SOURCE = SOURCE==="demo" ? "reel" : "demo"; charger(); };
let redim;
window.addEventListener("resize", ()=>{ clearTimeout(redim); redim = setTimeout(rendre,120); });

charger();
</script>
