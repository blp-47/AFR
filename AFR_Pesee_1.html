/* ---------- canvas ---------- */
/* Infobulle de survol pour les graphiques canvas.
   On enregistre des zones rectangulaires { x, y, w, h, html } ; au survol,
   la zone sous le curseur affiche son texte. Une seule <div> partagée. */
function infobulle(){
  let el = document.getElementById("bulle-graph");
  if(!el){
    el = document.createElement("div");
    el.id = "bulle-graph";
    el.className = "bulle-graph";
    document.body.appendChild(el);
  }
  return el;
}
function survolCanvas(cv, zones){
  const bulle = infobulle();
  cv.onmousemove = (ev) => {
    const r = cv.getBoundingClientRect();
    const x = ev.clientX - r.left, y = ev.clientY - r.top;
    const z = zones.find(z => x>=z.x && x<=z.x+z.w && y>=z.y && y<=z.y+z.h);
    if(z){
      bulle.innerHTML = z.html;
      bulle.style.display = "block";
      bulle.style.left = (ev.clientX + 12) + "px";
      bulle.style.top  = (ev.clientY + 12) + "px";
      cv.style.cursor = "pointer";
    } else {
      bulle.style.display = "none";
      cv.style.cursor = "default";
    }
  };
  cv.onmouseleave = () => { bulle.style.display = "none"; };
}

function prep(cv){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = parseInt(cv.getAttribute("height"),10);
  cv.width = w*dpr; cv.height = h*dpr; cv.style.height = h+"px";
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  return {ctx,w,h};
}

function dessinerHisto(poids, u){
  const cvs = el("histo"); if(!cvs || !poids.length) return;
  const {ctx,w,h} = prep(cvs);
  const M = {t:22,r:8,b:38,l:8};
  const min = Math.min(...poids), max = Math.max(...poids);
  const etendue = Math.max(1, max-min);
  const NB = 42, pas = etendue/NB;
  const bins = new Array(NB).fill(0);
  poids.forEach(p => bins[Math.min(NB-1, Math.floor((p-min)/pas))]++);
  const hmax = Math.max(...bins);
  const x0=M.l, x1=w-M.r, y0=M.t, y1=h-M.b;
  const bw = (x1-x0)/NB;
  const X = v => x0 + ((v-min)/etendue)*(x1-x0);

  // bande d'uniformité
  ctx.fillStyle = CSS("--sexe"); ctx.globalAlpha = .08;
  ctx.fillRect(X(u.lo), y0, Math.max(1, X(u.hi)-X(u.lo)), y1-y0);
  ctx.globalAlpha = 1;

  const zones = [];
  bins.forEach((c,i)=>{
    const centre = min + (i+0.5)*pas;
    const dedans = centre >= u.lo && centre <= u.hi;
    const bh = (c/hmax)*(y1-y0);
    const bx = x0 + i*bw + .5;
    if(c > 0){
      ctx.fillStyle = dedans ? CSS("--sexe") : CSS("--caroncule");
      ctx.globalAlpha = dedans ? .85 : .55;
      ctx.fillRect(bx, y1-bh, bw-1, bh);

      // effectif au-dessus de la barre
      ctx.globalAlpha = 1;
      ctx.fillStyle = CSS("--os-faible");
      ctx.font = "9px 'IBM Plex Mono', monospace";
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.fillText(c, bx + (bw-1)/2, y1-bh-2);

      // zone de survol : borne basse et haute de la tranche
      const lo = min + i*pas, hi = min + (i+1)*pas;
      zones.push({ x:bx, y:y0, w:bw, h:y1-y0,
        html:`<b>${(lo/1000).toFixed(3).replace(".",",")} – ${(hi/1000).toFixed(3).replace(".",",")} kg</b>
              <span>${c} pesée${c>1?"s":""}</span>` });
    }
  });
  ctx.globalAlpha = 1;

  ctx.strokeStyle = CSS("--iris-bord"); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0,y1+.5); ctx.lineTo(x1,y1+.5); ctx.stroke();

  // moyenne
  const xm = X(u.m);
  ctx.strokeStyle = CSS("--os"); ctx.lineWidth = 1.5; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(xm,y0-4); ctx.lineTo(xm,y1); ctx.stroke(); ctx.setLineDash([]);

  // graduations d'axe : min, 3 intermédiaires, max
  ctx.fillStyle = CSS("--os-faible");
  ctx.font = "10.5px 'IBM Plex Mono', monospace"; ctx.textBaseline = "top";
  for(let k=0;k<=4;k++){
    const v = min + (k/4)*etendue, x = X(v);
    const al = k===0 ? "left" : k===4 ? "right" : "center";
    ctx.textAlign = al;
    ctx.strokeStyle = CSS("--iris-bord"); ctx.globalAlpha=.5;
    ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y1+4); ctx.stroke(); ctx.globalAlpha=1;
    ctx.fillText((v/1000).toFixed(2).replace(".",",")+(k===4?" kg":""), x, y1+8);
  }

  survolCanvas(cvs, zones);
}

function dessinerTendance(){
  const cvs = el("tend"); if(!cvs) return;
  const {ctx,w,h} = prep(cvs);
  const M = {t:12,r:10,b:34,l:46};
  const x0=M.l, x1=w-M.r, y0=M.t, y1=h-M.b;

  const moys = JOURS.map(j => moyenne(trierPesees(j.valides).gardees.map(v=>v.p)));
  const objs = JOURS.map(j => objectifDuJour(j));
  const cvs_ = JOURS.map(j => cvPct(trierPesees(j.valides).gardees.map(v=>v.p)));
  const tous = [...moys, ...objs.filter(v=>v!==null)];
  if(!tous.length) return;
  let vmin = Math.min(...tous), vmax = Math.max(...tous);
  const pad = (vmax-vmin)*0.25 || 150; vmin -= pad; vmax += pad;

  const X = i => x0 + (i/Math.max(1,JOURS.length-1))*(x1-x0);
  const Y = v => y1 - ((v-vmin)/(vmax-vmin))*(y1-y0);

  ctx.strokeStyle = CSS("--iris-bord"); ctx.lineWidth = 1;
  ctx.fillStyle = CSS("--os-faible");
  ctx.font = "10.5px 'IBM Plex Mono', monospace";
  ctx.textAlign="right"; ctx.textBaseline="middle";
  for(let k=0;k<=3;k++){
    const v = vmin + (k/3)*(vmax-vmin), y = Y(v);
    ctx.beginPath(); ctx.moveTo(x0,y+.5); ctx.lineTo(x1,y+.5); ctx.stroke();
    ctx.fillText((v/1000).toFixed(2).replace(".",","), x0-8, y);
  }

  // objectif
  ctx.strokeStyle = CSS("--os"); ctx.globalAlpha = .55; ctx.lineWidth = 1.5; ctx.setLineDash([5,4]);
  ctx.beginPath(); let s = true;
  objs.forEach((v,i)=>{ if(v===null) return; const x=X(i),y=Y(v); s?(ctx.moveTo(x,y),s=false):ctx.lineTo(x,y); });
  ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;

  // mesuré
  ctx.strokeStyle = CSS("--sexe"); ctx.lineWidth = 2;
  ctx.beginPath(); moys.forEach((v,i)=>{ const x=X(i),y=Y(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();

  ctx.fillStyle = CSS("--sexe");
  ctx.beginPath(); ctx.arc(X(idx), Y(moys[idx]), 4, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = CSS("--iris-haut"); ctx.lineWidth = 2; ctx.stroke();

  ctx.strokeStyle = CSS("--os-faible"); ctx.globalAlpha=.35; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(X(idx),y0); ctx.lineTo(X(idx),y1); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha=1;

  // bandeau CV en pied
  const cmax = Math.max(...cvs_, 1);
  const bh = 16, by = h - 18;
  cvs_.forEach((c,i)=>{
    const bw = (x1-x0)/JOURS.length;
    ctx.fillStyle = c > 10 ? CSS("--caroncule") : CSS("--sexe");
    ctx.globalAlpha = .30 + .55*(c/cmax);
    ctx.fillRect(x0 + i*bw, by, Math.max(1,bw-1.5), bh);
  });
  ctx.globalAlpha = 1;
  ctx.fillStyle = CSS("--os-faible"); ctx.textAlign="left"; ctx.textBaseline="top";
  ctx.fillText("CV quotidien", x0, by+bh+2);
  ctx.textAlign="left"; ctx.textBaseline="top"; ctx.fillText("kg", 6, y0-4);
}

/* Poids moyen par tranche horaire.
   Objet : séparer la dispersion RÉELLE du lot de la variation liée au
   remplissage du jabot. Le peson pèse 100 canes à un instant donné ; le poste
   pèse toute la journée. Si le poids moyen chute nettement après le repas,
   une part du CV vient de là et non de l'hétérogénéité des animaux. */
function dessinerHoraire(valides, moyJour){
  const cvs = el("horaire");
  if(!cvs) return;
  const {ctx,w,h} = prep(cvs);
  const M = {t:14,r:12,b:34,l:52};
  const x0=M.l, x1=w-M.r, y0=M.t, y1=h-M.b;

  // regroupement par heure
  const par = Array.from({length:24}, () => []);
  valides.forEach(v => par[new Date(v.t*1000).getHours()].push(v.p));
  const heures = par.map((a,i) => ({
    h:i, n:a.length, moy: a.length ? a.reduce((s,x)=>s+x,0)/a.length : null
  })).filter(x => x.n > 0);

  const note = el("horaire-note");
  if(heures.length < 2){
    ctx.fillStyle = CSS("--os-faible");
    ctx.font = "13px 'IBM Plex Sans', sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("Pas encore assez d'heures renseignées.", (x0+x1)/2, (y0+y1)/2);
    if(note) note.textContent = "";
    return;
  }

  // échelle : on cadre sur les heures fiables, sinon une heure à 2 pesées écrase tout
  const fiables = heures.filter(x => x.n >= MIN_PAR_HEURE);
  const base = (fiables.length >= 2 ? fiables : heures).map(x => x.moy);
  let vmin = Math.min(...base), vmax = Math.max(...base);
  const pad = Math.max((vmax-vmin)*0.35, 60);
  vmin -= pad; vmax += pad;

  const hMin = Math.min(...heures.map(x=>x.h)), hMax = Math.max(...heures.map(x=>x.h));
  const X = hh => x0 + ((hh - hMin) / Math.max(1, hMax - hMin)) * (x1 - x0);
  const Y = v  => y1 - ((v - vmin) / (vmax - vmin)) * (y1 - y0);

  // grille
  ctx.strokeStyle = CSS("--iris-bord"); ctx.lineWidth = 1;
  ctx.fillStyle = CSS("--os-faible");
  ctx.font = "10.5px 'IBM Plex Mono', monospace";
  ctx.textAlign="right"; ctx.textBaseline="middle";
  for(let k=0;k<=3;k++){
    const v = vmin + (k/3)*(vmax-vmin), y = Y(v);
    ctx.beginPath(); ctx.moveTo(x0,y+.5); ctx.lineTo(x1,y+.5); ctx.stroke();
    ctx.fillText((v/1000).toFixed(2).replace(".",","), x0-8, y);
  }

  // repère du repas
  if(HEURE_REPAS >= hMin && HEURE_REPAS <= hMax){
    const xr = X(HEURE_REPAS);
    ctx.strokeStyle = CSS("--paille"); ctx.globalAlpha=.55;
    ctx.setLineDash([4,4]); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(xr,y0); ctx.lineTo(xr,y1); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
    ctx.fillStyle = CSS("--paille"); ctx.textAlign="left"; ctx.textBaseline="top";
    ctx.fillText("repas", xr+4, y0);
  }

  // moyenne du jour
  ctx.strokeStyle = CSS("--os"); ctx.globalAlpha=.45; ctx.lineWidth=1.5;
  ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(x0,Y(moyJour)); ctx.lineTo(x1,Y(moyJour)); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha=1;

  // courbe des heures fiables
  ctx.strokeStyle = CSS("--sexe"); ctx.lineWidth = 2;
  ctx.beginPath(); let premier = true;
  heures.forEach(x=>{
    if(x.n < MIN_PAR_HEURE) return;
    const px=X(x.h), py=Y(x.moy);
    premier ? (ctx.moveTo(px,py), premier=false) : ctx.lineTo(px,py);
  });
  ctx.stroke();

  // points + effectif
  const zones = [];
  heures.forEach(x=>{
    const px=X(x.h), py=Y(x.moy);
    const solide = x.n >= MIN_PAR_HEURE;
    ctx.fillStyle = CSS("--sexe"); ctx.globalAlpha = solide ? 1 : .3;
    ctx.beginPath(); ctx.arc(px,py, solide?4:3, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = CSS("--os-faible");
    ctx.font = "9.5px 'IBM Plex Mono', monospace";
    ctx.textAlign="center"; ctx.textBaseline="bottom";
    ctx.fillText("n=" + x.n, px, py-7);
    // survol : heure, poids moyen, effectif
    zones.push({ x:px-11, y:y0, w:22, h:y1-y0,
      html:`<b>${x.h}h – ${x.h+1}h</b>
            <span>${(x.moy/1000).toFixed(3).replace(".",",")} kg · ${x.n} pesée${x.n>1?"s":""}</span>` });
  });
  survolCanvas(cvs, zones);

  // axe des heures
  ctx.strokeStyle = CSS("--iris-bord");
  ctx.beginPath(); ctx.moveTo(x0,y1+.5); ctx.lineTo(x1,y1+.5); ctx.stroke();
  ctx.fillStyle = CSS("--os-faible"); ctx.font="10.5px 'IBM Plex Mono', monospace";
  ctx.textAlign="center"; ctx.textBaseline="top";
  heures.forEach(x=>{ if(x.h % 2 === 0) ctx.fillText(x.h+"h", X(x.h), y1+6); });
  ctx.textAlign="left"; ctx.fillText("kg", 6, y0-2);

  // --- lecture chiffrée
  if(note){
    if(fiables.length < 2){
      note.textContent = "Trop peu d'heures suffisamment garnies pour conclure. Revenez demain.";
      return;
    }
    const mx = fiables.reduce((a,b)=>b.moy>a.moy?b:a);
    const mn = fiables.reduce((a,b)=>b.moy<a.moy?b:a);
    const amp = mx.moy - mn.moy;
    const partCV = amp / moyJour * 100;
    note.innerHTML =
      `Amplitude entre heures : <b>${Math.round(amp)} g</b> — maximum à ${mx.h} h
       (${Math.round(mx.moy)} g), minimum à ${mn.h} h (${Math.round(mn.moy)} g).
       Soit ${partCV.toFixed(1)} % du poids moyen. ` +
      (mx.h <= HEURE_REPAS + 3 && amp > 100
        ? `Le maximum tombe juste après le repas : l'effet jabot est visible.
           Attention cependant — même à +250 g, il n'ajoute qu'environ 0,3 point
           de CV, car les deux tiers des pesées ont lieu jabot déjà vide.
           Il décale la moyenne du matin, il n'explique pas la dispersion.`
        : amp > 200
          ? `Écart marqué mais pas calé sur le repas — à surveiller sur plusieurs jours.`
          : `Écart faible entre les heures : ni le repas ni l'heure de pesée
             n'expliquent votre dispersion.`);
  }
}

function dessinerActivite(valides){
  const cvs = el("acti"); if(!cvs) return;
  const {ctx,w,h} = prep(cvs);
  const M = {t:18,r:8,b:22,l:8};
  const x0=M.l, x1=w-M.r, y0=M.t, y1=h-M.b;
  const heures = new Array(24).fill(0);
  valides.forEach(v => heures[new Date(v.t*1000).getHours()]++);
  const hmax = Math.max(1, ...heures);
  const bw = (x1-x0)/24;
  const total = valides.length;
  const zones = [];
  heures.forEach((c,i)=>{
    const bh = (c/hmax)*(y1-y0);
    const bx = x0+i*bw+1;
    ctx.fillStyle = CSS("--sexe"); ctx.globalAlpha = c ? .75 : .18;
    ctx.fillRect(bx, y1-Math.max(bh,1.5), bw-2, Math.max(bh,1.5));
    if(c > 0){
      // effectif au-dessus de la barre
      ctx.globalAlpha = 1;
      ctx.fillStyle = CSS("--os-faible");
      ctx.font = "9px 'IBM Plex Mono', monospace";
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.fillText(c, bx + (bw-2)/2, y1-bh-2);
      // survol : heure, effectif, part du jour
      zones.push({ x:x0+i*bw, y:y0, w:bw, h:y1-y0,
        html:`<b>${String(i).padStart(2,"0")}h – ${String(i+1).padStart(2,"0")}h</b>
              <span>${c} pesée${c>1?"s":""} · ${(c/total*100).toFixed(0)} % du jour</span>` });
    }
  });
  ctx.globalAlpha = 1;
  ctx.strokeStyle = CSS("--iris-bord");
  ctx.beginPath(); ctx.moveTo(x0,y1+.5); ctx.lineTo(x1,y1+.5); ctx.stroke();
  ctx.fillStyle = CSS("--os-faible"); ctx.font="10.5px 'IBM Plex Mono', monospace";
  ctx.textBaseline="top"; ctx.textAlign="center";
  [0,6,12,18].forEach(hh => ctx.fillText(String(hh).padStart(2,"0")+"h", x0+(hh+0.5)*bw, y1+6));
  survolCanvas(cvs, zones);
}

/* Décharge de l'accu, jour par jour.
   L'échelle est cadrée sur BATT_CRITIQUE – BATT_PLEIN et non sur les seules
   valeurs relevées : une échelle automatique ferait ressembler une dérive de
   20 mV à un effondrement, et ferait remplacer un accu en pleine forme. */
function dessinerAccu(){
  const cvs = el("accu"); if(!cvs) return;
  const a = autonomie(JOURS);
  if(!a.pts.length) return;
  const {ctx,w,h} = prep(cvs);
  const M = {t:14,r:12,b:26,l:48};
  const x0=M.l, x1=w-M.r, y0=M.t, y1=h-M.b;

  const vmin = Math.min(BATT_CRITIQUE - 0.05, ...a.pts.map(p=>p.v)) - 0.05;
  const vmax = Math.max(BATT_PLEIN, ...a.pts.map(p=>p.v));
  const n = a.pts.length;
  const X = i => x0 + (i/Math.max(1,n-1))*(x1-x0);
  const Y = v => y1 - ((v-vmin)/(vmax-vmin))*(y1-y0);

  // grille
  ctx.strokeStyle = CSS("--iris-bord"); ctx.lineWidth = 1;
  ctx.fillStyle = CSS("--os-faible");
  ctx.font = "10.5px 'IBM Plex Mono', monospace";
  ctx.textAlign="right"; ctx.textBaseline="middle";
  for(let k=0;k<=3;k++){
    const v = vmin + (k/3)*(vmax-vmin), y = Y(v);
    ctx.beginPath(); ctx.moveTo(x0,y+.5); ctx.lineTo(x1,y+.5); ctx.stroke();
    ctx.fillText(v.toFixed(2).replace(".",",")+" V", x0-8, y);
  }

  // seuil critique
  ctx.strokeStyle = CSS("--caroncule"); ctx.globalAlpha=.8; ctx.lineWidth=1.5;
  ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(x0,Y(BATT_CRITIQUE)); ctx.lineTo(x1,Y(BATT_CRITIQUE)); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha=1;

  // courbe mesurée
  ctx.strokeStyle = CSS("--sexe"); ctx.lineWidth = 2;
  ctx.beginPath();
  a.pts.forEach((p,i)=>{ const x=X(i), y=Y(p.v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.stroke();

  // projection : prolongement en pointillé jusqu'au seuil critique
  if(a.jours !== null && a.jours > 0 && n > 1){
    const parJour = (x1-x0)/(n-1);
    const xFin = X(n-1) + parJour * a.jours;
    ctx.strokeStyle = CSS("--caroncule"); ctx.globalAlpha=.5;
    ctx.setLineDash([3,3]); ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(X(n-1), Y(a.pts[n-1].v));
    ctx.lineTo(Math.min(xFin, x1), Y(BATT_CRITIQUE));
    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1;
  }

  // points + survol
  const zones = [];
  a.pts.forEach((p,i)=>{
    const x=X(i), y=Y(p.v);
    const c = battClasse(p.v, BATT_ALERTE);
    ctx.fillStyle = CSS(c==="bas" ? "--caroncule" : c==="moyen" ? "--paille" : "--sexe");
    ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2); ctx.fill();
    zones.push({ x:x-9, y:y0, w:18, h:y1-y0,
      html:`<b>${p.date}</b><span>creux ${volts(p.v)}${
        battPct(p.v)!==null ? " · "+battPct(p.v)+" %" : ""}</span>` });
  });
  survolCanvas(cvs, zones);

  // axe des dates
  ctx.strokeStyle = CSS("--iris-bord");
  ctx.beginPath(); ctx.moveTo(x0,y1+.5); ctx.lineTo(x1,y1+.5); ctx.stroke();
  ctx.fillStyle = CSS("--os-faible"); ctx.textAlign="center"; ctx.textBaseline="top";
  const pasEtiq = Math.max(1, Math.ceil(n/6));
  a.pts.forEach((p,i)=>{
    if(i % pasEtiq) return;
    const [,m,j] = p.date.split("-");
    ctx.fillText(j+"/"+m, X(i), y1+6);
  });
}

/* =====================================================================
   5. DONNÉES
   ===================================================================== */
async function chargerReel(){
  if(!FIREBASE.databaseURL){
    JOURS = [];
    DIAG = {type:"pas_url"};
    return;
  }
  const url = `${FIREBASE.databaseURL.replace(/\/$/,"")}/pesee/${siteId}.json`;
  DIAG = {type:"ok", url};
  const rep = await fetch(url);
  if(!rep.ok) throw new Error("HTTP " + rep.status + " sur " + url);
  const brut = await rep.json();
  if(!brut){ JOURS = []; DIAG = {type:"vide", url}; return; }
  JOURS = Object.keys(brut).sort().map(date=>{
    const j = brut[date] || {};
    let v = j.valides || [];
    if(!Array.isArray(v)) v = Object.values(v);
    return {date, bande:j.bande||site().bande, objectif:j.objectif||null,
      /* tension de l'accu, historisée jour par jour (firmware 4.0+).
         /etat est écrasé à chaque envoi : c'est la seule série conservée. */
      batt:     (typeof j.batt === "number")     ? j.batt     : null,
      batt_min: (typeof j.batt_min === "number") ? j.batt_min : null,
      valides:v.filter(x=>x && typeof x.p === "number"),
      rejets:Object.assign({sous_mini:0,sur_maxi:0,instable:0,sans_retour_zero:0}, j.rejets||{})};
  }).filter(j=>j.valides.length);
}

async function charger(){
  rendreSites();
  el("contenu").innerHTML = `<div class="carte"><div class="vide">Chargement…</div></div>`;
  msgCmd = "";
  // on change de bâtiment : la saisie en cours ne le concerne plus
  regSaisie = null; msgReg = "";
  if(sondage){ clearInterval(sondage); sondage = null; }
  try{
    {
      await chargerReel();
      // télémétrie du poste : lue à part, elle doit s'afficher même
      // quand aucune pesée n'existe encore.
      if(FIREBASE.databaseURL){
        try{ ETAT = await fbLire(`/pesee/${siteId}/etat`); }catch(e){ ETAT = null; }
        try{ CMD  = await fbLire(`/pesee/${siteId}/cmd`);  }catch(e){ CMD  = null; }
        // réglages du lot : propres au bâtiment, donc relus à chaque changement
        try{ REGLAGES = await fbLire(`/pesee/${siteId}/reglages`); }catch(e){ REGLAGES = null; }
      }
    }
  }catch(err){
    JOURS = [];
    const m = String(err.message);
    let piste = "";
    if(m.includes("401") || m.includes("403"))
      piste = `<br><br><b style="font-size:14px">Règles de sécurité Firebase</b>
               La base refuse la lecture. Ouvrez <code>/pesee</code> en lecture
               dans les règles, ou ajoutez un jeton.`;
    else if(m.includes("404"))
      piste = `<br><br>URL introuvable : vérifiez <code>databaseURL</code>
               (région incluse, ex. <code>europe-west1</code>).`;
    else if(m.includes("Failed to fetch") || m.includes("NetworkError"))
      piste = `<br><br>Aucune réponse : URL erronée, pas de réseau,
               ou blocage CORS.`;
    el("contenu").innerHTML = `<div class="carte"><div class="vide"><b>Lecture impossible</b>
      <code>${m}</code>${piste}</div></div>`;
    el("jour").textContent = "Erreur"; el("bande").textContent = "—";
    return;
  }
  idx = Math.max(0, JOURS.length-1);
  rendre();

  // actualisation autonome de la maintenance en mode réel
  if(rafraich){ clearInterval(rafraich); rafraich = null; }
  if(SOURCE === "reel") rafraich = setInterval(actualiserEtat, 10000);
}

/* =====================================================================
   6. ÉVÉNEMENTS
   ===================================================================== */
el("prev").onclick = () => { if(idx>0){ idx--; rendre(); } };
el("next").onclick = () => { if(idx<JOURS.length-1){ idx++; rendre(); } };
let redim;
window.addEventListener("resize", ()=>{ clearTimeout(redim); redim = setTimeout(rendre,120); });

charger();
</script>
