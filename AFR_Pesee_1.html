<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121A16">
<title>AFR — Pesée automatique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   AFR — PESÉE AUTOMATIQUE (reproducteurs Barbarie, insémination artificielle)
   Un bâtiment = un seul sexe. Distribution unimodale.
   Palette issue du plumage du Barbarie :
     noir-vert irisé / blanc os / paille (mâles) / vert d'eau (femelles)
     rouge caroncule (alertes, rejets, hors-objectif)
   ===================================================================== */
:root{
  --iris:#121A16; --iris-haut:#1A2620; --iris-bord:#2A3A32;
  --os:#EDE7DA; --os-faible:#8C9A90;
  --paille:#D9A748; --eau:#5FA394; --caroncule:#C0432F;
  --sexe:var(--eau);              /* teinte du bâtiment courant */
  --r:10px; --pad:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--iris);color:var(--os)}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:940px;margin:0 auto;padding:0 var(--pad)}

.chiffre{font-family:'Barlow Condensed',sans-serif;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--os-faible)}

header{border-bottom:1px solid var(--iris-bord);padding:18px 0 14px;margin-bottom:16px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;line-height:.95}
h1 small{display:block;font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:.14em;
  color:var(--os-faible);font-weight:400;margin-top:6px;text-transform:uppercase}
.source{display:flex;align-items:center;gap:8px}
.pastille{width:7px;height:7px;border-radius:50%;background:var(--paille);flex:none}
.pastille.live{background:var(--eau)}
.btn{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  background:transparent;color:var(--os);border:1px solid var(--iris-bord);border-radius:6px;
  padding:7px 11px;cursor:pointer;transition:border-color .15s}
.btn:hover{border-color:var(--os-faible)}
.btn:focus-visible{outline:2px solid var(--sexe);outline-offset:2px}

/* sélecteur de bâtiment : onglets */
.sites{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.site{flex:none;display:flex;align-items:center;gap:8px;padding:9px 13px;cursor:pointer;
  background:var(--iris-haut);border:1px solid var(--iris-bord);border-radius:8px;color:var(--os-faible);
  font-size:13px;transition:color .15s,border-color .15s}
.site .sx{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700}
.site[aria-selected="true"]{color:var(--os);border-color:currentColor}
.site.f[aria-selected="true"]{color:var(--eau)} .site.m[aria-selected="true"]{color:var(--paille)}
.site:focus-visible{outline:2px solid var(--os);outline-offset:2px}

.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--iris-haut);
  border:1px solid var(--iris-bord);border-radius:var(--r);padding:10px 12px;margin-bottom:14px}
.datebar .jour{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600}
.datebar .bande{font-size:12px;color:var(--os-faible)}
.nav{display:flex;gap:6px}
.nav button{width:34px;height:34px;border-radius:6px;border:1px solid var(--iris-bord);
  background:transparent;color:var(--os);cursor:pointer;font-size:15px;line-height:1}
.nav button:disabled{opacity:.3;cursor:default}
.nav button:focus-visible{outline:2px solid var(--sexe);outline-offset:2px}

.confiance{display:flex;gap:10px;font-size:13px;border-left:3px solid var(--eau);
  background:rgba(95,163,148,.08);border-radius:0 6px 6px 0;padding:9px 12px;margin-bottom:16px}
.confiance.moyenne{border-color:var(--paille);background:rgba(217,167,72,.09)}
.confiance.faible{border-color:var(--caroncule);background:rgba(192,67,47,.10)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--iris-haut);border:1px solid var(--iris-bord);border-radius:var(--r);padding:13px 14px 12px}
.kpi .v{font-size:34px;margin:6px 0 2px}
.kpi .u{font-size:14px;color:var(--os-faible);font-family:'IBM Plex Sans',sans-serif;font-weight:400}
.kpi .sub{font-size:11.5px;color:var(--os-faible)}
.kpi .sub.pos{color:var(--eau)} .kpi .sub.neg{color:var(--caroncule)}

.carte{background:var(--iris-haut);border:1px solid var(--iris-bord);border-radius:var(--r);padding:15px;margin-bottom:16px}
.carte h2{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;margin-bottom:2px}
.carte .note{font-size:12px;color:var(--os-faible);margin-bottom:12px}
canvas{display:block;width:100%}

.legende{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px}
.legende span{display:flex;align-items:center;gap:7px;color:var(--os-faible)}
.puce{width:11px;height:11px;border-radius:2px;flex:none;background:var(--sexe)}
.puce.hors{background:var(--caroncule);opacity:.7}
.trait{width:14px;height:0;border-top:2px dashed var(--os);flex:none}

.queues{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
@media(max-width:560px){.queues{grid-template-columns:1fr}}
.queue{border:1px solid var(--iris-bord);border-radius:8px;padding:11px 12px}
.queue .n{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:600}
.queue .r{font-size:11.5px;color:var(--os-faible);margin-top:3px}
.queue.bas{border-left:3px solid var(--caroncule)}
.queue.centre{border-left:3px solid var(--sexe)}
.queue.haut{border-left:3px solid var(--os-faible)}

.rejets{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media(max-width:720px){.rejets{grid-template-columns:repeat(2,1fr)}}
.rejet{border:1px solid var(--iris-bord);border-radius:8px;padding:10px 11px}
.rejet .n{font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:600}
.rejet .r{font-size:11px;color:var(--os-faible);margin-top:3px}

.reglages{font-size:13px}
.reglages .ligne{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--iris-bord)}
.reglages .ligne:last-child{border-bottom:0}
.reglages .ligne span:last-child{font-family:'IBM Plex Mono',monospace;color:var(--os-faible);text-align:right}

/* ---------- vue en direct ---------- */
.live{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px;
  padding:12px;border:1px solid var(--iris-bord);border-radius:8px;background:rgba(255,255,255,.02)}
@media(max-width:720px){.live{grid-template-columns:repeat(2,1fr)}}
.live .lg span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--os-faible);margin-bottom:4px;font-family:'IBM Plex Mono',monospace}
.live .lg b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:26px;
  font-weight:600;line-height:1}
.live .lg i{display:block;font-style:normal;font-size:10.5px;color:var(--os-faible);margin-top:4px}
.live .m-VIDE{color:var(--eau)}
.live .m-OCCUPE{color:var(--paille)}
.live .m-ATTENTE_ZERO{color:var(--os-faible)}
.live .bon{color:var(--eau)} .live .moyen{color:var(--paille)} .live .mauvais{color:var(--caroncule)}

/* ---------- maintenance ---------- */
.telem{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}
@media(max-width:720px){.telem{grid-template-columns:repeat(2,1fr)}}
.telem>div{border:1px solid var(--iris-bord);border-radius:8px;padding:9px 10px}
.telem span{display:block;font-size:11px;color:var(--os-faible);margin-bottom:3px}
.telem b{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:600}
.telem b.ok{color:var(--eau)} .telem b.ko{color:var(--caroncule)}

/* ---------- accu / niveau de batterie ----------
   La jauge répète en couleur ce que le chiffre dit déjà. Sur un téléphone
   consulté trois secondes au milieu d'un bâtiment, la couleur passe ; la
   deuxième décimale, non. */
.jauge{height:5px;border-radius:3px;background:rgba(255,255,255,.09);
  margin-top:6px;overflow:hidden}
.jauge i{display:block;height:100%;border-radius:3px;background:var(--eau);
  transition:width .3s}
.jauge.moyen i{background:var(--paille)}
.jauge.bas i{background:var(--caroncule)}
.telem b.bat-bon{color:var(--eau)}
.telem b.bat-moyen{color:var(--paille)}
.telem b.bat-bas{color:var(--caroncule)}
.accu-tete{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  flex-wrap:wrap;margin-bottom:10px}
.accu-tete .gros{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:600;
  line-height:1;font-variant-numeric:tabular-nums}
.accu-tete .gros.bon{color:var(--eau)}
.accu-tete .gros.moyen{color:var(--paille)}
.accu-tete .gros.bas{color:var(--caroncule)}
.accu-tete .verdict{font-size:12.5px;color:var(--os-faible);text-align:right;flex:1;min-width:180px}
.accu-tete .verdict b{color:var(--os)}

/* ---------- zone de réglage du lot ---------- */
.reg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:620px){.reg{grid-template-columns:1fr}}
.reg label{display:block}
.reg label>span{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--os-faible);margin-bottom:5px}
.reg input{width:100%;background:var(--iris);color:var(--os);
  border:1px solid var(--iris-bord);border-radius:6px;padding:9px 10px;
  font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:600;
  font-variant-numeric:tabular-nums}
.reg input:focus-visible{outline:2px solid var(--sexe);outline-offset:1px}
.reg label>i{display:block;font-style:normal;font-size:11px;
  color:var(--os-faible);margin-top:5px;line-height:1.35}
.apercu{margin-top:13px;padding:10px 12px;border-radius:6px;font-size:12.5px;
  border-left:3px solid var(--sexe);background:rgba(255,255,255,.03);line-height:1.5}
.apercu b{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--os)}

.avis{font-size:12.5px;border-left:3px solid var(--caroncule);
  background:rgba(192,67,47,.10);border-radius:0 6px 6px 0;padding:9px 11px;margin-bottom:12px}
.avis.dodo{border-color:var(--os-faible);background:rgba(255,255,255,.04);color:var(--os-faible)}
.telem i{display:block;font-style:normal;font-size:10.5px;color:var(--os-faible);margin-top:2px}
.btn.mini{padding:5px 9px;font-size:10px}
.statut{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.statut .actions{display:flex;gap:6px;flex:none}

.maint{display:flex;flex-direction:column;gap:10px}
.etape{display:flex;align-items:center;gap:12px;border:1px solid var(--iris-bord);
  border-radius:8px;padding:11px 12px}
.etape .num{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--sexe);
  color:var(--sexe);display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px}
.etape .txt{flex:1;font-size:13px;color:var(--os-faible);line-height:1.4}
.etape .txt b{color:var(--os)}
.etape .txt u{text-decoration:underline;text-underline-offset:2px}
.masse{display:flex;align-items:center;gap:7px;margin-top:7px}
.masse input{width:96px;background:var(--iris);color:var(--os);border:1px solid var(--iris-bord);
  border-radius:5px;padding:6px 8px;font-family:'IBM Plex Mono',monospace;font-size:13px}
.masse input:focus-visible{outline:2px solid var(--sexe);outline-offset:1px}
.masse span{font-size:12px;color:var(--os-faible)}
.btn.act{flex:none;border-color:var(--sexe);color:var(--sexe)}
.btn.act:hover:not(:disabled){background:rgba(255,255,255,.04)}
.btn.act:disabled{opacity:.35;cursor:default}

.statut{margin-top:12px;padding:9px 11px;border-radius:6px;font-size:12.5px;
  color:var(--os-faible);background:rgba(255,255,255,.03)}
.statut.attente{border-left:3px solid var(--paille);background:rgba(217,167,72,.09);color:var(--os)}

/* ---------- liste des pesées ---------- */
.tablo{max-height:340px;overflow-y:auto;border:1px solid var(--iris-bord);border-radius:8px}
.tablo table{width:100%;border-collapse:collapse;font-size:13px}
.tablo thead th{position:sticky;top:0;background:var(--iris-haut);text-align:left;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--os-faible);font-weight:400;
  padding:9px 12px;border-bottom:1px solid var(--iris-bord)}
.tablo td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04)}
.tablo tbody tr:last-child td{border-bottom:0}
.tablo .n{color:var(--os-faible);font-family:'IBM Plex Mono',monospace;font-size:11px;width:44px}
.tablo .h{font-family:'IBM Plex Mono',monospace;color:var(--os-faible);width:88px}
.tablo .p{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:600}
.tablo .e{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--os-faible);text-align:right}
.tablo .e.loin{color:var(--caroncule)}
.tablo tr.exclue td{color:var(--os-faible);opacity:.5}
.tablo tr.exclue .p{text-decoration:line-through}
.tablo tr.exclue .e{font-style:italic}

/* ---------- comparatif par fenêtre horaire ---------- */
.fenetres{margin-top:14px;border:1px solid var(--iris-bord);border-radius:8px;overflow:hidden}
.fenetres table{width:100%;border-collapse:collapse;font-size:13px}
.fenetres th{background:var(--iris-haut);text-align:left;padding:8px 12px;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--os-faible);font-weight:400;
  border-bottom:1px solid var(--iris-bord)}
.fenetres td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04)}
.fenetres tbody tr:last-child td{border-bottom:0}
.fenetres .num{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px}
.fenetres tbody tr:first-child{background:rgba(255,255,255,.03)}

/* ---------- infobulle de survol des graphiques ---------- */
.bulle-graph{position:fixed;z-index:100;display:none;pointer-events:none;
  background:var(--iris-haut);border:1px solid var(--iris-bord);border-radius:7px;
  padding:7px 10px;font-size:12px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.45);
  max-width:220px}
.bulle-graph b{display:block;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--os)}
.bulle-graph span{color:var(--os-faible);font-size:11.5px}

.vide{text-align:center;padding:44px 18px;color:var(--os-faible);font-size:14px}
.vide b{display:block;color:var(--os);font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:600;margin-bottom:8px}
.vide code{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--paille)}
footer{text-align:center;font-size:11px;color:var(--os-faible);padding:8px 0 0;line-height:1.7}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Pesée automatique<small>AFR · Reproducteurs Barbarie</small></h1>
    <div class="source">
      <span class="pastille" id="pastille"></span>
      <span class="eyebrow" id="src-label">Démo</span>
    </div>
  </header>

  <div class="sites" id="sites" role="tablist" aria-label="Bâtiment"></div>

  <div class="datebar">
    <div>
      <div class="jour" id="jour">—</div>
      <div class="bande" id="bande">—</div>
    </div>
    <div class="nav">
      <button id="prev" aria-label="Jour précédent">‹</button>
      <button id="next" aria-label="Jour suivant">›</button>
    </div>
  </div>

  <div id="contenu"></div>

  <footer>
    Poids indicatifs, non métrologiques. Calibration à consigner.<br>
    AFR · outil de suivi de conduite de bande
  </footer>
</div>

<script>
/* =====================================================================
   AFR — PESÉE AUTOMATIQUE  ·  fichier unique
   ---------------------------------------------------------------------
   CONTEXTE : élevage de reproducteurs en insémination artificielle.
   Mâles et femelles sont logés séparément -> UN BÂTIMENT = UN SEXE.
   La distribution des poids est donc UNIMODALE, et le CV mesure
   réellement l'homogénéité du lot (pas un artefact de dimorphisme).

   Conséquence importante : la fourchette d'acceptation peut être
   RESSERRÉE autour de la moyenne du lot, ce qui rend la détection de
   deux animaux sur le plateau bien plus fiable.

   ---------------------------------------------------------------------
   SCHÉMA FIREBASE ATTENDU (écrit par l'ESP32)

     /pesee/{site}/{AAAA-MM-JJ}/
        bande   : "NV2-2026-01"
        valides : [ {p:2780, t:1751...}, ... ]      p = grammes, t = epoch s
        rejets  : { sous_mini:.., sur_maxi:.., instable:.., sans_retour_zero:.. }
        objectif: 2800                              (g — courbe ORVIA du jour)

   Une pesée valide = poids dans la fourchette glissante
                    + stable sur stab_n échantillons
                    + retour à zéro avant la suivante.
   ===================================================================== */

const FIREBASE = {
  databaseURL: "https://afr-nt2-default-rtdb.europe-west1.firebasedatabase.app",
  site: "NV2"
};

/* Bâtiments suivis. Un seul sexe par bâtiment.

   ref = POIDS DE RÉFÉRENCE DU LOT, en grammes, issu des PESÉES MANUELLES
   au peson. C'est lui qui fixe la fourchette d'exclusion à l'affichage
   (voir REF_MANUELLE plus bas). À mettre à jour quand le lot avance :
   une référence figée à 2800 g sur un lot qui en pèse 3200 écarterait
   progressivement les sujets les plus lourds — donc les plus normaux. */
const SITES = [
  {id:"NV2", sexe:"F", libelle:"NV2 · femelles", bande:"NV2-2026-01", ref:2800},
  {id:"NT1", sexe:"F", libelle:"NT1 · femelles", bande:"NT1-2026-02", ref:2800},
  {id:"ST1", sexe:"F", libelle:"ST1 · femelles", bande:"ST1-2026-01", ref:2800}
];

/* Paramètres firmware (miroir ESP32) */
/* Valeurs de REPLI uniquement. La vérité vient de la télémétrie du poste
   (/pesee/{site}/etat), qui publie ses vrais réglages. Recopier les
   paramètres à la main menait à un miroir menteur : l'app affichait 2 %
   alors que le firmware tournait à 5 %. */
const PARAMS_REPLI = {
  poids_mini: 1700,     // g
  poids_maxi: 4900,     // g
  stab_pct: 5.0,        // % — fenêtre de stabilité
  stab_ms: 400,         // ms
  cadence: 10           // Hz — cadence réelle du HX711 (80 Hz après mod. RATE)
};

/* Plage active du poste — miroir de HEURE_DEBUT / HEURE_FIN du firmware.
   Hors plage, l'ESP32 est en sommeil profond : il ne pèse pas, et surtout
   il ne lit pas ses commandes. */
const HEURE_DEBUT_POSTE = 7;
const HEURE_FIN_POSTE   = 22;

const UNIF_PCT = 10;    // ± % autour de la moyenne : indice d'uniformité (usage avicole)

/* =====================================================================
   ACCU — NIVEAU DE BATTERIE
   ---------------------------------------------------------------------
   Le poste publie désormais sa tension dans /pesee/{site}/etat :
     batt        tension au repos, en V
     batt_min    creux relevé depuis le dernier envoi
     batt_pct    état de charge en %, calculé par le firmware
     batt_seuil  seuil d'alerte configuré dans le firmware

   ⚠  UN ACCU LI-ION NE SE DÉCHARGE PAS LINÉAIREMENT. Entre 4,2 et 3,7 V
      il reste 80 % de la charge ; entre 3,6 et 3,2 V, il n'en reste que
      10 %. Une jauge linéaire annoncerait donc « la moitié » à un accu qui
      tient encore trois jours, puis passerait de 30 % à 0 % en une nuit.
      On interpole sur la vraie courbe de décharge, identique à celle du
      firmware — les deux DOIVENT rester cohérentes.
   ===================================================================== */
const BATT_PLEIN    = 4.20;   // V
const BATT_ALERTE   = 3.50;   // V — repli si le poste ne publie pas batt_seuil
const BATT_CRITIQUE = 3.35;   // V — en dessous : remplacement immédiat

const BATT_COURBE = [
  [3.20,0],[3.45,5],[3.60,10],[3.70,20],[3.75,35],
  [3.82,50],[3.90,65],[4.00,80],[4.10,93],[4.20,100]
];

function battPct(v){
  if(!(v > 0)) return null;
  /* Au-delà de 4,5 V ce n'est pas un élément Li-ion : soit le module mesure
     le 5 V du shield, soit le ratio du diviseur est faux. Annoncer « 100 % »
     dans ce cas donnerait une fausse assurance — on préfère ne rien dire. */
  if(v > BATT_PLEIN + 0.30) return null;
  const N = BATT_COURBE.length;
  if(v <= BATT_COURBE[0][0])   return 0;
  if(v >= BATT_COURBE[N-1][0]) return 100;
  for(let i = 1; i < N; i++){
    if(v <= BATT_COURBE[i][0]){
      const [v0,p0] = BATT_COURBE[i-1], [v1,p1] = BATT_COURBE[i];
      return Math.round(p0 + (v - v0) / (v1 - v0) * (p1 - p0));
    }
  }
  return 100;
}

/* Une seule fonction de classement, partagée par la jauge, le chiffre et
   le graphique. Sans elle, la tuile passait au rouge avant la jauge et
   l'on ne savait plus quel seuil faisait foi. */
function battClasse(v, seuil){
  if(!(v > 0)) return "";
  const s = (seuil > 0) ? seuil : BATT_ALERTE;
  if(v < BATT_CRITIQUE) return "bas";
  if(v < s)             return "moyen";
  return "bon";
}

const volts = v => (typeof v === "number" && v > 0)
  ? v.toFixed(2).replace(".",",") + " V" : "—";

/* =====================================================================
   EXCLUSION DES MESURES ABERRANTES  —  FOURCHETTE AUTOUR D'UN OBJECTIF
   CONNU, RÉGLABLE DANS L'APP
   ---------------------------------------------------------------------
   EN BAS — les appuis partiels. Une cane posant une seule patte sur le
   plateau enregistre 40 à 60 % de son poids. Ces mesures sont parfaitement
   STABLES : le filtre du firmware ne peut pas les distinguer. Elles tirent
   la moyenne vers le bas et gonflent le CV.

   EN HAUT — deux animaux, ou une cane plus l'appui d'une seconde. Le
   firmware ne peut pas davantage les écarter : deux canes légères (2+2 kg)
   pèsent moins qu'une seule cane lourde. Aucune borne calculée sur les
   données elles-mêmes ne les sépare.

   LA RÉFÉRENCE VIENT DE VOUS, PAS DES DONNÉES. C'est le changement de
   fond par rapport à la version précédente, qui prenait la médiane du jour
   comme référence. Une médiane est calculée SUR les mesures qu'on cherche
   justement à trier : si une journée compte beaucoup d'appuis partiels,
   elle descend, la fourchette descend avec elle, et une partie des
   aberrations passe. Le poids relevé au peson, lui, ne bouge pas.

   -> Le poids d'objectif et les deux pourcentages se saisissent DANS L'APP,
      carte « Réglages du lot », un jeu par bâtiment. Ils sont enregistrés
      dans /pesee/{site}/reglages, donc partagés entre le PC et le téléphone.
      À −25 % / +25 % de 2800 g, on garde 2100 – 3500 g.

   ⚠  METTEZ L'OBJECTIF À JOUR quand le lot avance. Un lot qui prend 400 g
      sans que vous changiez le réglage verra ses sujets les plus lourds —
      donc les plus normaux — passer au-dessus de la borne haute et sortir
      des statistiques.

   ⚠  LA BORNE HAUTE COUPE AVANT LE FIRMWARE. Le poste accepte jusqu'à
      POIDS_MAXI (4300 g), borne relevée précisément parce qu'une cane de
      plus de 3700 g avait été rejetée. À +25 % de 2800, l'affichage écarte
      désormais tout ce qui dépasse 3500 g : cette même cane sortira des
      statistiques. Surveillez le décompte « écartées hautes » du bandeau
      du jour — s'il grimpe, c'est que l'objectif est trop bas, pas que le
      lot est anormal. Monter le taux supérieur à 35 % ramène la borne à
      3780 g, au plus près de ce qu'accepte le poste.

   Rien n'est perdu : le tri est purement à l'affichage, Firebase conserve
   toutes les mesures brutes.
   ===================================================================== */
/* Valeurs par défaut, utilisées tant que le bâtiment n'a rien enregistré. */
const REF_MANUELLE = 2800; // g
const EXCLU_BAS    = 25;   // % sous la référence  -> écarté
const EXCLU_HAUT   = 25;   // % au-dessus         -> écarté

/* Réglages EFFECTIFS du bâtiment courant.
   Ordre de priorité : ce qui est enregistré dans Firebase, sinon le champ
   du bâtiment dans SITES[], sinon les valeurs par défaut ci-dessus.

   Pourquoi Firebase et pas le fichier : vous consultez cette page depuis le
   PC du bureau ET depuis le téléphone dans le bâtiment. Un réglage écrit
   dans le fichier HTML n'existerait que sur la machine où vous l'avez tapé,
   et les deux affichages finiraient par se contredire sans que rien ne le
   signale. */
function reglages(){
  const s = site() || {};
  const r = REGLAGES || {};
  const nb = (v, repli) => (typeof v === "number" && isFinite(v)) ? v : repli;
  return {
    ref:  nb(r.ref,  nb(s.ref, REF_MANUELLE)),
    bas:  nb(r.bas,  EXCLU_BAS),
    haut: nb(r.haut, EXCLU_HAUT)
  };
}

/* Heure de distribution de l'aliment. Les canes finissent en 20-30 min, donc
   les jabots sont pleins juste après, puis se vident au fil de la journée.
   Sert à interpréter la courbe des poids horaires. */
const HEURE_REPAS   = 7;
const MIN_PAR_HEURE = 3;   // en deçà, une moyenne horaire ne veut rien dire

/* Objectif retenu pour un jour donné.
   Le poids saisi dans l'app l'emporte sur celui publié par l'ESP32 : le
   firmware envoie sa constante POIDS_OBJECTIF, qui n'est pas toujours à
   jour, alors que la valeur saisie ici vient de vos pesées manuelles.
   Sans cette règle, l'app afficherait une fourchette calée sur 2800 g et
   juste au-dessus un « objectif 2,70 kg » — deux chiffres contradictoires
   sur le même écran. */
function objectifDuJour(j){
  const r = reglages().ref;
  if(r > 0) return r;
  return (j && j.objectif) ? j.objectif : null;
}

function trierPesees(valides){
  const R = reglages();
  const vide = { gardees: [], ecartees: [], basses: [], hautes: [],
                 seuil: 0, seuilHaut: 0, ref: R.ref, auto: false };
  if(!valides || !valides.length) return vide;

  const tous = valides.map(v => v.p);
  let ref = R.ref;
  let auto = false;

  if(!(ref > 0)){
    /* Référence à 0 = « je ne sais pas » : repli sur la médiane du jour,
       affinée deux fois. Moins fiable — la médiane est calculée sur les
       mesures qu'on cherche justement à trier — mais mieux que rien. */
    auto = true;
    ref = mediane(tous);
    for(let k = 0; k < 2; k++){
      const b = ref * (1 - R.bas/100), h = ref * (1 + R.haut/100);
      const restants = tous.filter(p => p >= b && p <= h);
      if(restants.length < 3) break;
      const nouveau = mediane(restants);
      if(Math.abs(nouveau - ref) < 1) break;
      ref = nouveau;
    }
  }

  const seuil     = ref * (1 - R.bas/100);
  const seuilHaut = ref * (1 + R.haut/100);

  return {
    gardees:  valides.filter(v => v.p >= seuil && v.p <= seuilHaut),
    ecartees: valides.filter(v => v.p <  seuil || v.p >  seuilHaut),
    basses:   valides.filter(v => v.p <  seuil),
    hautes:   valides.filter(v => v.p >  seuilHaut),
    seuil, seuilHaut, ref, auto
  };
}

/* =====================================================================
   1. DÉMO
   ===================================================================== */
function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

/* =====================================================================
   2. STATISTIQUES
   ===================================================================== */
const moyenne = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : 0;
function ecartType(a){
  if(a.length < 2) return 0;
  const m = moyenne(a);
  return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1));
}
const cvPct = a => { const m = moyenne(a); return m ? ecartType(a)/m*100 : 0; };

/* CV ROBUSTE — calculé sur le cœur de la distribution, via l'écart
   interquartile. Pour une distribution normale, sigma ≈ IQR / 1,349.

   À quoi ça sert : comparer les deux CV isole la cause de la dispersion.
     CV robuste ≈ CV classique  -> le lot est réellement hétérogène
     CV robuste << CV classique -> le cœur est homogène, ce sont les QUEUES
                                   qui polluent (appuis partiels résiduels,
                                   deux animaux) et non le lot.
   C'est le seul moyen de distinguer un vrai problème d'élevage d'un
   problème de mesure. */
function quantile(a, q){
  if(!a.length) return 0;
  const t = [...a].sort((x,y)=>x-y);
  const pos = (t.length - 1) * q;
  const bas = Math.floor(pos), reste = pos - bas;
  return t[bas + 1] !== undefined ? t[bas] + reste*(t[bas+1] - t[bas]) : t[bas];
}
/* Statistiques restreintes aux pesées faites à partir de heureMin. */
function statsDepuis(valides, heureMin){
  const p = valides.filter(v => new Date(v.t*1000).getHours() >= heureMin).map(v => v.p);
  return { n:p.length, moy:moyenne(p), cv:cvPct(p), cvRob:cvRobuste(p) };
}

function cvRobuste(a){
  if(a.length < 4) return null;
  const med = mediane(a);
  if(!med) return null;
  const iqr = quantile(a, 0.75) - quantile(a, 0.25);
  return (iqr / 1.349) / med * 100;
}
function mediane(a){
  if(!a.length) return 0;
  const t = [...a].sort((x,y)=>x-y), i = Math.floor(t.length/2);
  return t.length % 2 ? t[i] : (t[i-1]+t[i])/2;
}
/* Indice d'uniformité avicole : part de l'effectif dans ± UNIF_PCT % de la moyenne. */
function uniformite(a){
  if(!a.length) return {bas:0, centre:0, haut:0, pct:0};
  const m = moyenne(a), lo = m*(1-UNIF_PCT/100), hi = m*(1+UNIF_PCT/100);
  const bas = a.filter(p=>p<lo).length, haut = a.filter(p=>p>hi).length;
  const centre = a.length - bas - haut;
  return {bas, centre, haut, pct: centre/a.length*100, lo, hi, m};
}

/* =====================================================================
   AUTONOMIE DE L'ACCU
   ---------------------------------------------------------------------
   Régression linéaire sur le creux quotidien. On travaille sur batt_min et
   non sur batt : le creux est la vraie contrainte — c'est lui qui fait
   redémarrer l'ESP32 pendant une émission Wi-Fi, bien avant que la tension
   au repos ne paraisse inquiétante.

   ⚠  ON REFUSE DE CONCLURE SOUS 4 JOURS. Deux points suffisent
      mathématiquement à tracer une droite, jamais à décrire une décharge :
      une journée fraîche fait remonter la tension d'un accu qui se vide, et
      la « projection » annoncerait alors une autonomie infinie.
   ===================================================================== */
function autonomie(jours){
  const pts = [];
  jours.forEach(j => {
    const v = (j.batt_min > 0) ? j.batt_min : (j.batt > 0 ? j.batt : null);
    if(v !== null) pts.push({v, date:j.date});
  });
  if(pts.length < 4) return {pts, pente:null, jours:null};

  // moindres carrés sur les 10 derniers jours renseignés
  const der = pts.slice(-10);
  const n = der.length;
  const mx = (n-1)/2;
  const my = der.reduce((s,p)=>s+p.v,0)/n;
  let num = 0, den = 0;
  der.forEach((p,i) => { num += (i-mx)*(p.v-my); den += (i-mx)*(i-mx); });
  if(!den) return {pts, pente:null, jours:null};
  const pente = num/den;               // V par jour (négatif = décharge)

  if(pente >= -0.005) return {pts, pente, jours:null};   // trop plat pour conclure
  const actuel = der[n-1].v;
  return {pts, pente, jours: Math.max(0, Math.round((actuel - BATT_CRITIQUE) / (-pente)))};
}

const SOURCE = "reel";   // plus de mode démo : uniquement les données réelles
let siteId = SITES[0].id;
let JOURS  = [];
let idx    = 0;
let DIAG   = null;      // diagnostic du dernier chargement en mode réel
let ETAT   = null;      // télémétrie du poste (/pesee/{site}/etat)
let CMD    = null;      // état des commandes en attente
let sondage = null;     // timer de sondage d'une commande en cours
let rafraich = null;    // timer d'actualisation autonome de la maintenance
let msgCmd  = "";       // message affiché sous les boutons de maintenance
/* La carte Maintenance se redessine toutes les 10 s pour rafraîchir la
   télémétrie. Sans mémoriser la saisie, le champ de masse repartait à sa
   valeur par défaut en pleine frappe. */
let masseSaisie = "10000";
let tensionSaisie = "";   // même problème pour le champ de calibrage de la tension

/* Réglages du lot, saisis dans l'app et enregistrés dans Firebase sous
   /pesee/{site}/reglages. REGLAGES = ce qui est enregistré ; regSaisie =
   ce que l'utilisateur est en train de taper, avant d'appuyer sur
   Enregistrer. Les deux sont séparés pour que l'aperçu de la fourchette
   suive la frappe sans que rien ne parte en base tant qu'on n'a pas validé. */
let REGLAGES  = null;
let regSaisie = null;
let msgReg    = "";

/* ---- accès Firebase REST ---- */
function fbUrl(chemin){
  return `${FIREBASE.databaseURL.replace(/\/$/,"")}${chemin}.json`;
}
async function fbLire(chemin){
  const r = await fetch(fbUrl(chemin));
  if(!r.ok) throw new Error("HTTP " + r.status);
  return await r.json();
}
async function fbEcrire(chemin, obj){
  const r = await fetch(fbUrl(chemin), {
    method: "PATCH",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(obj)
  });
  if(!r.ok) throw new Error("HTTP " + r.status);
  return await r.json();
}

const el = id => document.getElementById(id);
const CSS = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const site = () => SITES.find(s=>s.id===siteId);

/* =====================================================================
   4. RENDU
   ===================================================================== */
/* =====================================================================
   4 bis. CARTE DE MAINTENANCE
   Pilote le poste à distance. Indispensable ici : l'accu et l'ESP32 sont
   enfermés dans la balance, sans accès physique une fois le capot vissé.
   Écrit dans /pesee/{site}/cmd, que le firmware lit à chaque envoi.
   ===================================================================== */
/* Le poste dort-il ? Il ne lit ses commandes que dans sa plage active. */
function posteDort(){
  const h = new Date().getHours();
  return !(h >= HEURE_DEBUT_POSTE && h < HEURE_FIN_POSTE);
}

/* Fraîcheur du dernier contact, en minutes.
   On privilégie "ts" (epoch, à la seconde). Le champ "vu" n'a qu'une
   résolution HORAIRE : s'en servir faisait afficher jusqu'à 59 min de retard
   alors que le poste venait d'écrire. "vu" ne sert plus que de repli pour
   les firmwares antérieurs à 3.4. */
/* Horodatage de la pesée la plus récente reçue, tous jours confondus.
   Une pesée arrivée à 19:31 PROUVE un contact au moins aussi récent : c'est
   la meilleure source disponible tant que le firmware ne publie pas "ts". */
/* Nombre de pesées d'AUJOURD'HUI d'après Firebase — la source qui fait foi.
   Le compteur de la télémétrie, lui, vit en mémoire vive du poste et repart
   à zéro à chaque redémarrage : l'écart entre les deux révèle un reboot. */
function peseesAujourdhui(){
  const d = new Date();
  const iso = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
                              + "-" + String(d.getDate()).padStart(2,"0");
  const j = JOURS.find(x => x.date === iso);
  return j ? j.valides.length : null;
}

function dernierePeseeTs(){
  let m = 0;
  for(const j of JOURS)
    for(const v of (j.valides || []))
      if(v.t > m) m = v.t;
  return m || 0;
}

/* Instant du dernier contact, en epoch. On retient la source la plus
   RÉCENTE parmi les trois, car chacune est une borne basse :
     - ts        : précis à la seconde (firmware 3.4+)
     - vu        : résolution horaire seulement -> jusqu'à 59 min de retard
     - la dernière pesée reçue */
function dernierContactTs(e){
  let ts = (e && e.ts) ? e.ts : 0;
  const m = String(e && e.vu ? e.vu : "").match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2})h/);
  if(m){
    const t = new Date(+m[1], +m[2]-1, +m[3], +m[4]).getTime() / 1000;
    if(t > ts) ts = t;
  }
  const p = dernierePeseeTs();
  if(p > ts) ts = p;
  return ts;
}

function fraicheur(e){
  const ts = dernierContactTs(e);
  if(!ts) return null;
  return Math.round((Date.now()/1000 - ts) / 60);
}

/* =====================================================================
   4 ter. RÉGLAGES DU LOT — saisis dans l'app, par bâtiment
   ---------------------------------------------------------------------
   Trois champs : le poids d'objectif (celui que vous connaissez par vos
   pesées manuelles au peson) et les deux pourcentages d'écartement.

   Écrits dans /pesee/{site}/reglages, donc valables partout : le PC du
   bureau et le téléphone dans le bâtiment lisent le même réglage. Un
   réglage stocké dans le fichier HTML n'aurait existé que sur la machine
   où il a été tapé, et les deux affichages auraient fini par se contredire
   sans que rien ne le signale.

   ⚠  L'ESP32 NE LIT PAS CE NŒUD. Ces réglages ne touchent QUE l'affichage :
      le poste continue d'enregistrer tout ce qui passe entre POIDS_MINI et
      POIDS_MAXI, et Firebase conserve toutes les mesures brutes. Changer un
      pourcentage ici ne détruit aucune donnée et se corrige à tout moment.
   ===================================================================== */
function carteReglages(){
  const R = reglages();
  const s = regSaisie || {ref:String(R.ref), bas:String(R.bas), haut:String(R.haut)};
  const nb = v => { const x = parseFloat(String(v).replace(",",".")); return isFinite(x) ? x : null; };
  const ref = nb(s.ref), bas = nb(s.bas), haut = nb(s.haut);

  let apercu;
  if(ref === null || bas === null || haut === null){
    apercu = `<span style="color:var(--caroncule)">Valeur incomplète.</span>`;
  } else if(ref <= 0){
    apercu = `Objectif à 0 : la référence sera calculée automatiquement sur la
      médiane du jour. Moins fiable — la médiane est tirée vers le bas par les
      appuis partiels qu'on cherche justement à écarter.`;
  } else {
    const b = Math.round(ref * (1 - bas/100)), h = Math.round(ref * (1 + haut/100));
    apercu = `Sont retenues les pesées entre <b>${b.toLocaleString("fr-FR")} g</b>
      et <b>${h.toLocaleString("fr-FR")} g</b>. En dessous : appui partiel.
      Au-dessus : deux animaux.`;
  }

  const modifie = regSaisie !== null &&
    (nb(s.ref) !== R.ref || nb(s.bas) !== R.bas || nb(s.haut) !== R.haut);

  return `
  <div class="carte">
    <h2>Réglages du lot — ${site().libelle}</h2>
    <div class="note">Le poids d'objectif est celui que vous connaissez par vos
      pesées manuelles au peson, pas celui calculé par l'app. C'est volontaire :
      une référence calculée sur les mesures qu'on cherche à trier se laisse
      entraîner par elles. Réglage propre à ce bâtiment.</div>

    <div class="reg">
      <label>
        <span>Poids d'objectif</span>
        <input type="number" id="r-ref" value="${s.ref}" min="0" max="12000" step="50">
        <i>grammes — 0 = calcul automatique</i>
      </label>
      <label>
        <span>Écarter en dessous de</span>
        <input type="number" id="r-bas" value="${s.bas}" min="0" max="60" step="1">
        <i>% sous l'objectif — appuis partiels</i>
      </label>
      <label>
        <span>Écarter au-dessus de</span>
        <input type="number" id="r-haut" value="${s.haut}" min="0" max="60" step="1">
        <i>% au-dessus — deux animaux</i>
      </label>
    </div>

    <div class="apercu">${apercu}</div>

    <div class="statut" style="margin-top:12px">
      <span>${msgReg || (modifie
        ? "Modifications non enregistrées."
        : "Réglages enregistrés pour ce bâtiment.")}</span>
      <span class="actions">
        ${modifie ? `<button class="btn mini" id="b-reg-annul">Annuler</button>` : ""}
        <button class="btn act mini" id="b-reg" ${modifie ? "" : "disabled"}>Enregistrer</button>
      </span>
    </div>
    <div class="note" style="margin:10px 0 0">
      N'affecte que l'affichage. Le poste continue d'enregistrer tout ce qui
      passe sa propre fourchette, et Firebase conserve toutes les mesures brutes :
      un réglage trop serré se corrige sans rien avoir perdu.
    </div>
  </div>`;
}

function brancherReglages(){
  const champs = ["r-ref","r-bas","r-haut"];
  const lire = () => ({
    ref:  el("r-ref")  ? el("r-ref").value  : "",
    bas:  el("r-bas")  ? el("r-bas").value  : "",
    haut: el("r-haut") ? el("r-haut").value : ""
  });
  champs.forEach(id => {
    const c = el(id);
    if(!c) return;
    c.oninput = () => {
      regSaisie = lire();
      msgReg = "";
      redessinerReglages();   // met à jour l'aperçu de la fourchette
    };
  });

  const b = el("b-reg");
  if(b) b.onclick = async () => {
    const s = lire();
    const nb = v => { const x = parseFloat(String(v).replace(",",".")); return isFinite(x) ? x : null; };
    const ref = nb(s.ref), bas = nb(s.bas), haut = nb(s.haut);
    if(ref === null || ref < 0 || ref > 12000){ alert("Poids d'objectif invalide (0 à 12000 g)."); return; }
    if(bas === null || bas < 0 || bas > 60)   { alert("Taux inférieur invalide (0 à 60 %)."); return; }
    if(haut === null || haut < 0 || haut > 60){ alert("Taux supérieur invalide (0 à 60 %)."); return; }
    try{
      await fbEcrire(`/pesee/${siteId}/reglages`, {ref, bas, haut});
      REGLAGES = {ref, bas, haut};
      regSaisie = null;
      msgReg = "Enregistré. Les statistiques sont recalculées.";
      rendre();               // tout dépend de la fourchette : on redessine tout
    }catch(err){
      msgReg = "Échec de l'enregistrement : " + err.message +
        (String(err.message).match(/401|403/) ? " (règles Firebase en écriture)" : "");
      redessinerReglages();
    }
  };

  const a = el("b-reg-annul");
  if(a) a.onclick = () => { regSaisie = null; msgReg = ""; rendre(); };
}

/* Redessine la seule zone de réglage, en conservant le focus et la position
   du curseur : sans cela, taper le deuxième chiffre d'un pourcentage
   éjectait le curseur du champ. */
function redessinerReglages(){
  const z = el("reg-zone");
  if(!z) return;
  const actif = document.activeElement;
  const id = actif ? actif.id : null;
  const pos = (actif && actif.selectionStart !== undefined) ? actif.selectionStart : null;
  z.innerHTML = carteReglages();
  brancherReglages();
  if(id && el(id)){
    el(id).focus();
    try{ if(pos !== null) el(id).setSelectionRange(pos, pos); }catch(e){}
  }
}

/* Tuile « Accu » de la télémétrie. Toujours affichée, même sans donnée :
   c'est justement quand le poste ne répond plus qu'on veut savoir où en
   était la batterie. */
function tuileAccu(e){
  const v = (typeof e.batt === "number") ? e.batt : null;
  if(v === null)
    return `<div><span>Accu</span><b>—</b>
      <i>pas de module de tension, ou firmware &lt; 4.0</i></div>`;

  const seuil = (typeof e.batt_seuil === "number") ? e.batt_seuil : BATT_ALERTE;
  const cls   = battClasse(v, seuil);
  const pct   = (typeof e.batt_pct === "number") ? e.batt_pct : battPct(v);
  const creux = (typeof e.batt_min === "number" && e.batt_min > 0) ? e.batt_min : null;

  return `<div>
    <span>Accu</span>
    <b class="bat-${cls}">${volts(v)}</b>
    <div class="jauge ${cls === "bon" ? "" : cls}"><i style="width:${pct === null ? 0 : pct}%"></i></div>
    <i>${pct === null ? "" : pct + " % de charge"}${creux !== null ? " · creux " + volts(creux) : ""}</i>
  </div>`;
}

function carteMaintenance(){
  if(SOURCE !== "reel") return "";

  const e = ETAT || {};
  const calibre = e.facteur && Math.abs(e.facteur) > 0.0001;
  const dort = posteDort();
  const age = fraicheur(e);

  // seuil au-delà duquel une mesure est jugée instable, en grammes.
  // Déclaré ici : il est utilisé dès le bloc d'avis ci-dessous.
  const rejSeuil = (e.stab_pct || 5) / 100 * ((e.fmin && e.fmax) ? (e.fmin + e.fmax) / 2 : 2900);

  let avis = "";
  if(calibre){
    const f = Math.abs(e.facteur);
    if(f < 20 || f > 500)
      avis += `<div class="avis alerte">Facteur inhabituel (${e.facteur}).
              Attendu ~50 à 200 counts/g sur une plateforme 24 kg.
              Vérifiez la tare, la masse posée, et que le plateau ne frotte pas.</div>`;
  }
  if(e.bruit_vide > 60 && e.fw){
    avis += `<div class="avis alerte">Le signal bouge de ${e.bruit_vide} g <b>plateau vide</b>,
             pour un seuil de rejet à ${Math.round(rejSeuil)} g. Aucune pesée ne peut aboutir :
             ce n'est pas l'animal qui bouge, c'est la mesure. Cherchez du côté du blindage
             non raccordé, de l'alimentation par accu, ou d'un plateau qui touche le châssis.</div>`;
  }
  /* ---- avis liés à l'accu -------------------------------------------
     Trois symptômes distincts, trois messages distincts. Les fondre dans
     un seul « batterie faible » ferait remplacer un accu qui va très bien
     parce qu'il s'écroule sous charge — ou l'inverse, plus grave. */
  if(typeof e.batt === "number"){
    const seuil = (typeof e.batt_seuil === "number") ? e.batt_seuil : BATT_ALERTE;
    const pct = (typeof e.batt_pct === "number") ? e.batt_pct : battPct(e.batt);
    if(e.batt < BATT_CRITIQUE){
      avis += `<div class="avis alerte">Accu à ${volts(e.batt)} — <b>critique</b>.
        Sous ${volts(BATT_CRITIQUE)}, l'ESP32 redémarre pendant les émissions Wi-Fi
        et perd le tampon de pesées non encore envoyées. Remplacez l'accu aujourd'hui.</div>`;
    } else if(e.batt < seuil){
      avis += `<div class="avis alerte">Accu à ${volts(e.batt)}${pct !== null ? ` (${pct} %)` : ""} —
        sous le seuil d'alerte de ${volts(seuil)}. Prévoyez le remplacement
        dans les prochains jours.</div>`;
    }
    /* Chute sous charge : la signature d'un accu en fin de vie. Sa tension
       au repos peut rester belle alors que sa résistance interne a triplé ;
       il s'effondre au premier pic radio. C'est la panne qu'on ne voit
       jamais venir en ne regardant que la tension instantanée. */
    if(typeof e.batt_min === "number" && e.batt_min > 0 && (e.batt - e.batt_min) > 0.35){
      avis += `<div class="avis alerte">L'accu chute de
        ${(e.batt - e.batt_min).toFixed(2).replace(".",",")} V sous charge
        (${volts(e.batt)} au repos, ${volts(e.batt_min)} en pointe).
        Sa résistance interne a augmenté : il est en fin de vie même si la
        tension au repos paraît correcte. C'est ce creux-là qui provoque les
        redémarrages.</div>`;
    }
    if(e.batt > 6 && e.batt_pct === undefined){
      avis += `<div class="avis dodo">Le module lit ${volts(e.batt)} : vous mesurez
        probablement le 5 V du shield et non l'accu, ou le ratio du diviseur
        n'est pas calibré. Utilisez l'étape 3 ci-dessous.</div>`;
    }
  }

  {
    const reel = peseesAujourdhui();
    if(reel !== null && e.valides !== undefined && reel - e.valides > 5){
      avis += `<div class="avis dodo">Le poste a redémarré aujourd'hui :
               ${reel} pesées enregistrées au total, mais seulement ${e.valides}
               depuis son dernier démarrage. Les pesées encore en tampon au
               moment du redémarrage ont été perdues. Chute de tension sur
               l'accu, ou coupure pendant un pic Wi-Fi.</div>`;
    }
  }
  if(e.bloque_min > 5){
    avis += `<div class="avis alerte">Plateau occupé en continu depuis ${e.bloque_min} min
             (${(e.poids/1000).toFixed(2).replace(".",",")} kg). Objet oublié, fiente accumulée,
             ou plateau qui frotte ? Aucune pesée ne sera enregistrée tant qu'il ne se libère pas.</div>`;
  }
  if(dort){
    avis += `<div class="avis dodo">Le poste dort — il ne pèse et ne lit ses commandes
             qu'entre ${HEURE_DEBUT_POSTE} h et ${HEURE_FIN_POSTE} h.
             Une commande envoyée maintenant sera exécutée à ${HEURE_DEBUT_POSTE} h.</div>`;
  } else if(age !== null && age > 30){
    avis += `<div class="avis alerte">Aucun contact depuis ${age} min alors que le poste
             devrait être actif. Accu vide, Wi-Fi hors de portée, ou poste planté.</div>`;
  }

  const enAttente = CMD && (CMD.tare === true || (CMD.calibrer && CMD.calibrer > 0)
                            || (CMD.cal_tension && CMD.cal_tension > 0));

  // Vue en direct de la machine à états : le capot est vissé, c'est la
  // seule fenêtre sur ce qui se passe réellement dans la boîte.
  const machine = e.machine || "—";
  const rej = e.rej || {};
  const totRej = (rej.sous_mini||0)+(rej.sur_maxi||0)+(rej.instable||0)+(rej.sans_zero||0);
  const vueLive = e.poids === undefined ? "" : `
    <div class="live">
      <div class="lg">
        <span>Poids sur le plateau</span>
        <b>${(e.poids/1000).toFixed(2).replace(".",",")} kg</b>
        <i>${e.fmin !== undefined ? `fourchette ${e.fmin} – ${e.fmax} g` : ""}</i>
      </div>
      <div class="lg">
        <span>Machine à états</span>
        <b class="m-${machine}">${machine}</b>
        <i>${machine === "VIDE" ? "prête à peser"
           : machine === "OCCUPE" ? "quelque chose est monté"
           : machine === "ATTENTE_ZERO" ? "attend que le plateau se libère" : ""}</i>
      </div>
      <div class="lg">
        <span>Pesées du jour</span>
        <b>${peseesAujourdhui() !== null ? peseesAujourdhui()
             : (e.valides !== undefined ? e.valides : "—")}</b>
        <i>${e.valides !== undefined ? e.valides + " depuis le démarrage" : ""}${
             e.tampon ? " · " + e.tampon + " en tampon" : ""}</i>
      </div>
      <div class="lg">
        <span>Bruit du signal</span>
        <b class="${(e.bruit_vide === undefined || !e.fw) ? "" : e.bruit_vide > 60 ? "mauvais" : e.bruit_vide > 20 ? "moyen" : "bon"}">
          ${e.bruit_vide !== undefined ? e.bruit_vide + " g" : "—"}</b>
        <i>${!e.fw ? "mesure non fiable — firmware à mettre à jour"
             : (e.bruit_occup !== undefined ? "occupé " + e.bruit_occup + " g · " : "") + "seuil " + Math.round(rejSeuil) + " g"}</i>
      </div>
      <div class="lg">
        <span>Rejets</span>
        <b>${totRej}</b>
        <i>${totRej ? `inst. ${rej.instable||0} · mini ${rej.sous_mini||0} · maxi ${rej.sur_maxi||0} · zéro ${rej.sans_zero||0}` : "aucun"}</i>
      </div>
    </div>`;

  return `
  <div class="carte">
    <h2>Maintenance du poste</h2>
    <div class="note">Pilotage à distance — le poste est fermé, sans accès physique.</div>

    ${vueLive}

    <div class="telem">
      <div><span>Dernier contact</span><b>${(function(){
          const t = dernierContactTs(e);
          return t ? new Date(t*1000).toLocaleTimeString("fr-FR") : "jamais";
        })()}</b>
        ${age !== null ? `<i>il y a ${age < 60 ? age + " min" : Math.round(age/60) + " h"}</i>` : ""}</div>
      <div><span>Signal</span><b>${e.rssi !== undefined ? e.rssi + " dBm" : "—"}</b></div>
      <div><span>Calibration</span><b class="${calibre ? "ok" : "ko"}">
        ${calibre ? e.facteur + " counts/g" : "NON CALIBRÉ"}</b></div>
      <div><span>Tare</span><b>${e.tare !== undefined ? e.tare : "—"}</b>
        ${e.boots !== undefined ? `<i>${e.boots} démarrage${e.boots>1?"s":""}</i>` : ""}</div>
      ${tuileAccu(e)}
    </div>
    ${avis}

    <div class="maint">
      <div class="etape">
        <div class="num">1</div>
        <div class="txt"><b>Tarer</b> — le plateau doit être <u>vide</u>.
          Enregistre le zéro, poids du plateau inox compris.</div>
        <button class="btn act" id="b-tare">Tarer</button>
      </div>
      <div class="etape">
        <div class="num">2</div>
        <div class="txt"><b>Calibrer</b> — posez la masse étalon <u>après</u> avoir taré.
          <div class="masse">
            <input type="number" id="m-masse" value="${masseSaisie}" min="100" step="100">
            <span>grammes</span>
          </div>
        </div>
        <button class="btn act" id="b-calib">Calibrer</button>
      </div>
      <div class="etape">
        <div class="num">3</div>
        <div class="txt"><b>Calibrer la tension</b> — mesurez l'accu au multimètre
          et saisissez la valeur lue. Le poste en déduit le ratio réel de son
          diviseur. <u>Une seule fois</u>, à la pose du module : les résistances
          du module sont à 5 % et l'ADC de l'ESP32 n'est pas linéaire, donc sans
          calibrage la tension affichée est juste à ±0,4 V près — assez pour
          annoncer une batterie vide qui ne l'est pas.
          <div class="masse">
            <input type="number" id="m-tension" value="${tensionSaisie}" min="0.5" max="30" step="0.01" placeholder="3.92">
            <span>volts</span>
          </div>
        </div>
        <button class="btn act" id="b-caltens">Calibrer</button>
      </div>
    </div>

    <div class="statut ${enAttente ? "attente" : ""}" id="statut-cmd">
      <span>${msgCmd || (enAttente
        ? "Commande en attente — le poste la lira à son prochain envoi."
        : "Aucune commande en attente.")}</span>
      <span class="actions">
        <button class="btn mini" id="b-raf">Actualiser</button>
        ${enAttente ? `<button class="btn mini" id="b-annul">Annuler</button>` : ""}
      </span>
    </div>
    <div class="note" style="margin:10px 0 0">
      Les commandes ne sont lues qu'à chaque envoi du poste, et seulement
      dans sa plage active. Pendant la mise en service, réglez
      <code>PUSH_MS = 20000</code> dans le firmware.
    </div>
  </div>`;
}

function brancherMaintenance(){
  const bt = el("b-tare"), bc = el("b-calib"), br = el("b-raf"), ba = el("b-annul");
  const bv = el("b-caltens");
  if(bt) bt.onclick = async () => {
    if(!confirm("Tarer maintenant ?\n\nLe plateau doit être VIDE.\nSi un animal est dessus, la tare sera fausse."))
      return;
    await envoyerCmd({tare: true}, "Tare demandée");
  };
  const mi = el("m-masse");
  if(mi) mi.oninput = () => { masseSaisie = mi.value; };
  const ti = el("m-tension");
  if(ti) ti.oninput = () => { tensionSaisie = ti.value; };
  if(bc) bc.onclick = async () => {
    const m = parseFloat(el("m-masse").value);
    if(!(m > 0)){ alert("Masse invalide."); return; }
    if(!confirm(`Calibrer sur ${m} g ?\n\nLa masse doit être POSÉE sur le plateau,\net la tare déjà faite à vide.`))
      return;
    await envoyerCmd({calibrer: m}, `Calibration demandée sur ${m} g`);
  };
  if(bv) bv.onclick = async () => {
    const v = parseFloat(el("m-tension").value);
    if(!(v > 0.5) || v > 30){
      alert("Tension invalide. Saisissez la valeur lue au multimètre, par exemple 3.92");
      return;
    }
    if(!confirm(`Calibrer la tension sur ${v} V ?\n\nCette valeur doit être celle lue au multimètre\nAUX BORNES DE L'ACCU, à l'instant.`))
      return;
    await envoyerCmd({cal_tension: v}, `Calibrage de tension demandé sur ${v} V`);
  };
  if(br) br.onclick = () => { msgCmd = ""; actualiserEtat(); };
  if(ba) ba.onclick = async () => {
    await envoyerCmd({tare: false, calibrer: 0, cal_tension: 0}, "Commande annulée");
  };
}

/* Actualisation autonome de la maintenance : l'app doit relire l'état du
   poste toute seule, sans dépendre d'un clic. Sinon une commande bloquée
   fige l'affichage indéfiniment. */
async function actualiserEtat(){
  if(SOURCE !== "reel" || !FIREBASE.databaseURL) return;
  try{ ETAT = await fbLire(`/pesee/${siteId}/etat`); }catch(e){}
  try{ CMD  = await fbLire(`/pesee/${siteId}/cmd`);  }catch(e){}
  redessinerMaintenance();
}

/* Ne redessine pas pendant que l'utilisateur tape : sinon le champ perd
   sa valeur et le curseur saute. Le rafraîchissement reprend dès qu'il
   quitte le champ. */
function redessinerMaintenance(){
  const z = el("maint-zone");
  if(!z) return;
  const actif = document.activeElement;
  if(actif && (actif.id === "m-masse" || actif.id === "m-tension")) return;
  try {
    z.innerHTML = carteMaintenance();
    brancherMaintenance();
  } catch(err) {
    console.error(err);
    z.innerHTML = `<div class="carte"><div class="vide"><b>Maintenance indisponible</b>
      <code>${String(err && err.message ? err.message : err)}</code></div></div>`;
  }
}

async function envoyerCmd(obj, libelle){
  try{
    await fbEcrire(`/pesee/${siteId}/cmd`, obj);
    msgCmd = libelle + (posteDort()
      ? " — le poste dort, il l'exécutera à " + HEURE_DEBUT_POSTE + " h."
      : " — en attente de lecture par le poste…");
    await actualiserEtat();
    lancerSondage();
  }catch(err){
    msgCmd = "Échec : " + err.message +
      (String(err.message).match(/401|403/) ? " (règles Firebase en écriture)" : "");
    await actualiserEtat();
  }
}

/* Sonde /cmd jusqu'à ce que le firmware ait remis le drapeau à zéro :
   c'est l'accusé de réception. */
function lancerSondage(){
  if(sondage) clearInterval(sondage);
  if(posteDort()) return;            // inutile de sonder un poste endormi
  let essais = 0;
  sondage = setInterval(async () => {
    essais++;
    try{
      CMD  = await fbLire(`/pesee/${siteId}/cmd`);
      ETAT = await fbLire(`/pesee/${siteId}/etat`);
      const fini = !CMD || (CMD.tare !== true && !(CMD.calibrer > 0) && !(CMD.cal_tension > 0));
      if(fini){
        clearInterval(sondage); sondage = null;
        msgCmd = CMD && CMD.erreur
          ? "Le poste signale : " + CMD.erreur
          : "Commande exécutée par le poste.";
      } else if(essais > 24){        // ~2 min
        clearInterval(sondage); sondage = null;
        msgCmd = "Toujours en attente. Le poste dort peut-être, ou PUSH_MS est trop long.";
      }
      redessinerMaintenance();
    }catch(err){ /* on retente au tour suivant */ }
  }, 5000);
}

/* Liste des pesées individuelles. Sert à deux choses : vérifier qu'une pesée
   précise correspond à ce qu'on a observé sur le terrain, et repérer à l'œil
   une valeur aberrante que les moyennes masqueraient. */
function listePesees(valides, moy, seuil, seuilHaut){
  if(!valides || !valides.length)
    return `<div class="vide" style="padding:24px">Aucune pesée retenue ce jour.</div>`;

  const lignes = [...valides].sort((a,b)=>b.t-a.t).map((v,i)=>{
    const d = new Date(v.t*1000);
    const hh = String(d.getHours()).padStart(2,"0") + ":" +
               String(d.getMinutes()).padStart(2,"0") + ":" +
               String(d.getSeconds()).padStart(2,"0");
    const ecart = v.p - moy;
    /* On distingue les deux causes : « basse » = appui partiel probable,
       « haute » = deux animaux. Un simple « écartée » obligerait à relire
       le poids pour savoir de quoi il s'agit. */
    const bas  = seuil     && v.p < seuil;
    const haut = seuilHaut && v.p > seuilHaut;
    const exclu = bas || haut;
    const cls = exclu ? "" : (Math.abs(ecart) > moy*0.10 ? "loin" : "");
    return `<tr class="${exclu ? "exclue" : ""}">
      <td class="n">${valides.length - i}</td>
      <td class="h">${hh}</td>
      <td class="p">${(v.p/1000).toFixed(3).replace(".",",")} kg</td>
      <td class="e ${cls}">${bas ? "écartée basse" : haut ? "écartée haute"
                              : (ecart>0?"+":"") + Math.round(ecart) + " g"}</td>
    </tr>`;
  }).join("");

  return `<div class="tablo">
    <table>
      <thead><tr><th>#</th><th>Heure</th><th>Poids</th><th>Écart</th></tr></thead>
      <tbody>${lignes}</tbody>
    </table>
  </div>`;
}

/* Compare les statistiques selon l'heure de départ retenue. Si le CV chute
   nettement en écartant la matinée, le jabot est en cause. */
function tableauFenetres(valides){
  if(!valides || valides.length < 8) return "";
  const fenetres = [[7,"Journée entière"],[9,"À partir de 9h"],
                    [11,"À partir de 11h"],[13,"À partir de 13h"]];
  const lignes = fenetres.map(([h,lib])=>{
    const st = statsDepuis(valides, h);
    if(st.n < 5) return "";
    return `<tr>
      <td>${lib}</td>
      <td class="num">${st.n}</td>
      <td class="num">${Math.round(st.moy).toLocaleString("fr-FR")} g</td>
      <td class="num">${st.cv.toFixed(1).replace(".",",")} %</td>
      <td class="num">${st.cvRob !== null ? st.cvRob.toFixed(1).replace(".",",") + " %" : "—"}</td>
    </tr>`;
  }).join("");
  return `<div class="fenetres">
    <table>
      <thead><tr><th>Fenêtre</th><th class="num">n</th><th class="num">Moyenne</th>
        <th class="num">CV</th><th class="num">CV cœur</th></tr></thead>
      <tbody>${lignes}</tbody>
    </table>
  </div>`;
}

function jourFR(iso){
  const [a,m,j] = iso.split("-").map(Number);
  return new Date(a,m-1,j).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
}
function confiance(n){
  if(n >= 150) return {c:"",        t:`${n} pesées valides — moyenne fiable.`};
  if(n >= 50)  return {c:"moyenne", t:`${n} pesées valides — moyenne indicative, à confirmer.`};
  return          {c:"faible",  t:`${n} pesées valides — trop peu pour conclure. Vérifiez l'accès au plateau.`};
}

function rendreSites(){
  el("sites").innerHTML = SITES.map(s=>`
    <button class="site ${s.sexe==='M'?'m':'f'}" role="tab" data-id="${s.id}"
            aria-selected="${s.id===siteId}">
      <span class="sx">${s.sexe==='M'?'♂':'♀'}</span><span>${s.libelle}</span>
    </button>`).join("");
  [...el("sites").children].forEach(b => b.onclick = () => {
    siteId = b.dataset.id; FIREBASE.site = siteId; charger();
  });
  document.documentElement.style.setProperty("--sexe", site().sexe==="M" ? CSS("--paille") : CSS("--eau"));
}

/* Carte d'autonomie de l'accu. Séparée de la maintenance à dessein : la
   maintenance dit l'instant présent, celle-ci dit la tendance — et c'est la
   tendance qui permet de programmer un déplacement au lieu de le subir. */
function carteAccu(){
  const a = autonomie(JOURS);
  const e = ETAT || {};
  const actuel = (typeof e.batt === "number") ? e.batt
               : (a.pts.length ? a.pts[a.pts.length-1].v : null);
  if(actuel === null && !a.pts.length) return "";

  const seuil = (typeof e.batt_seuil === "number") ? e.batt_seuil : BATT_ALERTE;
  const cls = battClasse(actuel, seuil);
  const pct = (typeof e.batt_pct === "number") ? e.batt_pct : battPct(actuel);

  let verdict;
  if(a.pts.length < 4){
    verdict = `<b>Pas encore de tendance.</b> Il faut au moins 4 jours de relevés
      pour distinguer une décharge d'une simple variation de température.`;
  } else if(a.jours === null){
    verdict = `<b>Décharge non mesurable</b> sur les derniers jours — l'accu tient,
      ou il a été rechargé entre-temps.`;
  } else if(a.jours <= 2){
    verdict = `<b>Environ ${a.jours} jour${a.jours>1?"s":""} restant${a.jours>1?"s":""}</b>
      avant ${volts(BATT_CRITIQUE)}. Remplacez maintenant : au-delà, le poste
      redémarre en pleine journée et perd son tampon.`;
  } else {
    verdict = `<b>Environ ${a.jours} jours restants</b> avant ${volts(BATT_CRITIQUE)},
      au rythme actuel de ${Math.abs(a.pente*1000).toFixed(0)} mV par jour.`;
  }

  return `
  <div class="carte">
    <h2>Niveau de l'accu</h2>
    <div class="note">Tension la plus basse relevée chaque jour. C'est ce creux
      qui compte, pas la tension au repos : un accu fatigué s'effondre pendant
      les émissions Wi-Fi bien avant de paraître vide.</div>
    <div class="accu-tete">
      <div>
        <div class="eyebrow">Tension actuelle</div>
        <div class="gros ${cls}">${volts(actuel)}${pct !== null ? `<span style="font-size:15px;color:var(--os-faible)"> · ${pct} %</span>` : ""}</div>
      </div>
      <div class="verdict">${verdict}</div>
    </div>
    <canvas id="accu" height="180"></canvas>
    <div class="legende">
      <span><i class="puce"></i> Creux quotidien</span>
      <span><i class="trait"></i> Seuil critique ${volts(BATT_CRITIQUE)}</span>
    </div>
  </div>`;
}

/* Filet de securite : une erreur d'affichage ne doit JAMAIS laisser l'app
   figee sur "Chargement...". On montre l'erreur plutot que rien — c'est ce
   qui permet de diagnostiquer a distance au lieu de rester aveugle. */
function rendre(){
  try {
    rendreInterne();
  } catch(err) {
    console.error(err);
    el("contenu").innerHTML =
      `<div class="carte"><div class="vide"><b>Erreur d'affichage</b>
       <code>${String(err && err.message ? err.message : err)}</code><br><br>
       Les données sont probablement intactes : c'est l'affichage qui a échoué.
       Rechargez la page (Ctrl+Shift+R).</div></div>`;
  }
}
