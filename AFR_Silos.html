<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Niveaux des silos — AFR</title>
<!--
  Lecture Firebase RTDB (projet afr-nt2), chemin : silos/{ID}
  Chaque ESP32 écrit :  silos/{ID}/distance_cm , silos/{ID}/force , silos/{ID}/ts
  L'app convertit la distance en tonnes via la géométrie de chaque silo.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Barlow:wght@400;500;600&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1117; --surface:#171a21; --surface2:#1c2029; --border:#262b36;
    --border-strong:#39414f; --text:#e6e9ef; --muted:#8b93a3; --accent:#3b82f6;
    --ok:#22c55e; --warn:#f59e0b; --crit:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Barlow',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; padding:env(safe-area-inset-top) 0 40px;
    min-height:100vh;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}

  header{padding:24px 0 18px}
  .title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h1{font-family:'Syne',sans-serif;font-weight:800;font-size:26px;letter-spacing:-.5px}
  .title .sub{color:var(--muted);font-size:14px}

  .summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
  .stat{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:10px 14px;display:flex;flex-direction:column;gap:2px
  }
  .stat .v{font-family:'DM Sans',sans-serif;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
  .stat .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .stat.crit .v{color:var(--crit)} .stat.warn .v{color:var(--warn)}
  .spacer{flex:1}
  .demo-btn{
    background:var(--surface2);border:1px solid var(--border);color:var(--muted);
    border-radius:10px;padding:9px 14px;font-family:'Barlow';font-size:13px;font-weight:500;
    cursor:pointer;transition:.15s
  }
  .demo-btn:hover{border-color:var(--border-strong);color:var(--text)}
  .demo-btn.on{background:rgba(59,130,246,.12);border-color:var(--accent);color:var(--accent)}

  .grid{
    display:grid;gap:14px;margin-top:8px;
    grid-template-columns:repeat(auto-fill,minmax(290px,1fr))
  }

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:16px;display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;
    position:relative;overflow:hidden
  }
  .card.empty{opacity:.62}
  .card .accent{position:absolute;left:0;top:0;bottom:0;width:3px}

  .silo-svg{width:84px;height:150px}

  .info{display:flex;flex-direction:column;gap:6px;min-width:0}
  .row1{display:flex;align-items:center;gap:8px}
  .silo-name{font-family:'Syne',sans-serif;font-weight:700;font-size:19px}
  .badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap}

  .big{font-family:'DM Sans',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;
    font-size:30px;line-height:1;margin-top:2px}
  .big .u{font-size:15px;color:var(--muted);font-weight:500;margin-left:3px}
  .pct{font-family:'DM Sans';font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

  .meta{display:flex;flex-direction:column;gap:3px;margin-top:4px;font-size:12.5px;color:var(--muted)}
  .meta .dist{font-variant-numeric:tabular-nums}

  .status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;margin-top:4px}
  .dot{width:8px;height:8px;border-radius:50%}
  .pill-stale{font-size:10.5px;color:var(--warn);border:1px solid rgba(245,158,11,.4);
    border-radius:6px;padding:1px 6px}
  .pill-cal{font-size:10.5px;color:var(--accent);border:1px solid rgba(59,130,246,.4);
    border-radius:6px;padding:1px 6px}

  .empty-txt{color:var(--muted);font-size:13px;margin-top:4px}

  footer{margin-top:26px;color:var(--muted);font-size:12px;line-height:1.6;text-align:center}
  footer code{background:var(--surface2);padding:1px 6px;border-radius:5px;font-size:11px}

  @media(max-width:380px){
    .card{grid-template-columns:70px 1fr} .silo-svg{width:70px;height:128px}
    h1{font-size:22px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>Niveaux des silos</h1>
      <span class="sub">AFR · litière paille granulés</span>
    </div>
    <div class="summary">
      <div class="stat"><span class="v" id="sumT">—</span><span class="l">Total estimé</span></div>
      <div class="stat warn"><span class="v" id="sumWarn">0</span><span class="l">À surveiller</span></div>
      <div class="stat crit"><span class="v" id="sumCrit">0</span><span class="l">À commander</span></div>
      <div class="spacer"></div>
      <button class="demo-btn" id="demoBtn" onclick="toggleDemo()">Mode démo</button>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    Données en temps réel depuis Firebase · chemin <code>silos/{ID}</code><br>
    Tonnage estimé à partir de la distance mesurée et de la géométrie de chaque silo.
  </footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ============ CONFIG FIREBASE (projet afr-nt2) ============
const firebaseConfig = {
  apiKey: "AIzaSyCSw10bFLStcem4A_CO4IXmKeQbLH9NXsM",
  authDomain: "afr-nt2.firebaseapp.com",
  databaseURL: "https://afr-nt2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "afr-nt2",
  storageBucket: "afr-nt2.firebasestorage.app",
  messagingSenderId: "169851474976",
  appId: "1:169851474976:web:be14c24366b0af024f9845",
  measurementId: "G-HYBY42TVJZ"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ============ GÉOMÉTRIE STANDARD (silo EQUIPEL SILO20) ============
const GEO_STD = { rayon:1.05, hCone:1.819, hCyl:5.181, dTop:0.30, densite:0.65 };

// ============ LISTE DES SILOS ============
const SILOS = [
  { id:'VS',  nom:'VS',  site:'AFR 47 · Varès', couleur:'#22c55e' },
  { id:'NV1', nom:'NV1', site:'AFR 33 · NV',    couleur:'#0ea5e9' },
  { id:'NV2', nom:'NV2', site:'AFR 33 · NV',    couleur:'#0ea5e9' },
  { id:'NT1', nom:'NT1', site:'AFR 33 · NT',    couleur:'#3b82f6' },
  { id:'ST1', nom:'ST1', site:'AFR 33 · ST',    couleur:'#14b8a6' },
  { id:'ST2', nom:'ST2', site:'AFR 33 · ST',    couleur:'#14b8a6', aModifier:true },
  { id:'SG1', nom:'SG1', site:'AFR 40 · SG',    couleur:'#f59e0b' },
  { id:'SG2', nom:'SG2', site:'AFR 40 · SG',    couleur:'#f59e0b' },
].map(s => ({ ...s, geo: { ...GEO_STD } }));

// ============ SEUILS (tonnes) ============
const SEUIL_BAS  = 4.0;            // en dessous = à surveiller
const SEUIL_CRIT = 2.0;            // en dessous = commander
const STALE_MS   = 6*3600*1000;    // 6 h sans donnée = capteur hors ligne

let DATA = {};      // données Firebase
let DEMO = false;   // mode démo
let DEMO_VALS = {}; // distances factices

// ---- conversion distance (cm) -> niveau ----
function calcSilo(distCm, geo){
  const A = Math.PI*geo.rayon*geo.rayon;
  const vCone = (1/3)*A*geo.hCone;
  const vTot  = vCone + A*geo.hCyl;
  const hSensor = geo.hCyl+geo.hCone+geo.dTop;
  const zs = hSensor - distCm/100;
  let vol;
  if (zs<=0) vol=0;
  else if (zs>=geo.hCone+geo.hCyl) vol=vTot;
  else if (zs<=geo.hCone) vol=(1/3)*A*zs*zs*zs/(geo.hCone*geo.hCone);
  else vol=vCone+A*(zs-geo.hCone);
  return { vol, tonnes:vol*geo.densite, pct:vol/vTot*100, tTot:vTot*geo.densite,
           fill:Math.max(0,Math.min(1,zs/(geo.hCone+geo.hCyl))) };
}

function statut(t){
  if (t<=SEUIL_CRIT) return {cls:'crit',label:'À commander',col:'var(--crit)'};
  if (t<=SEUIL_BAS)  return {cls:'warn',label:'À surveiller',col:'var(--warn)'};
  return {cls:'ok',label:'Niveau correct',col:'var(--ok)'};
}

function depuis(ts){
  if(!ts) return '—';
  const s=(Date.now()-ts)/1000;
  if(s<60) return "à l'instant";
  if(s<3600) return 'il y a '+Math.floor(s/60)+' min';
  if(s<86400){const h=Math.floor(s/3600);return 'il y a '+h+' h';}
  return 'il y a '+Math.floor(s/86400)+' j';
}

// ---- silhouette de silo remplie ----
function siloSVG(id, fill, color, hasData){
  const yTop=24, yCone=104, yBot=134;
  const yFill = yBot - fill*(yBot-yTop);
  const interior = `M16,${yTop} L64,${yTop} L64,${yCone} L46,${yBot} L34,${yBot} L16,${yCone} Z`;
  const clip = 'clip_'+id;
  const fillBlock = hasData ? `
      <rect x="8" y="${yFill}" width="64" height="${yBot-yFill+1}" fill="${color}" opacity="0.92" clip-path="url(#${clip})"/>
      <rect x="8" y="${yFill}" width="64" height="2.5" fill="#fff" opacity="0.35" clip-path="url(#${clip})"/>` : '';
  return `<svg class="silo-svg" viewBox="0 0 80 150" xmlns="http://www.w3.org/2000/svg">
    <defs><clipPath id="${clip}"><path d="${interior}"/></clipPath></defs>
    <path d="M16,24 C16,11 64,11 64,24" fill="var(--surface2)" stroke="var(--border-strong)" stroke-width="1.4"/>
    <line x1="40" y1="9" x2="40" y2="4" stroke="var(--border-strong)" stroke-width="1.4"/>
    ${fillBlock}
    <path d="${interior}" fill="none" stroke="var(--border-strong)" stroke-width="1.6"/>
    <line x1="34" y1="134" x2="29" y2="148" stroke="var(--border-strong)" stroke-width="1.4"/>
    <line x1="46" y1="134" x2="51" y2="148" stroke="var(--border-strong)" stroke-width="1.4"/>
    <rect x="35" y="134" width="10" height="5" rx="1" fill="var(--surface2)" stroke="var(--border-strong)" stroke-width="1.2"/>
  </svg>`;
}

function carte(s){
  const d = DATA[s.id];
  const dist = DEMO ? DEMO_VALS[s.id] : (d && typeof d.distance_cm==='number' ? d.distance_cm : null);
  const calBadge = s.aModifier ? `<span class="pill-cal">à calibrer</span>` : '';

  if (dist==null){
    return `<div class="card empty">
      <span class="accent" style="background:${s.couleur}"></span>
      ${siloSVG(s.id,0,s.couleur,false)}
      <div class="info">
        <div class="row1"><span class="silo-name">${s.nom}</span>
          <span class="badge" style="background:${s.couleur}22;color:${s.couleur}">${s.site}</span>${calBadge}</div>
        <div class="empty-txt">En attente de données du capteur</div>
      </div></div>`;
  }

  const c = calcSilo(dist, s.geo);
  const st = statut(c.tonnes);
  const stale = !DEMO && d && d.ts && (Date.now()-d.ts > STALE_MS);
  const maj = DEMO ? 'démo' : depuis(d && d.ts);

  return `<div class="card">
    <span class="accent" style="background:${s.couleur}"></span>
    ${siloSVG(s.id,c.fill,st.col,true)}
    <div class="info">
      <div class="row1"><span class="silo-name">${s.nom}</span>
        <span class="badge" style="background:${s.couleur}22;color:${s.couleur}">${s.site}</span>
        ${stale?'<span class="pill-stale">hors ligne</span>':''}${calBadge}</div>
      <div class="big">${c.tonnes.toFixed(1)}<span class="u">t</span>
        <span class="pct">· ${c.pct.toFixed(0)} % · ${c.vol.toFixed(1)} m³</span></div>
      <div class="status"><span class="dot" style="background:${st.col}"></span>${st.label}</div>
      <div class="meta">
        <span class="dist">Distance mesurée : ${dist} cm</span>
        <span>Mis à jour ${maj}${stale?' · capteur muet':''}</span>
      </div>
    </div></div>`;
}

function render(){
  let totT=0, nWarn=0, nCrit=0, nData=0;
  SILOS.forEach(s=>{
    const d=DATA[s.id];
    const dist = DEMO ? DEMO_VALS[s.id] : (d && typeof d.distance_cm==='number'? d.distance_cm:null);
    if(dist==null) return;
    const c=calcSilo(dist,s.geo), st=statut(c.tonnes);
    totT+=c.tonnes; nData++;
    if(st.cls==='crit') nCrit++; else if(st.cls==='warn') nWarn++;
  });
  document.getElementById('grid').innerHTML = SILOS.map(carte).join('');
  document.getElementById('sumT').textContent = nData ? totT.toFixed(1)+' t' : '—';
  document.getElementById('sumWarn').textContent = nWarn;
  document.getElementById('sumCrit').textContent = nCrit;
}

function toggleDemo(){
  DEMO=!DEMO;
  document.getElementById('demoBtn').classList.toggle('on',DEMO);
  if(DEMO){
    DEMO_VALS={};
    SILOS.forEach(s=>{ DEMO_VALS[s.id]=Math.round(30+Math.random()*620); });
  }
  render();
}

// ---- temps réel ----
db.ref('silos').on('value', snap=>{ DATA = snap.val()||{}; if(!DEMO) render(); });
setInterval(()=>{ if(!DEMO) render(); }, 30000); // rafraîchit les "il y a X min"
render();
</script>
</body>
</html>
