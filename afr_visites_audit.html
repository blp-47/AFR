<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Visites AFR — Audit terrain</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0}
:root{
  --bg:#09131c; --bg2:#0d1e2e; --bg3:#112030; --bg4:#081018;
  --border:#1a3a50; --border2:#24506e; --accent:#2a7abf; --accent2:#3a9ce0;
  --text:#d0e8f8; --text2:#7aaac8; --text3:#54748f;
  --green:#22c55e; --green-bg:#0a2e18; --green-b:#166534;
  --orange:#f97316; --orange-bg:#2a1500; --orange-b:#9a3a00;
  --red:#ef4444; --red-bg:#2a0a0a; --red-b:#7f1d1d;
  --yellow:#facc15; --yellow-bg:#2b2600; --yellow-b:#665c00;
  --purple:#a855f7; --purple-bg:#1e0a3a; --purple-b:#5b21b6;
}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;min-height:100vh}
header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#0a1a28,#0d2030);border-bottom:2px solid var(--border);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.header-left{display:flex;align-items:center;gap:14px}.header-sub{font-size:10px;color:var(--accent2);letter-spacing:3px;text-transform:uppercase}.header-title{font-size:20px;font-weight:800;color:#e8f4ff}
.header-actions,.row-actions,.form-actions,.filters,.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border-radius:7px;border:1px solid;padding:8px 14px;font-family:inherit;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:filter .15s, transform .1s}.btn:hover{filter:brightness(1.15)}.btn:active{transform:translateY(1px)}
.btn-primary{background:#0d3a6a;border-color:var(--accent);color:var(--accent2)}.btn-success{background:var(--green-bg);border-color:var(--green-b);color:var(--green)}.btn-neutral{background:var(--bg2);border-color:var(--border);color:var(--text2)}.btn-danger{background:var(--red-bg);border-color:var(--red-b);color:var(--red)}.btn-orange{background:var(--orange-bg);border-color:var(--orange-b);color:var(--orange)}.btn-yellow{background:var(--yellow-bg);border-color:var(--yellow-b);color:var(--yellow)}
.layout{display:flex;min-height:calc(100vh - 76px)}
.sidebar{width:240px;background:var(--bg2);border-right:2px solid var(--border);padding:16px 0;overflow-y:auto;flex-shrink:0}.sidebar-label{font-size:10px;color:var(--text3);padding:0 14px 8px;letter-spacing:2px;text-transform:uppercase}.nav-btn{display:block;width:100%;background:transparent;border:none;border-left:3px solid transparent;color:var(--text3);text-align:left;padding:11px 14px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer}.nav-btn:hover{background:#0a1e30;color:var(--accent2)}.nav-btn.active{background:#0d2e50;border-left-color:var(--accent);color:#e8f4ff}
.main{flex:1;padding:20px;overflow-y:auto}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}.card-title{font-size:15px;font-weight:800;color:#e8f4ff;margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid.one{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:4px}.label{font-size:10px;color:var(--text2);letter-spacing:1px;text-transform:uppercase}.input, textarea, select{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:9px 12px;font-family:inherit;font-size:13px}textarea{resize:vertical;min-height:80px}.input:focus, textarea:focus, select:focus{outline:none;border-color:var(--accent)}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;min-width:120px}.stat-value{font-size:24px;font-weight:800}.stat-label{font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
.visit-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;cursor:pointer;transition:border-color .15s}.visit-card:hover{border-color:var(--accent)}
.visit-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}.visit-title{font-size:18px;font-weight:800;color:#e8f4ff}.muted{color:var(--text2)}.small{font-size:11px}.tiny{font-size:10px;color:var(--text3)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;border:1px solid}
.b-green{background:var(--green-bg);border-color:var(--green-b);color:var(--green)}.b-orange{background:var(--orange-bg);border-color:var(--orange-b);color:var(--orange)}.b-red{background:var(--red-bg);border-color:var(--red-b);color:var(--red)}.b-yellow{background:var(--yellow-bg);border-color:var(--yellow-b);color:var(--yellow)}.b-purple{background:var(--purple-bg);border-color:var(--purple-b);color:#d8b4fe}
.progress-wrap{height:8px;background:#1a2e42;border-radius:999px;overflow:hidden;margin-top:8px}.progress-bar{height:100%;background:var(--accent)}
.rubrique{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}.rubrique-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.rubrique-title{font-size:13px;font-weight:800}.score-opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.score-btn{border:1px solid var(--border);background:var(--bg2);color:var(--text2);padding:6px 10px;border-radius:7px;font-family:inherit;font-size:11px;font-weight:800;cursor:pointer}.score-btn.active.bad{background:var(--red-bg);border-color:var(--red-b);color:var(--red)}.score-btn.active.mid{background:var(--yellow-bg);border-color:var(--yellow-b);color:var(--yellow)}.score-btn.active.good{background:var(--green-bg);border-color:var(--green-b);color:var(--green)}
.photo-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}.photo-item{background:var(--bg4);border:1px solid var(--border);border-radius:8px;overflow:hidden}.photo-item img{display:block;width:100%;height:110px;object-fit:cover}.photo-item button{width:100%;border:none;background:var(--red-bg);color:var(--red);padding:7px;font-family:inherit;font-size:10px;font-weight:800;cursor:pointer}
.action-item{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}.action-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:end}
.section-title{font-size:13px;color:var(--accent2);font-weight:800;letter-spacing:1px;text-transform:uppercase;margin:20px 0 10px}.list-empty{background:var(--bg2);border:1px dashed var(--border2);border-radius:12px;padding:28px;text-align:center;color:var(--text2)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.tab{background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text2);padding:8px 12px;font-family:inherit;font-size:11px;font-weight:800;cursor:pointer}.tab.active{background:#0d2e50;border-color:var(--accent);color:#e8f4ff}.tabpane{display:none}.tabpane.active{display:block}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}.modal-bg.open{display:flex}.modal{width:min(760px,96vw);max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:18px}
hr.sep{border:none;height:1px;background:var(--border);margin:14px 0}
@media(max-width:960px){.form-grid,.form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.action-row{grid-template-columns:1fr 1fr}.sidebar{display:none}.main{padding:14px}}
@media(max-width:640px){.form-grid,.form-grid.two{grid-template-columns:1fr}.action-row{grid-template-columns:1fr}.visit-title{font-size:16px}}
@media print{
  header,.sidebar,.header-actions,.filters,.tabs,.row-actions,.btn{display:none!important}
  body{background:#fff;color:#000;font-family:Arial,sans-serif}
  .layout,.main{display:block;padding:0;margin:0}
  .card,.visit-card,.rubrique,.action-item{background:#fff!important;color:#000!important;border:1px solid #999!important;break-inside:avoid;page-break-inside:avoid}
  .muted,.tiny,.small,.label{color:#444!important}.progress-wrap{background:#ddd!important}.progress-bar{background:#666!important}
}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <div>
      <div class="header-sub">AFR Élevage</div>
      <div class="header-title">📝 Visites AFR</div>
    </div>
  </div>
  <div class="header-actions">
    <span id="syncStatus" class="small muted">📵 local</span>
    <button class="btn btn-orange" onclick="showList()">📋 Historique</button>
    <button class="btn btn-success" onclick="newVisit()">＋ Nouvelle visite</button>
  </div>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-label">Navigation</div>
    <button class="nav-btn active" id="nav-home" onclick="showHome()">🏠 Accueil</button>
    <button class="nav-btn" id="nav-list" onclick="showList()">📋 Toutes les visites</button>
    <div class="sidebar-label" style="margin-top:14px">En attente</div>
    <div id="sidebarTodo"></div>
  </aside>
  <main class="main" id="app"></main>
</div>

<div class="modal-bg" id="modalNew">
  <div class="modal">
    <div class="card-title">Nouvelle visite</div>
    <div class="form-grid two">
      <div class="form-group"><label class="label">Site</label><select id="nv-site"><option>AFR 33</option><option>AFR 40</option><option>AFR 47</option></select></div>
      <div class="form-group"><label class="label">Bâtiment</label><select id="nv-bat"><option>NT1</option><option>NT2</option><option>NV1</option><option>NV2</option><option>ST1</option><option>ST2</option><option>ST3</option><option>VS</option><option>SG1</option><option>SG2</option><option>SG3</option></select></div>
      <div class="form-group"><label class="label">Responsable</label><input class="input" id="nv-resp" placeholder="Prénom Nom"></div>
      <div class="form-group"><label class="label">Type de visite</label><select id="nv-type"><option>Routine</option><option>Sanitaire</option><option>Technique</option><option>Biosécurité</option><option>Préparation lot</option><option>Problème signalé</option></select></div>
      <div class="form-group"><label class="label">Date</label><input class="input" id="nv-date" type="date"></div>
      <div class="form-group"><label class="label">Heure</label><input class="input" id="nv-heure" type="time"></div>
    </div>
    <div class="form-group" style="margin-top:12px"><label class="label">Commentaire général</label><textarea id="nv-comment" placeholder="Résumé rapide de la visite..."></textarea></div>
    <div class="form-actions" style="margin-top:14px">
      <button class="btn btn-success" onclick="createVisit()">Créer</button>
      <button class="btn btn-neutral" onclick="closeModal('modalNew')">Annuler</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
const FIREBASE_CONFIG={apiKey:"AIzaSyCSw10bFLStcem4A_CO4IXmKeQbLH9NXsM",authDomain:"afr-nt2.firebaseapp.com",databaseURL:"https://afr-nt2-default-rtdb.europe-west1.firebasedatabase.app",projectId:"afr-nt2",storageBucket:"afr-nt2.firebasestorage.app",messagingSenderId:"169851474976",appId:"1:169851474976:web:be14c24366b0af024f9845"};
let db=null,firebaseOK=false;
try{if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database();firebaseOK=true;document.getElementById('syncStatus').textContent='☁️ sync actif';}catch(e){}

const RUBRIQUES=[
  'Propreté générale','Ambiance bâtiment','Matériel / état technique','Eau / aliment','Biosécurité','Rangement / organisation','État sanitaire apparent','Qualité du travail réalisé'
];
const BATS=['NT1','NT2','NV1','NV2','ST1','ST2','ST3','VS','SG1','SG2','SG3'];
let visits={}, currentId=null;

function today(){return new Date().toISOString().slice(0,10)}
function nowTime(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function lsKey(id){return 'afr_visite_'+id}
function fbPath(id){return 'visitesAFR/'+id}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function badgeStatus(s){if(s==='fait')return '<span class="badge b-green">✓ Fait</span>';if(s==='en_cours')return '<span class="badge b-orange">⏳ En cours</span>';return '<span class="badge b-red">• À faire</span>'}

function makeRubriques(){
  return RUBRIQUES.map((r,i)=>({id:'r'+(i+1),nom:r,note:0,commentaire:'',photos:[]}));
}

function defaultVisit(data={}){
  return {
    id:data.id||genId(),
    site:data.site||'AFR 33',
    bat:data.bat||'ST3',
    responsable:data.responsable||'',
    type:data.type||'Routine',
    date:data.date||today(),
    heure:data.heure||nowTime(),
    commentaireGeneral:data.commentaireGeneral||'',
    pointsPositifs:data.pointsPositifs||'',
    pointsCorriger:data.pointsCorriger||'',
    actionsDemandees:data.actionsDemandees||'',
    statut:data.statut||'ouvert',
    signature:data.signature||'',
    rubriques:data.rubriques||makeRubriques(),
    actions:data.actions||[],
    createdAt:data.createdAt||Date.now(),
    updatedAt:data.updatedAt||Date.now(),
  }
}

function loadAll(){
  visits={};
  Object.keys(localStorage).filter(k=>k.startsWith('afr_visite_')).forEach(k=>{try{const v=JSON.parse(localStorage.getItem(k));if(v&&v.id)visits[v.id]=defaultVisit(v)}catch(e){}})
}
function saveVisit(v){v.updatedAt=Date.now();visits[v.id]=v;localStorage.setItem(lsKey(v.id),JSON.stringify(v));if(firebaseOK)db.ref(fbPath(v.id)).set(v).catch(()=>{})}
async function syncFromFirebase(){if(!firebaseOK)return;try{const s=await db.ref('visitesAFR').get();if(s.exists())Object.entries(s.val()).forEach(([id,v])=>{visits[id]=defaultVisit(v);localStorage.setItem(lsKey(id),JSON.stringify(visits[id]))})}catch(e){}}
function deleteVisit(id){delete visits[id];localStorage.removeItem(lsKey(id));if(firebaseOK)db.ref(fbPath(id)).remove().catch(()=>{});currentId=null;showHome()}

function setNav(id){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));if(id){const el=document.getElementById(id);if(el)el.classList.add('active')}}
function closeModal(id){document.getElementById(id).classList.remove('open')}
function openModal(id){document.getElementById(id).classList.add('open')}

function calcScore(v){const arr=v.rubriques||[];if(!arr.length)return 0;return Math.round(arr.reduce((s,r)=>s+(Number(r.note)||0),0)/arr.length*20)}
function countTodo(v){return (v.actions||[]).filter(a=>a.statut!=='fait').length}
function statusText(v){const todo=countTodo(v);if(v.statut==='clos')return '<span class="badge b-green">Visite close</span>';if(todo>0)return '<span class="badge b-orange">Actions en attente : '+todo+'</span>';return '<span class="badge b-purple">Partagée</span>'}

function updateSidebar(){
  const arr=Object.values(visits).sort((a,b)=>b.updatedAt-a.updatedAt).filter(v=>countTodo(v)>0).slice(0,8);
  const el=document.getElementById('sidebarTodo');
  el.innerHTML=arr.length?arr.map(v=>`<button class="nav-btn ${currentId===v.id?'active':''}" onclick="openVisit('${v.id}')">${esc(v.bat)} <span class="tiny">${countTodo(v)} action(s)</span></button>`).join(''):'<div class="tiny" style="padding:0 14px">Aucune action en attente</div>';
}

function showHome(){
  currentId=null;setNav('nav-home');updateSidebar();
  const arr=Object.values(visits).sort((a,b)=>b.updatedAt-a.updatedAt);
  const ouvertes=arr.filter(v=>v.statut!=='clos').length;
  const todo=arr.reduce((s,v)=>s+countTodo(v),0);
  const avg=arr.length?Math.round(arr.reduce((s,v)=>s+calcScore(v),0)/arr.length):0;
  document.getElementById('app').innerHTML=`
    <div style="max-width:980px">
      <div style="font-size:25px;font-weight:800;color:#e8f4ff;margin-bottom:4px">Visites responsables</div>
      <div class="muted small" style="margin-bottom:22px">Historique partagé des observations terrain AFR</div>
      <div class="stats" style="margin-bottom:22px">
        <div class="stat"><div class="stat-value" style="color:var(--accent2)">${arr.length}</div><div class="stat-label">Visites</div></div>
        <div class="stat"><div class="stat-value" style="color:var(--orange)">${ouvertes}</div><div class="stat-label">Ouvertes</div></div>
        <div class="stat"><div class="stat-value" style="color:var(--red)">${todo}</div><div class="stat-label">Actions à faire</div></div>
        <div class="stat"><div class="stat-value" style="color:var(--green)">${avg}/20</div><div class="stat-label">Note moyenne</div></div>
      </div>
      <div class="card">
        <div class="card-title">Lancer une visite</div>
        <div class="muted small" style="margin-bottom:12px">Créer une fiche pour garder une trace, partager les remarques et suivre les corrections.</div>
        <button class="btn btn-success" onclick="newVisit()">＋ Nouvelle visite</button>
      </div>
      <div class="section-title">Dernières visites</div>
      ${arr.length?arr.slice(0,8).map(renderVisitCard).join(''):'<div class="list-empty">Aucune visite enregistrée.</div>'}
    </div>`;
}

function showList(){
  currentId=null;setNav('nav-list');updateSidebar();
  const arr=Object.values(visits).sort((a,b)=>b.updatedAt-a.updatedAt);
  document.getElementById('app').innerHTML=`
    <div style="max-width:1080px">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
        <div>
          <div style="font-size:24px;font-weight:800;color:#e8f4ff">Historique des visites</div>
          <div class="muted small">Recherche rapide par bâtiment ou responsable</div>
        </div>
        <button class="btn btn-success" onclick="newVisit()">＋ Nouvelle visite</button>
      </div>
      <div class="card">
        <div class="filters">
          <input class="input" id="f-search" placeholder="Rechercher bâtiment, responsable, type..." oninput="applyFilters()" style="flex:2;min-width:220px">
          <select id="f-bat" onchange="applyFilters()" class="input" style="flex:1;min-width:130px"><option value="">Tous bâtiments</option>${BATS.map(b=>`<option>${b}</option>`).join('')}</select>
          <select id="f-stat" onchange="applyFilters()" class="input" style="flex:1;min-width:130px"><option value="">Tous statuts</option><option value="ouvert">Ouvertes</option><option value="clos">Closes</option></select>
        </div>
      </div>
      <div id="listWrap">${arr.length?arr.map(renderVisitCard).join(''):'<div class="list-empty">Aucune visite enregistrée.</div>'}</div>
    </div>`;
}

function applyFilters(){
  const q=(document.getElementById('f-search')?.value||'').toLowerCase().trim();
  const bat=document.getElementById('f-bat')?.value||'';
  const stat=document.getElementById('f-stat')?.value||'';
  const arr=Object.values(visits).sort((a,b)=>b.updatedAt-a.updatedAt).filter(v=>{
    const hay=(v.bat+' '+v.responsable+' '+v.type+' '+v.site+' '+v.commentaireGeneral).toLowerCase();
    return (!q||hay.includes(q)) && (!bat||v.bat===bat) && (!stat||v.statut===stat);
  });
  document.getElementById('listWrap').innerHTML=arr.length?arr.map(renderVisitCard).join(''):'<div class="list-empty">Aucun résultat.</div>';
}

function renderVisitCard(v){
  const score=calcScore(v); const todo=countTodo(v);
  const pct=Math.round(score/20*100);
  return `<div class="visit-card" onclick="openVisit('${v.id}')">
    <div class="visit-head">
      <div>
        <div class="visit-title">${esc(v.bat)} — ${esc(v.type)}</div>
        <div class="small muted">${esc(v.site)} · ${esc(v.date)} ${esc(v.heure||'')} · ${esc(v.responsable||'Sans nom')}</div>
      </div>
      <div class="row-actions">
        ${statusText(v)}
        <span class="badge ${score>=16?'b-green':score>=12?'b-yellow':'b-red'}">${score}/20</span>
      </div>
    </div>
    <div class="small" style="margin-top:10px">${esc(v.commentaireGeneral||'Aucun commentaire général').slice(0,180)}</div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="tiny" style="margin-top:7px">${todo} action(s) en attente · mise à jour ${new Date(v.updatedAt).toLocaleString('fr-FR')}</div>
  </div>`
}

function newVisit(){
  document.getElementById('nv-date').value=today();
  document.getElementById('nv-heure').value=nowTime();
  document.getElementById('nv-site').value='AFR 33';
  document.getElementById('nv-bat').value='ST3';
  document.getElementById('nv-resp').value='';
  document.getElementById('nv-type').value='Routine';
  document.getElementById('nv-comment').value='';
  openModal('modalNew');
}

function createVisit(){
  const v=defaultVisit({
    site:document.getElementById('nv-site').value,
    bat:document.getElementById('nv-bat').value,
    responsable:document.getElementById('nv-resp').value.trim(),
    type:document.getElementById('nv-type').value,
    date:document.getElementById('nv-date').value,
    heure:document.getElementById('nv-heure').value,
    commentaireGeneral:document.getElementById('nv-comment').value.trim(),
  });
  saveVisit(v); closeModal('modalNew'); openVisit(v.id);
}

function openVisit(id){
  currentId=id; setNav(null); updateSidebar();
  const v=visits[id]; if(!v) return showHome();
  const score=calcScore(v);
  document.getElementById('app').innerHTML=`
    <div style="max-width:1100px">
      <div class="card">
        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start">
          <div>
            <div style="font-size:30px;font-weight:800;color:#e8f4ff;letter-spacing:1px">${esc(v.bat)}</div>
            <div class="small muted">${esc(v.site)} · ${esc(v.type)} · ${esc(v.date)} ${esc(v.heure||'')}</div>
            <div class="small muted">Responsable : ${esc(v.responsable||'—')}</div>
          </div>
          <div class="row-actions">
            ${statusText(v)}
            <button class="btn btn-neutral" onclick="showList()">← Retour</button>
            <button class="btn btn-yellow" onclick="window.print()">🖨️ PDF</button>
            <button class="btn btn-danger" onclick="if(confirm('Supprimer cette visite ?')) deleteVisit('${v.id}')">🗑</button>
          </div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('resume',this)">Résumé</button>
        <button class="tab" onclick="switchTab('rubriques',this)">Rubriques</button>
        <button class="tab" onclick="switchTab('actions',this)">Actions</button>
        <button class="tab" onclick="switchTab('partage',this)">Partage</button>
      </div>

      <div class="tabpane active" id="tab-resume">${renderResume(v,score)}</div>
      <div class="tabpane" id="tab-rubriques">${renderRubriques(v)}</div>
      <div class="tabpane" id="tab-actions">${renderActions(v)}</div>
      <div class="tabpane" id="tab-partage">${renderPartage(v)}</div>
    </div>`;
}

function renderResume(v,score){
  return `
    <div class="stats" style="margin-bottom:16px">
      <div class="stat"><div class="stat-value" style="color:${score>=16?'var(--green)':score>=12?'var(--yellow)':'var(--red)'}">${score}/20</div><div class="stat-label">Note globale</div></div>
      <div class="stat"><div class="stat-value" style="color:var(--orange)">${countTodo(v)}</div><div class="stat-label">Actions ouvertes</div></div>
      <div class="stat"><div class="stat-value" style="color:var(--accent2)">${(v.rubriques||[]).length}</div><div class="stat-label">Rubriques</div></div>
    </div>
    <div class="card">
      <div class="card-title">Informations générales</div>
      <div class="form-grid two">
        <div class="form-group"><label class="label">Site</label><select onchange="updateField('site',this.value)">${['AFR 33','AFR 40','AFR 47'].map(x=>`<option ${v.site===x?'selected':''}>${x}</option>`).join('')}</select></div>
        <div class="form-group"><label class="label">Bâtiment</label><select onchange="updateField('bat',this.value)">${BATS.map(x=>`<option ${v.bat===x?'selected':''}>${x}</option>`).join('')}</select></div>
        <div class="form-group"><label class="label">Responsable</label><input class="input" value="${esc(v.responsable)}" onchange="updateField('responsable',this.value)"></div>
        <div class="form-group"><label class="label">Type</label><select onchange="updateField('type',this.value)">${['Routine','Sanitaire','Technique','Biosécurité','Préparation lot','Problème signalé'].map(x=>`<option ${v.type===x?'selected':''}>${x}</option>`).join('')}</select></div>
        <div class="form-group"><label class="label">Date</label><input class="input" type="date" value="${esc(v.date)}" onchange="updateField('date',this.value)"></div>
        <div class="form-group"><label class="label">Heure</label><input class="input" type="time" value="${esc(v.heure||'')}" onchange="updateField('heure',this.value)"></div>
        <div class="form-group"><label class="label">Statut</label><select onchange="updateField('statut',this.value)"><option value="ouvert" ${v.statut==='ouvert'?'selected':''}>Ouvert</option><option value="clos" ${v.statut==='clos'?'selected':''}>Clos</option></select></div>
        <div class="form-group"><label class="label">Signature</label><input class="input" value="${esc(v.signature||'')}" placeholder="Nom du responsable" onchange="updateField('signature',this.value)"></div>
      </div>
      <div class="form-group" style="margin-top:12px"><label class="label">Commentaire général</label><textarea onchange="updateField('commentaireGeneral',this.value)">${esc(v.commentaireGeneral||'')}</textarea></div>
    </div>
    <div class="card">
      <div class="card-title">Synthèse de visite</div>
      <div class="form-grid one">
        <div class="form-group"><label class="label">Points positifs observés</label><textarea onchange="updateField('pointsPositifs',this.value)">${esc(v.pointsPositifs||'')}</textarea></div>
        <div class="form-group"><label class="label">Points à corriger</label><textarea onchange="updateField('pointsCorriger',this.value)">${esc(v.pointsCorriger||'')}</textarea></div>
        <div class="form-group"><label class="label">Actions demandées</label><textarea onchange="updateField('actionsDemandees',this.value)">${esc(v.actionsDemandees||'')}</textarea></div>
      </div>
    </div>`;
}

function renderRubriques(v){
  return `<div class="card"><div class="card-title">Notation et observations</div>${(v.rubriques||[]).map((r,idx)=>`
    <div class="rubrique">
      <div class="rubrique-top">
        <div class="rubrique-title">${idx+1}. ${esc(r.nom)}</div>
        <span class="badge ${r.note>=4?'b-green':r.note>=3?'b-yellow':r.note>0?'b-orange':'b-red'}">${r.note||0}/5</span>
      </div>
      <div class="score-opts">
        <button class="score-btn ${(r.note===1||r.note===2)?'active bad':''}" onclick="setRubriqueNote(${idx},1)">Mauvais</button>
        <button class="score-btn ${r.note===3?'active mid':''}" onclick="setRubriqueNote(${idx},3)">Moyen</button>
        <button class="score-btn ${(r.note===4||r.note===5)?'active good':''}" onclick="setRubriqueNote(${idx},5)">Bon</button>
      </div>
      <div class="tiny" style="margin-top:6px">Sélection rapide. La note passe à 1, 3 ou 5.</div>
      <div class="form-group" style="margin-top:10px"><label class="label">Remarque</label><textarea onchange="setRubriqueComment(${idx},this.value)">${esc(r.commentaire||'')}</textarea></div>
      <div class="form-group" style="margin-top:10px"><label class="label">Photos</label><input class="input" type="file" accept="image/*" multiple onchange="addPhotos(${idx},this)"></div>
      ${(r.photos||[]).length?`<div class="photo-list">${r.photos.map((p,pidx)=>`<div class="photo-item"><img src="${p}" alt="photo"><button onclick="removePhoto(${idx},${pidx})">Supprimer</button></div>`).join('')}</div>`:''}
    </div>`).join('')}</div>`;
}

function renderActions(v){
  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap">
        <div class="card-title" style="margin-bottom:0">Actions correctives</div>
        <button class="btn btn-success" onclick="addAction()">＋ Ajouter une action</button>
      </div>
      <div class="tiny" style="margin-bottom:12px">Transformer les remarques en actions suivies.</div>
      ${(v.actions||[]).length?(v.actions||[]).map((a,idx)=>`
        <div class="action-item">
          <div class="action-row">
            <div class="form-group"><label class="label">Action</label><input class="input" value="${esc(a.texte||'')}" onchange="setAction(${idx},'texte',this.value)"></div>
            <div class="form-group"><label class="label">Responsable</label><input class="input" value="${esc(a.responsable||'')}" onchange="setAction(${idx},'responsable',this.value)"></div>
            <div class="form-group"><label class="label">Échéance</label><input class="input" type="date" value="${esc(a.echeance||'')}" onchange="setAction(${idx},'echeance',this.value)"></div>
            <div class="form-group"><label class="label">Statut</label><select onchange="setAction(${idx},'statut',this.value)"><option value="a_faire" ${a.statut==='a_faire'?'selected':''}>À faire</option><option value="en_cours" ${a.statut==='en_cours'?'selected':''}>En cours</option><option value="fait" ${a.statut==='fait'?'selected':''}>Fait</option></select></div>
            <button class="btn btn-danger" onclick="removeAction(${idx})">🗑</button>
          </div>
          <div class="form-group" style="margin-top:10px"><label class="label">Commentaire</label><textarea onchange="setAction(${idx},'commentaire',this.value)">${esc(a.commentaire||'')}</textarea></div>
        </div>`).join(''):'<div class="list-empty">Aucune action pour le moment.</div>'}
    </div>`;
}

function renderPartage(v){
  return `
    <div class="card">
      <div class="card-title">Compte rendu partagé</div>
      <div class="small muted" style="margin-bottom:12px">Page pensée pour être lue par les autres responsables ou exportée en PDF.</div>
      <div class="visit-card" style="cursor:default">
        <div class="visit-head">
          <div>
            <div class="visit-title">${esc(v.bat)} — ${esc(v.type)}</div>
            <div class="small muted">${esc(v.site)} · ${esc(v.date)} ${esc(v.heure||'')} · ${esc(v.responsable||'—')}</div>
          </div>
          <div class="row-actions">
            <span class="badge ${calcScore(v)>=16?'b-green':calcScore(v)>=12?'b-yellow':'b-red'}">Note ${calcScore(v)}/20</span>
            ${statusText(v)}
          </div>
        </div>
        <hr class="sep">
        <div><strong>Commentaire général :</strong><br>${esc(v.commentaireGeneral||'—')}</div>
        <div style="margin-top:12px"><strong>Points positifs :</strong><br>${esc(v.pointsPositifs||'—')}</div>
        <div style="margin-top:12px"><strong>Points à corriger :</strong><br>${esc(v.pointsCorriger||'—')}</div>
        <div style="margin-top:12px"><strong>Actions demandées :</strong><br>${esc(v.actionsDemandees||'—')}</div>
        <div class="section-title">Résumé des rubriques</div>
        ${(v.rubriques||[]).map(r=>`<div class="small" style="padding:8px 0;border-bottom:1px solid var(--border)"><strong>${esc(r.nom)}</strong> — ${r.note||0}/5<br>${esc(r.commentaire||'')}</div>`).join('')}
        <div class="section-title">Actions correctives</div>
        ${(v.actions||[]).length?(v.actions||[]).map(a=>`<div class="small" style="padding:8px 0;border-bottom:1px solid var(--border)">${badgeStatus(a.statut)} <strong>${esc(a.texte||'')}</strong><br>Responsable : ${esc(a.responsable||'—')} · Échéance : ${esc(a.echeance||'—')}<br>${esc(a.commentaire||'')}</div>`).join(''):'<div class="small muted">Aucune action.</div>'}
        <div style="margin-top:12px"><strong>Signature :</strong> ${esc(v.signature||'—')}</div>
      </div>
    </div>`
}

function switchTab(id,btn){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('active'));btn.classList.add('active');document.getElementById('tab-'+id).classList.add('active')}

function updateField(key,val){const v=visits[currentId]; if(!v) return; v[key]=val; saveVisit(v); openVisit(v.id)}
function setRubriqueNote(idx,val){const v=visits[currentId]; if(!v) return; v.rubriques[idx].note=val; saveVisit(v); document.getElementById('tab-rubriques').innerHTML=renderRubriques(v); document.getElementById('tab-resume').innerHTML=renderResume(v,calcScore(v)); document.getElementById('tab-partage').innerHTML=renderPartage(v)}
function setRubriqueComment(idx,val){const v=visits[currentId]; if(!v) return; v.rubriques[idx].commentaire=val; saveVisit(v)}
function addPhotos(idx,input){const files=[...(input.files||[])]; if(!files.length) return; const v=visits[currentId]; if(!v) return; let pending=files.length; files.forEach(file=>{const reader=new FileReader(); reader.onload=e=>{v.rubriques[idx].photos.push(e.target.result); pending--; if(pending===0){saveVisit(v); document.getElementById('tab-rubriques').innerHTML=renderRubriques(v)}}; reader.readAsDataURL(file)}); input.value=''}
function removePhoto(rIdx,pIdx){const v=visits[currentId]; if(!v) return; v.rubriques[rIdx].photos.splice(pIdx,1); saveVisit(v); document.getElementById('tab-rubriques').innerHTML=renderRubriques(v)}
function addAction(){const v=visits[currentId]; if(!v) return; v.actions.push({texte:'',responsable:'',echeance:'',statut:'a_faire',commentaire:''}); saveVisit(v); openVisit(v.id)}
function setAction(idx,key,val){const v=visits[currentId]; if(!v) return; v.actions[idx][key]=val; saveVisit(v); if(key==='statut'){openVisit(v.id)}}
function removeAction(idx){const v=visits[currentId]; if(!v) return; v.actions.splice(idx,1); saveVisit(v); openVisit(v.id)}

document.querySelectorAll('.modal-bg').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));
(async function init(){loadAll(); await syncFromFirebase(); loadAll(); showHome(); updateSidebar();})();
</script>
</body>
</html>
