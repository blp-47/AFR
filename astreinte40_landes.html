<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Astreinte Contrôles du Soir — AFR 40 Landes</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1117; --surface:#181c27; --surface2:#1f2435; --border:#2a3045;
  --text:#e8ecf4; --muted:#6b7594; --accent:#f5a623; --accent2:#e8834a;
  --christophe:#4a9eff; --laura:#a855f7; --jeremy:#22c55e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

.page{display:none;flex-direction:column;min-height:100vh;}
.page.active{display:flex;}

/* ── ACCUEIL ── */
#page-accueil{
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 55% 25%,#1b2340 0%,var(--bg) 65%);
  padding:28px 24px 40px;
}
.accueil-logo-wrap{margin-bottom:16px;display:flex;align-items:center;justify-content:center;animation:fadeDown .5s ease both;}
.accueil-logo{width:140px;height:auto;display:block;filter:drop-shadow(0 4px 20px rgba(245,166,35,.4));}
.accueil-title{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;text-align:center;margin-bottom:3px;animation:fadeDown .5s .1s ease both;}
.accueil-sub{font-size:0.75rem;color:var(--muted);text-align:center;margin-bottom:32px;animation:fadeDown .5s .15s ease both;}
.accueil-prompt{font-family:'Syne',sans-serif;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:14px;text-align:center;animation:fadeDown .5s .2s ease both;}
.accueil-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:320px;}

.accueil-btn{
  padding:18px 10px;border-radius:18px;border:2px solid var(--border);
  background:var(--surface);color:var(--text);font-family:'Syne',sans-serif;
  font-size:1.05rem;font-weight:700;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  transition:all .18s;animation:fadeUp .45s ease both;
}
.accueil-btn:active{transform:scale(.95);}
.accueil-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.25rem;}

/* Bouton ajouter */
.accueil-btn-add{
  padding:14px 10px;border-radius:18px;border:2px dashed var(--border);
  background:transparent;color:var(--muted);font-family:'Syne',sans-serif;
  font-size:0.85rem;font-weight:600;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  transition:all .18s;animation:fadeUp .45s .5s ease both;
  grid-column: 1 / -1;
}
.accueil-btn-add:hover{border-color:var(--accent);color:var(--accent);}

/* ── HEADER ── */
header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 14px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:100;
}
.header-logo{height:36px;width:auto;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3));}
.header-titles{flex:1;min-width:0;}
.header-titles h1{font-family:'Syne',sans-serif;font-size:0.9rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.header-titles p{font-size:0.65rem;color:var(--muted);margin-top:1px;}
.header-right{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.user-chip{display:flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 10px 4px 6px;font-size:0.7rem;font-family:'Syne',sans-serif;font-weight:600;}
.user-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.btn-logout{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:0.72rem;padding:5px 8px;cursor:pointer;font-family:'Syne',sans-serif;font-weight:700;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0;}
.sync-dot.syncing{background:var(--accent);animation:pulse .8s ease infinite alternate;}
.sync-dot.error{background:#f43f5e;}

/* ── TABS ── */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 10px;gap:2px;overflow-x:auto;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{font-family:'Syne',sans-serif;font-size:0.73rem;font-weight:700;padding:10px 12px;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

main{flex:1;padding:14px 13px 80px;max-width:640px;margin:0 auto;width:100%;}
.view{display:none;} .view.active{display:block;}

/* ── PLANNING ── */
.week-block{margin-bottom:24px;}
.week-label{font-family:'Syne',sans-serif;font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);margin-bottom:8px;padding-left:2px;}
.day-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;margin-bottom:7px;display:flex;align-items:center;gap:11px;padding:10px 13px;cursor:pointer;transition:border-color .2s;position:relative;overflow:hidden;}
.day-card.past{opacity:.42;cursor:default;} .day-card.today{border-color:var(--accent);}
.day-card:active:not(.past){background:var(--surface2);}
.color-bar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:13px 0 0 13px;background:var(--border);}
.day-date{min-width:38px;text-align:center;flex-shrink:0;}
.day-date .num{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;line-height:1;}
.day-date .dow{font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-top:1px;}
.day-divider{width:1px;height:30px;background:var(--border);flex-shrink:0;}
.day-info{flex:1;min-width:0;}
.day-assignee{font-family:'Syne',sans-serif;font-size:0.9rem;font-weight:700;}
.day-unassigned{font-size:0.8rem;color:var(--muted);font-style:italic;}
.day-meta{font-size:0.65rem;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px;}
.today-badge{background:var(--accent);color:#000;font-size:0.53rem;font-weight:700;font-family:'Syne',sans-serif;text-transform:uppercase;letter-spacing:.7px;padding:2px 5px;border-radius:5px;}
.day-arrow{font-size:1rem;color:var(--border);flex-shrink:0;}
.day-card:not(.past):hover .day-arrow{color:var(--accent);}

/* ── RÉCAP ── */
.recap-week-title{font-family:'Syne',sans-serif;font-size:0.76rem;font-weight:700;text-transform:uppercase;letter-spacing:1.1px;color:var(--accent);margin:16px 0 9px;}
.recap-week-title:first-child{margin-top:0;}
.recap-row{background:var(--surface);border:1px solid var(--border);border-radius:11px;display:flex;align-items:center;gap:10px;padding:10px 13px;margin-bottom:6px;}
.recap-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.recap-date{color:var(--muted);font-size:0.77rem;flex:1;}
.recap-name{font-family:'Syne',sans-serif;font-size:0.88rem;font-weight:700;}
.recap-empty{font-size:0.77rem;color:var(--border);}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px;}
.stat-name{font-family:'Syne',sans-serif;font-size:0.88rem;font-weight:700;margin-bottom:4px;}
.stat-count{font-family:'Syne',sans-serif;font-size:1.7rem;font-weight:800;line-height:1;}
.stat-label{font-size:0.63rem;color:var(--muted);margin-top:2px;}
.stat-next{font-size:0.65rem;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);line-height:1.5;}
.stat-next strong{color:var(--text);font-weight:500;}
.section-title{font-family:'Syne',sans-serif;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:18px 0 9px;}

/* ── HISTORIQUE ── */
.histo-filter{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;}
.histo-filter-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:'Syne',sans-serif;font-size:0.7rem;font-weight:700;cursor:pointer;}
.histo-filter-btn.active{color:var(--text);border-color:var(--text);}
.histo-entry{background:var(--surface);border-radius:11px;border:1px solid var(--border);padding:11px 13px;margin-bottom:7px;display:flex;align-items:flex-start;gap:9px;}
.histo-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.histo-body{flex:1;min-width:0;}
.histo-action{font-size:0.8rem;line-height:1.45;}
.histo-actor{font-weight:600;}
.histo-target{font-weight:500;color:var(--accent);}
.histo-change{font-size:0.7rem;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.histo-from{text-decoration:line-through;}
.histo-time{font-size:0.63rem;color:var(--muted);margin-top:4px;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:24px 24px 0 0;width:100%;max-width:640px;padding:20px 17px 28px;animation:slideUp .22s ease;}
.modal-handle{width:32px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
.modal-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;margin-bottom:3px;}
.modal-sub{font-size:0.73rem;color:var(--muted);margin-bottom:6px;}
.modal-cur{font-size:0.72rem;color:var(--muted);margin-bottom:16px;}
.modal-cur span{font-weight:600;color:var(--text);}
.person-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px;}
.person-btn{padding:13px 8px;border-radius:13px;border:2px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Syne',sans-serif;font-size:0.92rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s;}
.person-btn:active{transform:scale(.96);}
.person-btn.sel{border-color:currentColor;}
.pdot{width:9px;height:9px;border-radius:50%;background:currentColor;flex-shrink:0;}
.btn-clear{width:100%;padding:11px;border-radius:12px;border:1px dashed var(--border);background:none;color:var(--muted);font-family:'Syne',sans-serif;font-size:0.8rem;font-weight:600;cursor:pointer;margin-bottom:7px;}
.btn-cancel{width:100%;padding:12px;border-radius:12px;border:none;background:var(--surface2);color:var(--muted);font-family:'Syne',sans-serif;font-size:0.8rem;font-weight:600;cursor:pointer;}

/* ── MODAL AJOUT PERSONNE ── */
.modal-add-form{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.modal-add-form input{flex:1;min-width:120px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Syne',sans-serif;font-size:0.88rem;font-weight:600;outline:none;}
.modal-add-form input::placeholder{color:var(--muted);}
.modal-add-form input:focus{border-color:var(--accent);}
.modal-add-form button{padding:10px 18px;border-radius:12px;border:none;background:var(--accent);color:#000;font-family:'Syne',sans-serif;font-size:0.82rem;font-weight:700;cursor:pointer;}
.color-picker-row{display:flex;gap:8px;margin-bottom:14px;align-items:center;}
.color-swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .15s;}
.color-swatch.sel{border-color:#fff;transform:scale(1.15);}

.loader{display:flex;align-items:center;justify-content:center;height:90px;color:var(--muted);font-size:0.8rem;gap:8px;}
.spinner{width:15px;height:15px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
.empty{text-align:center;padding:32px 16px;color:var(--muted);font-size:0.8rem;}

@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{to{opacity:.3;}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:none;}}
@keyframes fadeUp  {from{opacity:0;transform:translateY(12px); }to{opacity:1;transform:none;}}
@keyframes slideUp {from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
</style>
</head>
<body>

<!-- PAGE ACCUEIL -->
<div class="page active" id="page-accueil">
  <div class="accueil-logo-wrap"><img class="accueil-logo" id="accueilLogo" src="" alt="AFR Élevage"></div>
  <h2 class="accueil-title">Contrôles du Soir</h2>
  <p class="accueil-sub">Planning astreinte — AFR 40 Landes</p>
  <p class="accueil-prompt">Qui êtes-vous ?</p>
  <div class="accueil-grid" id="accueilGrid"></div>
</div>

<!-- PAGE APP -->
<div class="page" id="page-app">
  <header>
    <img class="header-logo" id="headerLogo" src="" alt="AFR Élevage">
    <div class="header-titles">
      <h1>Contrôles du Soir</h1>
      <p>Planning astreinte — AFR 40</p>
    </div>
    <div class="header-right">
      <div class="user-chip">
        <div class="user-dot" id="userDot"></div>
        <span id="userName">—</span>
      </div>
      <button class="btn-logout" onclick="logout()" title="Changer d'utilisateur">⇠</button>
      <div class="sync-dot" id="syncDot"></div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tab-planning"   onclick="switchTab('planning')">Planning</button>
    <button class="tab-btn"        id="tab-recap"      onclick="switchTab('recap')">Récap</button>
    <button class="tab-btn"        id="tab-historique" onclick="switchTab('historique')">Historique</button>
  </div>

  <main>
    <div class="view active" id="view-planning">
      <div id="planningContainer"><div class="loader"><div class="spinner"></div> Chargement…</div></div>
    </div>
    <div class="view" id="view-recap">
      <div id="recapContainer"><div class="loader"><div class="spinner"></div> Chargement…</div></div>
    </div>
    <div class="view" id="view-historique">
      <div class="histo-filter" id="histoFilter"></div>
      <div id="histoContainer"><div class="loader"><div class="spinner"></div> Chargement…</div></div>
    </div>
  </main>
</div>

<!-- MODAL ATTRIBUTION -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalBg(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-sub">Qui fait le contrôle ce soir ?</div>
    <div class="modal-cur" id="modalCur"></div>
    <div class="person-buttons" id="personButtons"></div>
    <button class="btn-clear" onclick="assign(null)">✕ Effacer l'attribution</button>
    <button class="btn-cancel" onclick="closeModal()">Annuler</button>
  </div>
</div>

<!-- MODAL AJOUT PERSONNE -->
<div class="modal-overlay" id="addPersonOverlay" onclick="closeAddPersonBg(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Ajouter une personne</div>
    <div class="modal-sub" style="margin-bottom:14px">Saisir le prénom et choisir une couleur</div>
    <div class="modal-add-form">
      <input type="text" id="newPersonName" placeholder="Prénom…" maxlength="20" autocomplete="off">
      <button onclick="confirmAddPerson()">Ajouter</button>
    </div>
    <div class="color-picker-row" id="colorPickerRow"></div>
    <button class="btn-cancel" onclick="closeAddPerson()">Annuler</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, push, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ── CONFIG Firebase ──
const FB = {
  apiKey:            "AIzaSyCSw10bFLStcem4A_CO4IXmKeQbLH9NXsM",
  authDomain:        "afr-nt2.firebaseapp.com",
  databaseURL:       "https://afr-nt2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "afr-nt2",
  storageBucket:     "afr-nt2.firebasestorage.app",
  messagingSenderId: "169851474976",
  appId:             "1:169851474976:web:be14c24366b0af024f9845",
  measurementId:     "G-HYBY42TVJZ"
};

const db = getDatabase(initializeApp(FB));

// ── Chemin Firebase spécifique Landes ──
const FB_PLAN_PATH = 'astreinte_soir_40';
const FB_LOG_PATH  = 'astreinte_soir_40_log';
const FB_PERSONS_PATH = 'astreinte_soir_40_persons';

// ── Couleurs disponibles pour les personnes ──
const AVAILABLE_COLORS = [
  { hex:'#4a9eff', emoji:'🔵' },
  { hex:'#a855f7', emoji:'🟣' },
  { hex:'#22c55e', emoji:'🟢' },
  { hex:'#f43f5e', emoji:'🔴' },
  { hex:'#f59e0b', emoji:'🟡' },
  { hex:'#06b6d4', emoji:'🩵' },
  { hex:'#ec4899', emoji:'🩷' },
  { hex:'#84cc16', emoji:'🟩' },
];

// ── Personnes par défaut ──
const DEFAULT_PERSONS = [
  { id:'christophe', name:'Christophe', hex:'#4a9eff', emoji:'🔵' },
  { id:'laura',      name:'Laura',      hex:'#a855f7', emoji:'🟣' },
  { id:'jeremy',     name:'Jérémy',     hex:'#22c55e', emoji:'🟢' },
];

let PERSONS = [...DEFAULT_PERSONS];

const MONTHS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const DAYS_S = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const DAYS_F = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];

let planData={}, logData={}, currentUser=null, selectedKey=null, histoFilter='tous';
let selectedAddColor = null;

const syncDot = document.getElementById('syncDot');
const getPerson = id => PERSONS.find(p=>p.id===id);
const dk = d => {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
};

const today0 = () => { const t=new Date(); t.setHours(0,0,0,0); return t; };
const fmtFull = d => `${DAYS_F[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;

document.getElementById('headerLogo').src  = LOGO_B64;

// ── Charger les personnes depuis Firebase ──
function loadPersons(){
  onValue(ref(db, FB_PERSONS_PATH), snap => {
    const data = snap.val();
    if(data && Array.isArray(data) && data.length > 0){
      PERSONS = data;
    } else {
      PERSONS = [...DEFAULT_PERSONS];
    }
    // Mettre à jour CSS dynamique pour les filtres historique
    updateDynamicCSS();
    buildAccueilGrid();
    renderPlanning(); renderRecap(); buildHistoFilter(); renderHistorique();
  });
}

function updateDynamicCSS(){
  let existing = document.getElementById('dynamic-person-css');
  if(existing) existing.remove();
  const style = document.createElement('style');
  style.id = 'dynamic-person-css';
  let css = '';
  PERSONS.forEach(p => {
    css += `.histo-filter-btn.active.f-${p.id}{color:${p.hex};border-color:${p.hex};}`;
  });
  style.textContent = css;
  document.head.appendChild(style);
}

function savePersons(){
  set(ref(db, FB_PERSONS_PATH), PERSONS);
}

// ── Firebase listeners ──
loadPersons();
onValue(ref(db, FB_PLAN_PATH), snap=>{
  planData=snap.val()||{};
  renderPlanning(); renderRecap();
  syncDot.className='sync-dot';
}, ()=>{ syncDot.className='sync-dot error'; });

onValue(ref(db, FB_LOG_PATH), snap=>{
  logData=snap.val()||{};
  renderHistorique();
});

// ── Accueil ──
function buildAccueilGrid(){
  const grid = document.getElementById('accueilGrid');
  grid.innerHTML = '';
  PERSONS.forEach((p, i)=>{
    const btn=document.createElement('button');
    btn.className='accueil-btn';
    btn.style.animationDelay = (0.25 + i*0.06)+'s';
    btn.innerHTML=`<div class="accueil-avatar" style="background:${p.hex}22">${p.emoji}</div>${p.name}`;
    btn.onclick=()=>login(p.id);
    grid.appendChild(btn);
  });
  // Bouton ajouter
  const addBtn = document.createElement('button');
  addBtn.className='accueil-btn-add';
  addBtn.innerHTML='<span style="font-size:1.4rem">＋</span>Ajouter une personne';
  addBtn.onclick=()=>openAddPerson();
  grid.appendChild(addBtn);
}

// ── Ajout personne ──
window.openAddPerson=function(){
  document.getElementById('newPersonName').value='';
  selectedAddColor = null;
  renderColorPicker();
  document.getElementById('addPersonOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('newPersonName').focus(), 250);
};

window.closeAddPerson=function(){
  document.getElementById('addPersonOverlay').classList.remove('open');
};

window.closeAddPersonBg=function(e){
  if(e.target.id==='addPersonOverlay') closeAddPerson();
};

function renderColorPicker(){
  const usedHex = PERSONS.map(p=>p.hex);
  const available = AVAILABLE_COLORS.filter(c=>!usedHex.includes(c.hex));
  const row = document.getElementById('colorPickerRow');
  if(available.length === 0){
    row.innerHTML='<span style="color:var(--muted);font-size:0.75rem">Toutes les couleurs sont utilisées</span>';
    return;
  }
  if(!selectedAddColor) selectedAddColor = available[0];
  row.innerHTML = available.map(c =>
    `<div class="color-swatch ${c.hex===selectedAddColor.hex?'sel':''}" style="background:${c.hex}" onclick="selectAddColor('${c.hex}')"></div>`
  ).join('');
}

window.selectAddColor=function(hex){
  selectedAddColor = AVAILABLE_COLORS.find(c=>c.hex===hex);
  renderColorPicker();
};

window.confirmAddPerson=function(){
  const name = document.getElementById('newPersonName').value.trim();
  if(!name){alert('Veuillez saisir un prénom.');return;}
  if(!selectedAddColor){alert('Aucune couleur disponible.');return;}
  const id = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
  if(PERSONS.find(p=>p.id===id)){alert('Cette personne existe déjà.');return;}

  PERSONS.push({ id, name, hex: selectedAddColor.hex, emoji: selectedAddColor.emoji });
  savePersons();
  closeAddPerson();
};

window.login=function(pid){
  currentUser=getPerson(pid);
  if(!currentUser) return;
  document.getElementById('userName').textContent=currentUser.name;
  document.getElementById('userDot').style.background=currentUser.hex;
  document.getElementById('page-accueil').classList.remove('active');
  document.getElementById('page-app').classList.add('active');
  renderPlanning(); renderRecap(); buildHistoFilter(); renderHistorique();
};

window.logout=function(){
  currentUser=null;
  document.getElementById('page-app').classList.remove('active');
  document.getElementById('page-accueil').classList.add('active');
  switchTab('planning');
};

// ── Tabs ──
window.switchTab=function(tab){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
};

// ═════════════════════════════════════════
//  PLANNING
// ═════════════════════════════════════════
function renderPlanning(){
  const today=today0();
  const days=[];
  for(let i=-3;i<48;i++){
    const d=new Date(today); d.setDate(today.getDate()+i); days.push(d);
  }

  const weeks={};
  days.forEach(d=>{
    const m=monday(d); const wk=dk(m);
    if(!weeks[wk]) weeks[wk]={mon:m,days:[]};
    weeks[wk].days.push(d);
  });

  let html='';
  Object.values(weeks).forEach(w=>{
    html+=`<div class="week-block"><div class="week-label">${weekLbl(w.mon,today)}</div>`;
    w.days.forEach(d=>{
      const key=dk(d), pid=planData[key]||null, p=pid?getPerson(pid):null;
      const past=d<today, isToday=d.getTime()===today.getTime();
      html+=`
        <div class="day-card ${past&&!isToday?'past':''} ${isToday?'today':''}"
             ${(!past||isToday)?`onclick="openModal('${key}')"`:''} 
             style="${p?`border-color:${p.hex}33`:''}">
          <div class="color-bar" style="${p?`background:${p.hex}`:''}"></div>
          <div class="day-date">
            <div class="num">${d.getDate()}</div>
            <div class="dow">${DAYS_S[d.getDay()]}</div>
          </div>
          <div class="day-divider"></div>
          <div class="day-info">
            ${p?`<div class="day-assignee" style="color:${p.hex}">${p.emoji} ${p.name}</div>`
               :`<div class="day-unassigned">Non attribué</div>`}
            <div class="day-meta">${MONTHS[d.getMonth()]} ${d.getFullYear()}
              ${isToday?'· <span class="today-badge">Aujourd\'hui</span>':''}
            </div>
          </div>
          <div class="day-arrow">${(!past||isToday)?'›':''}</div>
        </div>`;
    });
    html+='</div>';
  });

  document.getElementById('planningContainer').innerHTML=html;
}

function weekLbl(mon,today){
  const d=Math.round((monday(today)-mon)/86400000);
  if(d===0) return 'Cette semaine';
  if(d===-7) return 'Semaine prochaine';
  if(d>0&&d<=7) return 'Semaine dernière';
  const fri=new Date(mon); fri.setDate(mon.getDate()+4);
  return `Sem. du ${mon.getDate()} ${MONTHS[mon.getMonth()]}`;
}

// ═════════════════════════════════════════
//  RÉCAP
// ═════════════════════════════════════════
function renderRecap(){
  const today=today0();
  const mon0=monday(today);
  const mon1=new Date(mon0); mon1.setDate(mon0.getDate()+7);

  const week=(m)=>{const w=[];for(let i=0;i<7;i++){const d=new Date(m);d.setDate(m.getDate()+i);w.push(d);}return w;};

  const rowsHtml=(days)=>days.map(d=>{
    const key=dk(d), pid=planData[key]||null, p=pid?getPerson(pid):null;
    const isToday=d.getTime()===today.getTime();
    return `<div class="recap-row" style="${p?`border-color:${p.hex}33`:''}">
      <div class="recap-dot" style="background:${p?p.hex:'var(--border)'}"></div>
      <div class="recap-date">${DAYS_F[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}
        ${isToday?'<span class="today-badge" style="margin-left:5px">Auj.</span>':''}</div>
      ${p?`<div class="recap-name" style="color:${p.hex}">${p.name}</div>`
         :`<div class="recap-empty">—</div>`}
    </div>`;
  }).join('');

  const counts={},future={};
  PERSONS.forEach(p=>{counts[p.id]=0;future[p.id]=0;});
  Object.entries(planData).forEach(([k,pid])=>{
    if(!pid||!PERSONS.find(p=>p.id===pid)) return;
    counts[pid]++;
    if(new Date(k+'T00:00:00')>=today) future[pid]++;
  });

  const allFut=Object.entries(planData)
    .filter(([k,v])=>v&&new Date(k+'T00:00:00')>=today)
    .sort(([a],[b])=>a.localeCompare(b));

  const statsHtml=PERSONS.map(p=>{
    const nxt=allFut.find(([,v])=>v===p.id);
    const nxtLbl=nxt?fmtFull(new Date(nxt[0]+'T00:00:00')):'Aucune prévue';
    return `<div class="stat-card" style="border-color:${p.hex}33">
      <div class="stat-name" style="color:${p.hex}">${p.emoji} ${p.name}</div>
      <div class="stat-count" style="color:${p.hex}">${future[p.id]}</div>
      <div class="stat-label">à venir · ${counts[p.id]} au total</div>
      <div class="stat-next">Prochaine :<br><strong>${nxtLbl}</strong></div>
    </div>`;
  }).join('');

  const fri0=new Date(mon0);fri0.setDate(mon0.getDate()+6);
  const fri1=new Date(mon1);fri1.setDate(mon1.getDate()+6);

  document.getElementById('recapContainer').innerHTML=`
    <div class="recap-week-title">📅 Cette semaine · ${mon0.getDate()} → ${fri0.getDate()} ${MONTHS[fri0.getMonth()]}</div>
    ${rowsHtml(week(mon0))}
    <div class="recap-week-title">📅 Semaine prochaine · ${mon1.getDate()} → ${fri1.getDate()} ${MONTHS[fri1.getMonth()]}</div>
    ${rowsHtml(week(mon1))}
    <p class="section-title">Compteurs individuels</p>
    <div class="stats-grid">${statsHtml}</div>`;
}

// ═════════════════════════════════════════
//  HISTORIQUE
// ═════════════════════════════════════════
function buildHistoFilter(){
  const filters=[{id:'tous',name:'Tous',cls:''},...PERSONS.map(p=>({id:p.id,name:p.name,cls:'f-'+p.id}))];
  document.getElementById('histoFilter').innerHTML=filters.map(f=>`
    <button class="histo-filter-btn ${f.id===histoFilter?'active '+f.cls:''}" onclick="setHistoFilter('${f.id}')">${f.name}</button>`).join('');
}

window.setHistoFilter=function(id){
  histoFilter=id; buildHistoFilter(); renderHistorique();
};

function renderHistorique(){
  const entries=Object.values(logData).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const filtered=histoFilter==='tous'?entries:entries.filter(e=>e.actor===histoFilter);

  if(!filtered.length){
    document.getElementById('histoContainer').innerHTML='<div class="empty">Aucune modification enregistrée pour l\'instant</div>';
    return;
  }

  const fmtTs=ts=>{
    if(!ts) return '–';
    const d=new Date(ts);
    return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()} à ${String(d.getHours()).padStart(2,'0')}h${String(d.getMinutes()).padStart(2,'0')}`;
  };

  document.getElementById('histoContainer').innerHTML=filtered.map(e=>{
    const actor=getPerson(e.actor), fromP=e.from?getPerson(e.from):null, toP=e.to?getPerson(e.to):null;
    const targetD=new Date(e.dateKey+'T00:00:00');
    let change='';
    if(e.from&&e.to)
      change=`<div class="histo-change">
        <span class="histo-from" style="color:${fromP?.hex||'#888'}">${fromP?.name||'?'}</span>
        <span>→</span>
        <span style="color:${toP?.hex||'#888'};font-weight:600">${toP?.name||'?'}</span></div>`;
    else if(!e.from&&e.to)
      change=`<div class="histo-change"><span style="color:${toP?.hex}">+ Attribué : ${toP?.name}</span></div>`;
    else if(e.from&&!e.to)
      change=`<div class="histo-change"><span style="color:var(--muted)">✕ Effacé (était ${fromP?.name||'?'})</span></div>`;

    return `<div class="histo-entry">
      <div class="histo-dot" style="background:${actor?.hex||'var(--muted)'}"></div>
      <div class="histo-body">
        <div class="histo-action">
          <span class="histo-actor" style="color:${actor?.hex||'var(--text)'}">${actor?.name||'?'}</span>
          a modifié le <span class="histo-target">${fmtFull(targetD)}</span>
        </div>
        ${change}
        <div class="histo-time">${fmtTs(e.ts)}</div>
      </div>
    </div>`;
  }).join('');
}

// ═════════════════════════════════════════
//  MODAL
// ═════════════════════════════════════════
window.openModal=function(key){
  selectedKey=key;
  const d=new Date(key+'T00:00:00');
  const cur=planData[key]||null, cp=cur?getPerson(cur):null;
  document.getElementById('modalTitle').textContent=fmtFull(d);
  document.getElementById('modalCur').innerHTML=cp
    ?`Actuellement : <span style="color:${cp.hex}">${cp.emoji} ${cp.name}</span>`
    :`Actuellement : <span>Non attribué</span>`;
  document.getElementById('personButtons').innerHTML=PERSONS.map(p=>`
    <button class="person-btn ${cur===p.id?'sel':''}" style="color:${p.hex}" onclick="assign('${p.id}')">
      <span class="pdot"></span>${p.name}
    </button>`).join('');
  document.getElementById('modalOverlay').classList.add('open');
};

window.assign=function(newPid){
  if(!selectedKey||!currentUser) return;
  const prev=planData[selectedKey]||null;
  if(newPid===prev){ closeModal(); return; }

  planData[selectedKey]=newPid||null;
  syncDot.className='sync-dot syncing';
  set(ref(db,`${FB_PLAN_PATH}/${selectedKey}`),newPid||null)
    .then(()=>syncDot.className='sync-dot')
    .catch(()=>syncDot.className='sync-dot error');

  push(ref(db, FB_LOG_PATH),{
    ts: Date.now(), actor: currentUser.id,
    dateKey: selectedKey, from: prev||null, to: newPid||null
  });

  renderPlanning(); renderRecap(); renderHistorique();
  closeModal();
};

window.closeModal=function(){ document.getElementById('modalOverlay').classList.remove('open'); selectedKey=null; };
window.closeModalBg=function(e){ if(e.target.id==='modalOverlay') closeModal(); };

</script>
