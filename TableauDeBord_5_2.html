<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AFR Dashboard">
<title>Tour de Contrôle — AFR Élevage</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0B1120;
    --bg2: #111827;
    --surface: #1F2937;
    --surface2: #374151;
    --border: #4B5563;
    --text: #F9FAFB;
    --text2: #9CA3AF;
    --text3: #6B7280;
    --green: #10B981;
    --green-bg: rgba(16,185,129,0.12);
    --red: #EF4444;
    --red-bg: rgba(239,68,68,0.12);
    --orange: #F59E0B;
    --orange-bg: rgba(245,158,11,0.12);
    --blue: #3B82F6;
    --blue-bg: rgba(59,130,246,0.12);
    --purple: #8B5CF6;
    --purple-bg: rgba(139,92,246,0.12);
    --cyan: #06B6D4;
    --cyan-bg: rgba(6,182,212,0.12);
    --radius: 16px;
    --radius-sm: 10px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100svh;
    -webkit-font-smoothing: antialiased;
  }

  .header {
    background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: calc(var(--safe-top) + 20px) 20px 20px;
    text-align: center;
    position: relative;
  }

  .header-logo {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 6px;
  }

  .header-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #F9FAFB 0%, #60A5FA 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .header-date {
    font-size: 13px;
    color: var(--text2);
    margin-top: 6px;
    font-weight: 400;
  }

  .sync-status {
    position: absolute;
    top: calc(var(--safe-top) + 16px);
    right: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text3);
    background: var(--surface);
    padding: 4px 10px;
    border-radius: 20px;
  }

  .sync-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s ease infinite;
  }

  .sync-dot.error { background: var(--red); animation: none; }
  .sync-dot.loading { background: var(--orange); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .refresh-btn {
    position: absolute;
    top: calc(var(--safe-top) + 16px);
    left: 16px;
    background: var(--surface);
    border: none;
    color: var(--text2);
    width: 34px; height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s;
  }
  .refresh-btn:active { transform: rotate(180deg); }

  .main {
    padding: 16px;
    max-width: 900px;
    margin: 0 auto;
    padding-bottom: calc(var(--safe-bottom) + 40px);
  }

  /* SECTION */
  .section {
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 12px;
    padding-left: 4px;
  }

  /* CARTES */
  .card-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .card-grid.single { grid-template-columns: 1fr; }
  .card-grid.triple { grid-template-columns: 1fr 1fr 1fr; }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    border: 1px solid rgba(255,255,255,0.04);
    position: relative;
    overflow: hidden;
    transition: transform 0.15s;
  }

  .card:active { transform: scale(0.98); }

  .card-icon {
    font-size: 22px;
    margin-bottom: 8px;
  }

  .card-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text2);
    letter-spacing: 0.3px;
    margin-bottom: 4px;
  }

  .card-value {
    font-size: 28px;
    font-weight: 700;
    font-family: 'DM Mono', monospace;
    letter-spacing: -1px;
    line-height: 1;
  }

  .card-sub {
    font-size: 11px;
    color: var(--text3);
    margin-top: 6px;
  }

  .card-status {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 10px; height: 10px;
    border-radius: 50%;
  }

  .card-status.ok { background: var(--green); box-shadow: 0 0 8px rgba(16,185,129,0.4); }
  .card-status.warn { background: var(--orange); box-shadow: 0 0 8px rgba(245,158,11,0.4); }
  .card-status.error { background: var(--red); box-shadow: 0 0 8px rgba(239,68,68,0.4); }
  .card-status.na { background: var(--text3); }

  .value-green { color: var(--green); }
  .value-red { color: var(--red); }
  .value-orange { color: var(--orange); }
  .value-blue { color: var(--blue); }
  .value-purple { color: var(--purple); }
  .value-cyan { color: var(--cyan); }

  /* LISTE D'ALERTES */
  .alert-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .alert-item {
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-left: 3px solid var(--text3);
  }

  .alert-item.critical { border-left-color: var(--red); background: var(--red-bg); }
  .alert-item.warning { border-left-color: var(--orange); background: var(--orange-bg); }
  .alert-item.info { border-left-color: var(--blue); background: var(--blue-bg); }
  .alert-item.success { border-left-color: var(--green); background: var(--green-bg); }

  .alert-icon { font-size: 18px; flex-shrink: 0; }
  .alert-text { font-size: 13px; color: var(--text); line-height: 1.4; }
  .alert-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* FERME ROW */
  .farm-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 8px;
  }

  .farm-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  .farm-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
  }

  .farm-badge.ok { background: var(--green-bg); color: var(--green); }
  .farm-badge.ko { background: var(--red-bg); color: var(--red); }
  .farm-badge.partial { background: var(--orange-bg); color: var(--orange); }
  .farm-badge.na { background: rgba(107,114,128,0.15); color: var(--text3); }

  .farm-detail {
    font-size: 11px;
    color: var(--text3);
    text-align: right;
  }

  .farm-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }

  /* ASTREINTE */
  .astreinte-card {
    background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    border: 1px solid rgba(99,102,241,0.2);
  }

  .astreinte-label {
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .astreinte-name {
    font-size: 24px;
    font-weight: 700;
    color: var(--purple);
  }

  .astreinte-date {
    font-size: 12px;
    color: var(--text3);
    margin-top: 4px;
  }

  /* LOADING */
  .loading-text {
    text-align: center;
    color: var(--text3);
    font-size: 13px;
    padding: 30px;
  }

  .loading-text::after {
    content: '';
    animation: dots 1.5s steps(3) infinite;
  }

  @keyframes dots {
    0% { content: '.'; }
    33% { content: '..'; }
    66% { content: '...'; }
  }

  /* RESPONSIVE */
  @media (max-width: 400px) {
    .card-grid { grid-template-columns: 1fr; }
    .card-grid.triple { grid-template-columns: 1fr 1fr; }
    .card-value { font-size: 24px; }
  }

  /* LAST UPDATE */
  .last-update {
    text-align: center;
    font-size: 11px;
    color: var(--text3);
    padding: 20px 0 10px;
  }
</style>
</head>

// ════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════
function setSync(state, label) {
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLabel');
  dot.className = 'sync-dot' + (state === 'error' ? ' error' : state === 'loading' ? ' loading' : '');
  lbl.textContent = label;
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function yesterdayStr() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDateFR(str) {
  if (!str) return '—';
  const p = str.split('-');
  return `${p[2]}/${p[1]}/${p[0]}`;
}

const JOURS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

function headerDateStr() {
  const d = new Date();
  return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}`;
}

async function fbGet(path) {
  if (!firebaseOK) return null;
  try {
    const snap = await db.ref(path).get();
    return snap.exists() ? snap.val() : null;
  } catch(e) { return null; }
}

// ════════════════════════════════════════════════════
//  SEMENCE NT2
// ════════════════════════════════════════════════════
const ALLEES_NT2 = ['A','B','C','D','E'];
const NB_CAGES_NT2 = 30;
const FEMELLES_NT2 = new Set([1,10,20,30]);

async function loadSemenceNT2(date) {
  const videsData = {};
  for (const al of ALLEES_NT2) {
    const v = await fbGet(`cagesVides/${al}`);
    videsData[al] = v ? (Array.isArray(v) ? v : Object.values(v)) : [];
  }
  const NB_MALES_NT2 = NB_CAGES_NT2 - FEMELLES_NT2.size;

  let totalDon = 0, totalNdon = 0, totalActifs = 0, tubes = 0, tubesCount = 0;
  const preleveurs = {};

  for (const al of ALLEES_NT2) {
    const data = await fbGet(`semence/${date}/${al}`);
    const tb = await fbGet(`tubes/${date}/${al}`);
    const opData = await fbGet(`operateurs/${date}/${al}`);
    const opPrinc = await fbGet(`operateurPrincipal/${date}/${al}`);

    if (data) {
      let nbVide = 0;
      for (let i = 1; i <= NB_CAGES_NT2; i++) {
        if (FEMELLES_NT2.has(i)) continue;
        if (videsData[al] && videsData[al].includes(i)) { nbVide++; continue; }
        const v = data[i] || 0;
        if (v === 1 || v === 2) totalDon++;
        else if (v === 3) totalNdon++;
      }
      totalActifs += (NB_MALES_NT2 - nbVide);
    }

    if (typeof tb === 'number' && !isNaN(tb)) { tubes += tb; tubesCount++; }

    // Préleveur principal
    const opCounts = {};
    if (opData) Object.values(opData).forEach(op => { if (op) opCounts[op] = (opCounts[op]||0) + 1; });
    const entries = Object.entries(opCounts);
    const prev = entries.length ? entries.sort((a,b) => b[1]-a[1])[0][0] : (opPrinc || '');
    if (prev) preleveurs[prev] = (preleveurs[prev] || 0) + 1;
  }

  const ev = totalDon + totalNdon;
  const pctDon = ev > 0 ? Math.round(totalDon / ev * 100) : null;
  const taux = totalActifs > 0 ? Math.round(ev / totalActifs * 100) : null;
  const prevPrincipal = Object.entries(preleveurs).sort((a,b) => b[1]-a[1])[0]?.[0] || '—';
  const hasData = ev > 0;

  return { totalDon, totalNdon, pctDon, taux, tubes: tubesCount > 0 ? tubes : null, prevPrincipal, hasData, totalActifs };
}

function renderSemence(nt2, sg) {
  const container = document.getElementById('semenceCards');
  let html = '';

  // NT2
  const pctClass = (p) => p === null ? 'value-blue' : p >= 70 ? 'value-green' : p >= 40 ? 'value-orange' : 'value-red';
  const statusClass = (p) => p === null ? 'na' : p >= 70 ? 'ok' : p >= 40 ? 'warn' : 'error';

  html += `
    <div class="card">
      <div class="card-status ${nt2.hasData ? statusClass(nt2.pctDon) : 'na'}"></div>
      <div class="card-icon">🦆</div>
      <div class="card-label">NT2 — % Don</div>
      <div class="card-value ${pctClass(nt2.pctDon)}">${nt2.hasData ? nt2.pctDon+'%' : '—'}</div>
      <div class="card-sub">${nt2.hasData ? nt2.totalDon+'✓ / '+nt2.totalNdon+'✗ · '+nt2.prevPrincipal : 'Pas de données aujourd\'hui'}</div>
    </div>
    <div class="card">
      <div class="card-status ${sg.hasData ? statusClass(sg.pctDon) : 'na'}"></div>
      <div class="card-icon">🦆</div>
      <div class="card-label">SG — % Don</div>
      <div class="card-value ${pctClass(sg.pctDon)}">${sg.hasData ? sg.pctDon+'%' : '—'}</div>
      <div class="card-sub">${sg.hasData ? sg.totalDon+'✓ / '+sg.totalNdon+'✗ · '+sg.prevPrincipal : 'Pas de données aujourd\'hui'}</div>
    </div>
  `;

  // Taux utilisation + Tubes
  html += `
    <div class="card">
      <div class="card-icon">📊</div>
      <div class="card-label">Taux utilisation NT2</div>
      <div class="card-value ${pctClass(nt2.taux)}">${nt2.taux !== null ? nt2.taux+'%' : '—'}</div>
      <div class="card-sub">Objectif : 75%</div>
    </div>
    <div class="card">
      <div class="card-icon">📊</div>
      <div class="card-label">Taux utilisation SG</div>
      <div class="card-value ${pctClass(sg.taux)}">${sg.taux !== null ? sg.taux+'%' : '—'}</div>
      <div class="card-sub">Objectif : 75%</div>
    </div>
  `;

  html += `
    <div class="card">
      <div class="card-icon">🧪</div>
      <div class="card-label">Tubes NT2</div>
      <div class="card-value value-cyan">${nt2.tubes !== null ? nt2.tubes.toFixed(1) : '—'}</div>
    </div>
    <div class="card">
      <div class="card-icon">🧪</div>
      <div class="card-label">Tubes SG</div>
      <div class="card-value value-cyan">${sg.tubes !== null ? sg.tubes.toFixed(1) : '—'}</div>
    </div>
  `;

  container.innerHTML = html;
}

// ════════════════════════════════════════════════════
//  CONTRÔLES DU SOIR (Firestore)
// ════════════════════════════════════════════════════
// Contrôles AFR → Firestore collection "controles_afr33", doc = date (YYYY-MM-DD)
//   Chaque doc contient des clés par bâtiment : { NT1: {...}, NT2: {...}, ... }
// Contrôles SG  → Firestore collection "controles", doc = date
//   Chaque doc contient des clés par bâtiment : { SG1: {...}, SG2: {...}, SG3: {...} }

const FERMES_CONTROLES = {
  'AFR 33': {
    collection: 'controles_afr33',
    bats: ['NT1','NT2','NV1','NV2'],
    label: 'AFR 33 — NT / NV'
  },
  'AFR 40': {
    collection: 'controles',
    bats: ['SG1','SG2','SG3'],
    label: 'AFR 40 — SG'
  }
};

async function loadControles(date) {
  if (!fs) return {};
  const results = {};

  for (const [groupKey, group] of Object.entries(FERMES_CONTROLES)) {
    try {
      const doc = await fs.collection(group.collection).doc(date).get();
      const data = doc.exists ? doc.data() : null;

      group.bats.forEach(bat => {
        const batData = data ? (data[bat] || null) : null;
        if (!batData) {
          results[bat] = { done: false, group: groupKey };
        } else {
          let hasProblem = false;
          const problemDetails = [];

          // controles[] = template des items (name, etat = libellé, type)
          // formData[] = résultats réels (status: "ok"|"problem", value, note)
          // Un problème = formData[idx].status === "problem"
          const ctrlTemplate = batData.controles || [];
          const ctrlArr = Array.isArray(ctrlTemplate) ? ctrlTemplate : Object.values(ctrlTemplate);

          if (batData.formData && typeof batData.formData === 'object') {
            const fdEntries = Array.isArray(batData.formData)
              ? batData.formData.map((v, i) => [i, v])
              : Object.entries(batData.formData).map(([k, v]) => [parseInt(k), v]);

            fdEntries.forEach(([idx, fd]) => {
              if (fd && fd.status && fd.status !== 'ok') {
                hasProblem = true;
                // Récupérer le nom du contrôle depuis le template
                const template = ctrlArr[idx];
                const itemName = template ? template.name : '';
                const detail = fd.note && fd.note.trim() ? fd.note.trim() : '';
                const val = fd.value && fd.value.trim() ? fd.value.trim() : '';
                
                let desc = itemName;
                if (val) desc += ` : ${val}`;
                if (detail) desc += ` (${detail})`;
                if (desc) problemDetails.push(desc);
              }
            });
          }

          // Vérifier commentaire global du bâtiment
          const comm = batData.commentaire || '';
          if (comm && comm.trim().length > 0) {
            hasProblem = true;
            problemDetails.push(comm.trim());
          }

          const commentaire = problemDetails.length ? [...new Set(problemDetails)].join(' · ') : '';

          results[bat] = {
            done: true,
            group: groupKey,
            heure: batData.heure || '',
            op: batData.op || batData.operateur || '',
            commentaire,
            hasProblem
          };
        }
      });
    } catch(e) {
      console.warn('Erreur Firestore contrôles', groupKey, e);
      group.bats.forEach(bat => {
        results[bat] = { done: false, group: groupKey, error: true };
      });
    }
  }
  return results;
}

function renderControles(data, date, label) {
  const container = document.getElementById('controlesSection');
  const titleEl = document.getElementById('controlesSectionTitle');
  if (titleEl) titleEl.textContent = `🌙 Contrôles du Soir — ${label || 'Hier'}`;
  let html = '';

  for (const [groupKey, group] of Object.entries(FERMES_CONTROLES)) {
    // Compter les bâtiments faits / non faits pour ce groupe
    const bats = group.bats;
    const done = bats.filter(b => data[b] && data[b].done);
    const notDone = bats.filter(b => !data[b] || !data[b].done);
    const hasAnyProblem = done.some(b => data[b].hasProblem);

    let badge, badgeClass;
    if (done.length === bats.length) {
      if (hasAnyProblem) {
        badge = '⚠ Anomalie'; badgeClass = 'ko';
      } else {
        badge = '✓ Tous faits'; badgeClass = 'ok';
      }
    } else if (done.length === 0) {
      badge = 'Aucun fait'; badgeClass = 'ko';
    } else {
      badge = `${done.length}/${bats.length} faits`; badgeClass = 'partial';
    }

    const operateurs = [...new Set(done.map(b => data[b].op).filter(Boolean))];
    const opTxt = operateurs.length ? operateurs.join(', ') : '';

    html += `
      <div class="farm-row">
        <div>
          <div class="farm-name">${group.label}</div>
          <div style="font-size:11px;color:var(--text3)">${opTxt ? opTxt + ' · ' : ''}${formatDateFR(date)}</div>
        </div>
        <div class="farm-right">
          <span class="farm-badge ${badgeClass}">${badge}</span>
          ${notDone.length > 0 && done.length > 0 ? `<div class="farm-detail">Manque : ${notDone.join(', ')}</div>` : ''}
        </div>
      </div>`;

    // Afficher les bâtiments avec anomalie
    done.filter(b => data[b].hasProblem).forEach(b => {
      html += `
        <div class="alert-item warning" style="margin-left:12px;margin-bottom:4px">
          <div class="alert-icon">⚠️</div>
          <div>
            <div class="alert-text">${b} — ${data[b].commentaire || 'Anomalie signalée'}</div>
            <div class="alert-sub">${data[b].heure || ''}</div>
          </div>
        </div>`;
    });
  }

  container.innerHTML = html || '<div class="loading-text">Aucune donnée</div>';
}

// ════════════════════════════════════════════════════
//  STOCKS
// ════════════════════════════════════════════════════
async function loadStocks() {
  const data = await fbGet('stocks/produits');
  if (!data) return [];
  const alerts = [];
  Object.entries(data).forEach(([id, prod]) => {
    if (prod && prod.seuilMini !== undefined && prod.stockActuel !== undefined) {
      if (prod.stockActuel <= prod.seuilMini) {
        alerts.push({
          nom: prod.nom || id,
          quantite: prod.stockActuel,
          seuil: prod.seuilMini,
          unite: prod.unite || '',
          categorie: prod.categorie || '',
          critical: prod.stockActuel === 0
        });
      }
    }
  });
  alerts.sort((a,b) => a.quantite - b.quantite);
  return alerts;
}

function renderStocks(alerts) {
  const container = document.getElementById('stocksSection');
  if (!alerts.length) {
    container.innerHTML = `
      <div class="alert-item success">
        <div class="alert-icon">✅</div>
        <div><div class="alert-text">Tous les stocks sont au-dessus des seuils</div></div>
      </div>`;
    return;
  }
  let html = '';
  alerts.forEach(a => {
    const cls = a.critical ? 'critical' : 'warning';
    const icon = a.critical ? '🔴' : '🟡';
    html += `
      <div class="alert-item ${cls}">
        <div class="alert-icon">${icon}</div>
        <div>
          <div class="alert-text">${a.nom}</div>
          <div class="alert-sub">Stock : ${a.quantite} ${a.unite} · Seuil mini : ${a.seuil} · ${a.categorie}</div>
        </div>
      </div>`;
  });
  container.innerHTML = html;
}

// ════════════════════════════════════════════════════
//  SIGNALEMENTS
// ════════════════════════════════════════════════════
async function loadSignalements() {
  const data = await fbGet('signalements');
  if (!data) return { total: 0, ouverts: [], recent: [] };
  const all = [];
  Object.entries(data).forEach(([id, sig]) => {
    if (sig && typeof sig === 'object') {
      all.push({ id, ...sig });
    }
  });
  const ouverts = all.filter(s => !s.resolu && !s.cloture);
  ouverts.sort((a,b) => (b.date || '').localeCompare(a.date || ''));
  return { total: all.length, ouverts, recent: ouverts.slice(0, 5) };
}

function renderSignalements(data) {
  const container = document.getElementById('signalementsSection');
  if (!data.ouverts.length) {
    container.innerHTML = `
      <div class="alert-item success">
        <div class="alert-icon">✅</div>
        <div><div class="alert-text">Aucun signalement ouvert</div></div>
      </div>`;
    return;
  }
  let html = `
    <div class="card-grid single" style="margin-bottom:10px">
      <div class="card">
        <div class="card-icon">🚨</div>
        <div class="card-label">Signalements ouverts</div>
        <div class="card-value value-red">${data.ouverts.length}</div>
      </div>
    </div>`;

  data.recent.forEach(s => {
    const ferme = s.ferme || s.farm || '?';
    const desc = s.description || s.titre || s.objet || 'Sans description';
    const date = s.date ? formatDateFR(s.date) : '—';
    html += `
      <div class="alert-item warning">
        <div class="alert-icon">⚠️</div>
        <div>
          <div class="alert-text">[${ferme}] ${desc.substring(0, 80)}</div>
          <div class="alert-sub">${date}</div>
        </div>
      </div>`;
  });
  if (data.ouverts.length > 5) {
    html += `<div style="text-align:center;font-size:12px;color:var(--text3);padding:8px">+ ${data.ouverts.length - 5} autres signalements</div>`;
  }
  container.innerHTML = html;
}

// ════════════════════════════════════════════════════
//  ASTREINTE SOIR (Realtime Database)
//  Structure : astreinte_soir/{YYYY-MM-DD} = personId (string)
//  Note : l'app utilise toISOString().slice(0,10) = date UTC
// ════════════════════════════════════════════════════
const ASTREINTE_PERSONS = {
  'julien':  'Julien',
  'clement': 'Clément',
  'romain':  'Romain',
  'emmy':    'Emmy'
};

function todayUTC() {
  return new Date().toISOString().slice(0, 10);
}

async function loadAstreinte() {
  const localDate = todayStr();
  const utcDate = todayUTC();

  // Lire toutes les entrées
  const data = await fbGet('astreinte_soir');
  if (!data || typeof data !== 'object') return { nom: null, date: null };

  // Filtrer les clés de log (astreinte_soir_log est un sous-chemin séparé)
  const allDates = Object.keys(data)
    .filter(k => k.match(/^\d{4}-\d{2}-\d{2}$/) && typeof data[k] === 'string')
    .sort();

  // 1. Chercher la date locale d'aujourd'hui
  if (data[localDate] && typeof data[localDate] === 'string') {
    return { nom: ASTREINTE_PERSONS[data[localDate]] || data[localDate], date: localDate };
  }

  // 2. Chercher la date UTC d'aujourd'hui (si différente)
  if (utcDate !== localDate && data[utcDate] && typeof data[utcDate] === 'string') {
    return { nom: ASTREINTE_PERSONS[data[utcDate]] || data[utcDate], date: utcDate };
  }

  // 3. Fallback : dernière date passée la plus récente
  const pastDates = allDates.filter(d => d <= localDate);
  if (pastDates.length > 0) {
    const lastDate = pastDates[pastDates.length - 1];
    const pid = data[lastDate];
    return { nom: ASTREINTE_PERSONS[pid] || pid, date: lastDate, isPast: true };
  }

  // 4. Fallback : prochaine date future
  const futureDates = allDates.filter(d => d > localDate);
  if (futureDates.length > 0) {
    const nextDate = futureDates[0];
    const pid = data[nextDate];
    return { nom: ASTREINTE_PERSONS[pid] || pid, date: nextDate, isFuture: true };
  }

  return { nom: null, date: null };
}

function renderAstreinte(data) {
  const container = document.getElementById('astreinteSection');
  if (!data.nom) {
    container.innerHTML = `
      <div class="astreinte-card">
        <div class="astreinte-label">Ce soir</div>
        <div class="astreinte-name" style="color:var(--text3)">Non défini</div>
        <div class="astreinte-date">${headerDateStr()}</div>
      </div>`;
    return;
  }
  const isToday = data.date === todayStr() || data.date === todayUTC();
  let subtitle = headerDateStr();
  let label = 'Astreinte ce soir';
  if (!isToday && data.isPast) { subtitle = `Dernière astreinte : ${formatDateFR(data.date)}`; label = 'Dernière astreinte connue'; }
  if (!isToday && data.isFuture) { subtitle = `Prochaine : ${formatDateFR(data.date)}`; label = 'Prochaine astreinte'; }

  container.innerHTML = `
    <div class="astreinte-card">
      <div class="astreinte-label">${label}</div>
      <div class="astreinte-name">${data.nom}</div>
      <div class="astreinte-date">${subtitle}</div>
    </div>`;
}



// ════════════════════════════════════════════════════
//  DÉRATISATION
// ════════════════════════════════════════════════════
async function loadDerat() {
  const data = await fbGet('deratisation/historique');
  if (!data) return [];

  const entries = Object.entries(data).map(([id, val]) => ({ id, ...val }));
  // Regrouper par bâtiment, garder le plus récent
  const byBat = {};
  entries.forEach(e => {
    const bat = e.batiment || e.building || '?';
    if (!byBat[bat] || (e.date && e.date > (byBat[bat].date || ''))) {
      byBat[bat] = e;
    }
  });
  return Object.entries(byBat).map(([bat, e]) => ({
    batiment: bat,
    date: e.date || '—',
    operateur: e.operateur || e.operator || '—',
    nc: e.nc || e.nonConforme || 0
  })).sort((a,b) => (b.date || '').localeCompare(a.date || ''));
}

function renderDerat(data) {
  const container = document.getElementById('deratSection');
  if (!data.length) {
    container.innerHTML = `
      <div class="alert-item info">
        <div class="alert-icon">ℹ️</div>
        <div><div class="alert-text">Aucun historique de dératisation trouvé</div></div>
      </div>`;
    return;
  }

  const today = new Date();
  today.setHours(0,0,0,0);

  // Trouver la prochaine échéance globale (le bâtiment dont la prochaine dératisation arrive le plus tôt)
  let nextGlobalDate = null;
  let nextGlobalBat = '';

  let html = '';
  data.slice(0, 8).forEach(d => {
    let overdue = false;
    let daysLeft = null;
    let nextDateStr = '—';
    if (d.date && d.date !== '—') {
      const parts = d.date.split('-');
      if (parts.length === 3) {
        const ctrlDate = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
        const nextDate = new Date(ctrlDate);
        nextDate.setDate(nextDate.getDate() + 30);
        const diff = Math.floor((today - ctrlDate) / (1000*60*60*24));
        overdue = diff > 30;
        daysLeft = Math.floor((nextDate - today) / (1000*60*60*24));
        nextDateStr = `${String(nextDate.getDate()).padStart(2,'0')}/${String(nextDate.getMonth()+1).padStart(2,'0')}/${nextDate.getFullYear()}`;

        // Suivre la prochaine échéance globale
        if (nextGlobalDate === null || nextDate < nextGlobalDate) {
          nextGlobalDate = nextDate;
          nextGlobalBat = d.batiment;
        }
      }
    }
    const badge = overdue ? 'ko' : 'ok';
    const badgeText = overdue ? '⏰ > 30j' : '✓ À jour';
    const prochainTxt = daysLeft !== null
      ? (daysLeft <= 0 ? `⚠ Échue` : daysLeft <= 7 ? `Prochaine dans ${daysLeft}j` : `Prochaine : ${nextDateStr}`)
      : '';
    const prochainColor = daysLeft !== null && daysLeft <= 0 ? 'var(--red)' : daysLeft !== null && daysLeft <= 7 ? 'var(--orange)' : 'var(--text3)';
    html += `
      <div class="farm-row">
        <div>
          <div class="farm-name">${d.batiment}</div>
          <div style="font-size:11px;color:var(--text3)">Dernier : ${formatDateFR(d.date)} · ${d.operateur}</div>
          ${prochainTxt ? `<div style="font-size:11px;color:${prochainColor};margin-top:2px">${prochainTxt}</div>` : ''}
        </div>
        <div class="farm-right">
          <span class="farm-badge ${badge}">${badgeText}</span>
        </div>
      </div>`;
  });

  // Afficher un résumé de la prochaine échéance en haut
  if (nextGlobalDate) {
    const daysToNext = Math.floor((nextGlobalDate - today) / (1000*60*60*24));
    const nextFR = `${String(nextGlobalDate.getDate()).padStart(2,'0')}/${String(nextGlobalDate.getMonth()+1).padStart(2,'0')}/${nextGlobalDate.getFullYear()}`;
    let alertClass = 'info';
    let alertIcon = '📅';
    let alertMsg = `Prochaine dératisation : ${nextFR} (${nextGlobalBat})`;
    if (daysToNext <= 0) {
      alertClass = 'critical'; alertIcon = '🔴'; alertMsg = `Dératisation en retard : ${nextGlobalBat} (échue depuis ${Math.abs(daysToNext)}j)`;
    } else if (daysToNext <= 7) {
      alertClass = 'warning'; alertIcon = '⏰'; alertMsg = `Prochaine dératisation dans ${daysToNext}j : ${nextGlobalBat} (${nextFR})`;
    }
    html = `
      <div class="alert-item ${alertClass}" style="margin-bottom:10px">
        <div class="alert-icon">${alertIcon}</div>
        <div>
          <div class="alert-text">${alertMsg}</div>
        </div>
      </div>` + html;
  }

  container.innerHTML = html;
}

// ════════════════════════════════════════════════════
//  ALERTES GLOBALES
// ════════════════════════════════════════════════════
function buildAlerts(nt2, sg, controles, stocks, signalements) {
  const alerts = [];

  // Semence
  if (nt2.hasData && nt2.pctDon !== null && nt2.pctDon < 50) {
    alerts.push({ level: 'critical', icon: '🔴', text: `NT2 : taux de don bas (${nt2.pctDon}%)`, sub: 'Semence' });
  }
  if (sg.hasData && sg.pctDon !== null && sg.pctDon < 50) {
    alerts.push({ level: 'critical', icon: '🔴', text: `SG : taux de don bas (${sg.pctDon}%)`, sub: 'Semence' });
  }
  if (nt2.hasData && nt2.taux !== null && Math.abs(nt2.taux - 75) > 25) {
    alerts.push({ level: 'warning', icon: '🟡', text: `NT2 : taux d'utilisation à ${nt2.taux}% (objectif 75%)`, sub: 'Semence' });
  }
  if (sg.hasData && sg.taux !== null && Math.abs(sg.taux - 75) > 25) {
    alerts.push({ level: 'warning', icon: '🟡', text: `SG : taux d'utilisation à ${sg.taux}% (objectif 75%)`, sub: 'Semence' });
  }

  // Contrôles non faits
  for (const [groupKey, group] of Object.entries(FERMES_CONTROLES)) {
    const bats = group.bats;
    const notDone = bats.filter(b => !controles[b] || !controles[b].done);
    const withProblems = bats.filter(b => controles[b] && controles[b].done && controles[b].hasProblem);

    if (notDone.length === bats.length) {
      alerts.push({ level: 'warning', icon: '🌙', text: `Aucun contrôle fait hier : ${group.label}`, sub: 'Contrôles du soir' });
    } else if (notDone.length > 0) {
      alerts.push({ level: 'warning', icon: '🌙', text: `Contrôles manquants ${group.label} : ${notDone.join(', ')}`, sub: 'Contrôles du soir' });
    }
    withProblems.forEach(b => {
      alerts.push({ level: 'critical', icon: '⚠️', text: `Anomalie signalée : ${b}`, sub: controles[b].commentaire || 'Contrôle du soir' });
    });
  }

  // Stocks critiques
  const critical = stocks.filter(s => s.critical);
  if (critical.length) {
    alerts.push({ level: 'critical', icon: '📦', text: `${critical.length} produit(s) en rupture de stock`, sub: critical.map(c => c.nom).join(', ') });
  }

  // Signalements
  if (signalements.ouverts.length > 3) {
    alerts.push({ level: 'warning', icon: '🚨', text: `${signalements.ouverts.length} signalements non résolus`, sub: 'Portail Signalements' });
  }

  if (!alerts.length) {
    alerts.push({ level: 'success', icon: '✅', text: 'Tout est en ordre', sub: headerDateStr() });
  }

  return alerts;
}

function renderAlerts(alerts) {
  const container = document.getElementById('alertList');
  let html = '';
  alerts.forEach(a => {
    const cls = a.level === 'critical' ? 'critical' : a.level === 'warning' ? 'warning' : a.level === 'info' ? 'info' : 'success';
    html += `
      <div class="alert-item ${cls}">
        <div class="alert-icon">${a.icon}</div>
        <div>
          <div class="alert-text">${a.text}</div>
          <div class="alert-sub">${a.sub}</div>
        </div>
      </div>`;
  });
  container.innerHTML = html;
}

// ════════════════════════════════════════════════════
//  CHARGEMENT GLOBAL
// ════════════════════════════════════════════════════
async function loadAll() {
  if (!firebaseOK) {
    setSync('error', 'Firebase non connecté');
    return;
  }

  setSync('loading', 'Chargement…');
  document.getElementById('headerDate').textContent = headerDateStr();

  try {
    const today = todayStr();
    const yesterday = yesterdayStr();

    // Charger tout en parallèle (contrôles : aujourd'hui + hier)
    const [nt2, sg, controlesToday, controlesYesterday, stocks, signalements, astreinte, derat] = await Promise.all([
      loadSemenceNT2(today),
      loadSemenceSG(today),
      loadControles(today),
      loadControles(yesterday),
      loadStocks(),
      loadSignalements(),
      loadAstreinte(),
      loadDerat()
    ]);

    // Fusionner contrôles : priorité à aujourd'hui, fallback sur hier
    const controles = {};
    const controlesDate = {};
    for (const bat of Object.keys({...controlesYesterday, ...controlesToday})) {
      if (controlesToday[bat] && controlesToday[bat].done) {
        controles[bat] = controlesToday[bat];
        controlesDate[bat] = today;
      } else if (controlesYesterday[bat] && controlesYesterday[bat].done) {
        controles[bat] = controlesYesterday[bat];
        controlesDate[bat] = yesterday;
      } else {
        controles[bat] = controlesToday[bat] || controlesYesterday[bat] || { done: false };
        controlesDate[bat] = today;
      }
    }

    // Déterminer la date d'affichage pour les contrôles
    const hasControlesToday = Object.values(controlesToday).some(c => c.done);
    const displayControlesDate = hasControlesToday ? today : yesterday;
    const displayControlesLabel = hasControlesToday ? 'Ce soir' : 'Hier soir';

    // Rendu
    renderSemence(nt2, sg);
    renderControles(controles, displayControlesDate, displayControlesLabel);
    renderStocks(stocks);
    renderSignalements(signalements);
    renderAstreinte(astreinte);
    renderDerat(derat);

    // Alertes globales
    const alerts = buildAlerts(nt2, sg, controles, stocks, signalements);
    renderAlerts(alerts);

    setSync('ok', 'En direct');
    document.getElementById('lastUpdate').textContent = `Dernière maj : ${new Date().toLocaleTimeString('fr-FR')}`;

  } catch(e) {
    console.error('Erreur chargement:', e);
    setSync('error', 'Erreur');
  }
}

// ════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════
document.getElementById('headerDate').textContent = headerDateStr();
loadAll();

// Auto-refresh toutes les 5 minutes
setInterval(loadAll, 5 * 60 * 1000);

</script>
